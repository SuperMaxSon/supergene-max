<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Supergene 기획 허브</title>
    <meta name="description" content="팀이 함께 보는 기획 · 수치 · 검증 문서 인덱스" />
    <meta name="color-scheme" content="light" />
    <link rel="stylesheet" href="style.css?v=light1" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <h1 class="site-title" id="site-title">Supergene 기획 허브</h1>
        <p class="site-sub" id="site-sub"></p>
        <div class="site-meta"><span id="site-updated"></span></div>

        <div class="controls">
          <input
            class="search"
            id="search"
            type="search"
            placeholder="문서 검색 — 제목 · 설명 · 태그"
            autocomplete="off"
          />
        </div>
      </div>
    </header>

    <nav class="nav">
      <div class="wrap nav-inner" id="nav"></div>
    </nav>

    <main class="wrap" id="main"></main>

    <p class="empty" id="empty">검색 결과가 없습니다.</p>

    <footer class="site-footer">
      <div class="wrap">
        문서 추가는 <code>data.js</code> 한 파일만 고치면 됩니다 · Supergene
      </div>
    </footer>

    <!-- data.js 는 문서를 추가할 때마다 바뀌는 유일한 파일이다. GitHub Pages 가
         Cache-Control: max-age=600 을 주므로 버스터가 없으면 새 카드가 최대 10분간
         안 보인다. 날짜 버스터를 쓰고, data.js 의 SITE.updated 와 같은 값으로 맞춘다. -->
    <script src="data.js?v=202608190855"></script>
    <script src="app.js?v=light1"></script>
  </body>
</html>
