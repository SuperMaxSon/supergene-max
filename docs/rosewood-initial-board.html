<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로즈우드 자동 플레이</title>
    <meta
      name="description"
      content="initial_board 63칸을 실제 더미 아이템으로 깔고, 클라 판정 그대로 머지를 자동 재생해 보는 판."
    />
    <meta name="color-scheme" content="light" />
    <link rel="stylesheet" href="../style.css" />
    <style>
      /* 이 <style>은 이 문서 전용이다. 보드 격자(7×9)와 칸 하나의 표현만 정의한다.
         색·테두리·반경은 전부 style.css 토큰을 읽고, 새 색을 만들지 않는다. */
      .rwb-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 18px 0 10px; }
      .rwb-head h1 { margin: 0; font-size: 19px; letter-spacing: -0.01em; }
      .rwb-head .rwb-sub { font-size: 12px; color: var(--text-dim); }

      .rwb-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
      .rwb-btn {
        border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface);
        padding: 7px 13px; font: inherit; font-size: 13px; font-weight: 700; color: var(--text);
        cursor: pointer;
      }
      .rwb-btn:hover { background: var(--surface-2); }
      .rwb-btn.pri { border-color: var(--tool); color: var(--tool); }

      /* ---- 옵션 4개 (부록 D) — 라벨 행 전체가 터치 타깃, 44px 이상 ---- */
      .rwb-opts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
      .rwb-opt {
        display: flex; align-items: center; gap: 9px; flex: 1 1 220px; min-height: 44px;
        padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--surface); cursor: pointer;
      }
      .rwb-opt:hover { background: var(--surface-2); }
      .rwb-opt input { width: 18px; height: 18px; flex: none; accent-color: var(--tool); cursor: pointer; }
      .rwb-opt-txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
      .rwb-opt-txt b { font: 700 12.5px/1.3 system-ui, sans-serif; color: var(--text); }
      .rwb-opt-txt i { font-style: normal; font: 400 10.5px/1.3 system-ui, sans-serif; color: var(--text-faint); }
      .rwb-stat { display: flex; gap: 10px; flex-wrap: wrap; align-content: center; font-size: 11.5px; color: var(--text-dim); }
      .rwb-stat b { color: var(--text); font-variant-numeric: tabular-nums; }

      /* 둔 수 · 에너지는 재생 내내 좇는 값이라 크게 뽑는다. 나머지 잠금 집계는 옆에 작게 붙는다. */
      .rwb-kpis { display: flex; align-items: stretch; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
      .rwb-kpi {
        min-width: 104px; padding: 8px 14px 9px;
        border: 1px solid var(--border); border-left: 4px solid var(--tool);
        border-radius: var(--radius); background: var(--surface);
      }
      .rwb-kpi.e { border-left-color: var(--warn); }
      .rwb-kpi-n {
        font: 800 27px/1.1 system-ui, sans-serif; letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums; color: var(--tool);
      }
      .rwb-kpi.e .rwb-kpi-n { color: #b45309; }
      .rwb-kpi-l { margin-top: 3px; font: 700 11px/1 system-ui, sans-serif; color: var(--text-dim); }
      .rwb-kpi-s { margin-left: 3px; font-weight: 700; color: var(--text-faint); }

      /* 상태줄은 배속이 빠를수록 잘 놓쳐서, 띠로 세우고 바뀔 때 한 번 밝아지게 한다. */
      .rwb-status {
        margin: 0 0 10px; padding: 9px 13px; min-height: 19px;
        border: 1px solid var(--border); border-left: 4px solid var(--text-faint);
        border-radius: var(--radius); background: var(--surface);
        font-size: 13px; font-weight: 700; color: var(--text);
      }
      @keyframes rwbHit { 0% { background: #fff5d8; border-left-color: var(--warn); } 100% { background: var(--surface); border-left-color: var(--text-faint); } }
      .rwb-status.hit { animation: rwbHit 0.5s ease-out; }

      .bgrid {
        /* 본문 폭을 다 쓰면 칸이 과하게 커진다 — 10% 줄여서 로그·상태줄과 같이 한눈에 들어오게 둔다. */
        max-width: 90%;
        position: relative;
        display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
        padding: 10px; border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--surface-2);
      }
      .bc {
        position: relative; aspect-ratio: 1 / 1;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
        border: 1px solid var(--border); border-radius: var(--radius-sm);
        background: var(--surface); overflow: hidden;
      }
      .bc img { width: 58%; height: 58%; object-fit: contain; -webkit-user-drag: none; }
      .bc-c { position: absolute; top: 3px; left: 4px; font: 700 9px/1 system-ui, sans-serif; color: var(--text-faint); }
      .bc-code { font: 800 10px/1 system-ui, sans-serif; color: var(--text-dim); }
      .bc-nm {
        max-width: 96%; font: 700 9px/1.2 system-ui, sans-serif; color: var(--text-faint);
        text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .bc-gen { position: absolute; right: 2px; bottom: 2px; font: 800 9px/1 system-ui, sans-serif;
                color: #b45309; background: #fff7e6; border-radius: 4px; padding: 1px 3px; }

      /* 종이상자 = 덮개. 실제 화면에서는 안이 안 보이지만, 여기서는 무엇이 들었는지
         같이 읽으려고 흐리게 비쳐 둔다. */
      .bc.is-box { background: #efe6da; border-color: #d8c6ab; }
      .bc.is-box img { opacity: 0.3; }
      .bc.is-box .bc-code, .bc.is-box .bc-nm { opacity: 0.55; }
      /* 거미줄 = 집을 수 없는 칸. 대각선을 덮어 표시한다. */
      .bc.is-web { box-shadow: inset 0 0 0 2px #b9c2d4; }
      .bc.is-web::after {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background:
          repeating-linear-gradient(45deg, #ffffffb0 0 1px, transparent 1px 7px),
          repeating-linear-gradient(-45deg, #ffffffb0 0 1px, transparent 1px 7px);
      }
      .bc.is-free { border-color: var(--ok); box-shadow: inset 0 0 0 2px var(--ok); }
      .bc.bc-empty { background: var(--surface-3); border-style: dashed; }

      .bc.is-src { outline: 2px solid var(--text-dim); outline-offset: -2px; }
      .bc.is-dst { outline: 3px solid var(--tool); outline-offset: -3px; }

      /* 날아가는 칩은 보드 안에 절대 배치한다 — 칸 크기가 반응형이라 좌표를 잴 때마다 받는다. */
      .rwb-fly { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 3; display: grid; place-items: center; }
      .rwb-fly img { width: 58%; height: 58%; object-fit: contain; filter: drop-shadow(0 6px 10px rgba(20, 25, 45, 0.28)); }

      @keyframes rwbPop { 0% { transform: scale(0.72); } 55% { transform: scale(1.14); } 100% { transform: scale(1); } }
      .bc.fx-pop img { animation: rwbPop calc(0.42s / var(--sp, 1)) cubic-bezier(.2,.7,.3,1); }
      @keyframes rwbShock { 0% { background: #ffe9c2; } 100% { background: var(--surface); } }
      .bc.fx-shock { animation: rwbShock calc(0.6s / var(--sp, 1)) ease-out; }

      .rwb-lg { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 2px 0; font-size: 11px; color: var(--text-dim); }
      .rwb-lg i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
      .rwb-lg .k1 { background: #efe6da; border: 1px solid #d8c6ab; }
      .rwb-lg .k2 { background: #fff; box-shadow: inset 0 0 0 2px #b9c2d4; }
      .rwb-lg .k3 { background: #fff; box-shadow: inset 0 0 0 2px var(--ok); }

      .rwb-log { margin-top: 14px; max-height: 210px; overflow-y: auto;
                 border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); padding: 4px 0; }
      .rwb-l { padding: 6px 12px; font-size: 12px; line-height: 1.6; border-bottom: 1px solid var(--border-soft); }
      .rwb-l:last-child { border-bottom: 0; }
      .rwb-pop { color: #b45309; font-weight: 700; }
      .rwb-dim { color: var(--text-faint); }
      .rwb-empty { margin: 0; padding: 14px 12px; font-size: 12px; color: var(--text-faint); }

      /* ---- 계정 진행 KPI (레벨·코인·젬·Day·보상함) ---- */
      .rwb-acckpis { display: flex; align-items: stretch; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
      .rwb-akpi {
        min-width: 108px; flex: 1 1 108px; padding: 8px 14px 9px;
        border: 1px solid var(--border); border-left: 4px solid var(--tool);
        border-radius: var(--radius); background: var(--surface);
      }
      .rwb-akpi.coin { border-left-color: #b45309; }
      .rwb-akpi.gem { border-left-color: #9d4fc0; }
      .rwb-akpi.gem.neg { border-left-color: #d32f2f; }
      .rwb-akpi.gem.neg .rwb-akpi-n { color: #d32f2f; }
      .rwb-akpi-negtag { font: 800 10px/1 system-ui, sans-serif; color: #d32f2f; margin-left: 3px; vertical-align: middle; }
      .rwb-akpi.day { border-left-color: var(--ok); }
      .rwb-akpi.rwd { border-left-color: var(--text-faint); }
      .rwb-akpi-n {
        font: 800 22px/1.1 system-ui, sans-serif; letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums; color: var(--text);
      }
      .rwb-akpi-l { margin-top: 3px; font: 700 11px/1 system-ui, sans-serif; color: var(--text-dim); }
      .rwb-akpi-s { margin-left: 3px; font-weight: 700; color: var(--text-faint); }
      .rwb-expbar { margin-top: 6px; height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
      .rwb-expbar-fill { height: 100%; background: var(--tool); border-radius: 3px; }

      /* ---- 누적 통계 (병합·에너지 소모·오더·심부름·충전·판매) ---- */
      .rwb-statrow { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; font-size: 11.5px; color: var(--text-dim); }
      .rwb-statrow span { display: inline-flex; align-items: baseline; gap: 4px; }
      .rwb-statrow b { color: var(--text); font-variant-numeric: tabular-nums; }

      /* ---- 심부름 카드 ---- */
      .rwb-chore {
        display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        margin-bottom: 10px; padding: 9px 13px;
        border: 1px solid var(--border); border-left: 4px solid var(--tool);
        border-radius: var(--radius); background: var(--surface);
      }
      .rwb-chore.blocked { border-left-color: var(--text-faint); }
      .rwb-chore-key { font: 800 11px/1 system-ui, sans-serif; color: var(--text-faint); }
      .rwb-chore-name { font: 700 13px/1.2 system-ui, sans-serif; color: var(--text); }
      .rwb-chore-cost { font-size: 12px; color: var(--text-dim); }
      .rwb-chore-cost b { color: #b45309; font-variant-numeric: tabular-nums; }
      .rwb-chore-state { margin-left: auto; font: 700 11.5px/1 system-ui, sans-serif; padding: 4px 9px; border-radius: 999px; }
      .rwb-chore-state.ok { background: #eef6ef; color: #2f6b45; }
      .rwb-chore-state.blocked { background: var(--surface-2); color: var(--text-dim); }
      .rwb-chore-rewards { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
      .rwb-chip {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 3px 8px; border-radius: 999px; background: var(--surface-2);
        font: 700 11px/1.4 system-ui, sans-serif; color: var(--text-dim);
      }
      .rwb-chip img { width: 15px; height: 15px; object-fit: contain; }
      .rwb-empty2 { padding: 9px 13px; font-size: 12px; color: var(--text-faint);
                    border: 1px dashed var(--border); border-radius: var(--radius); margin-bottom: 10px; }

      /* ---- 상자 개봉 중 칩 ---- */
      .rwb-opening {
        display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 7px 12px;
        border: 1px dashed var(--border); border-radius: var(--radius); background: var(--surface);
        font-size: 12px; color: var(--text-dim);
      }
      .rwb-opening-icon { width: 22px; height: 22px; flex: none; }
      .rwb-opening-icon img { width: 100%; height: 100%; object-fit: contain; }
      .rwb-opening-icon span {
        display: grid; place-items: center; width: 100%; height: 100%;
        border: 1px solid var(--border); border-radius: 5px; background: var(--surface-2);
        font: 700 8px/1 system-ui, sans-serif; color: var(--text-faint);
      }
      .rwb-opening b { color: var(--text); font-variant-numeric: tabular-nums; }

      /* ---- 보상 보관함 띠 ---- */
      .rwb-rewardbox { display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
                        margin-bottom: 10px; padding: 8px 10px;
                        border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
      .rwb-rewardbox-l { font: 700 11px/1 system-ui, sans-serif; color: var(--text-faint); margin-right: 4px; }
      .rwb-rewardbox-l b { color: var(--text); font-variant-numeric: tabular-nums; }
      .rwb-rewardbox-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .rwb-rewardbox-icon {
        position: relative; width: 30px; height: 30px; display: grid; place-items: center; overflow: hidden;
        border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2);
      }
      .rwb-rewardbox-icon img { width: 78%; height: 78%; object-fit: contain; }
      .rwb-rewardbox-icon span {
        font: 700 8px/1 system-ui, sans-serif; color: var(--text-faint); max-width: 100%;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px;
      }
      .rwb-rewardbox-item.next .rwb-rewardbox-icon { border-color: var(--tool); box-shadow: inset 0 0 0 1px var(--tool); }
      .rwb-rewardbox-tag { font: 800 8px/1 system-ui, sans-serif; color: var(--tool); }
      .rwb-rewardbox-more {
        width: 30px; height: 30px; display: grid; place-items: center; border-radius: var(--radius-sm);
        font: 800 10px/1 system-ui, sans-serif; color: var(--text-dim); background: var(--surface-3);
      }
      .rwb-rewardbox-empty { font-size: 12px; color: var(--text-faint); }

      /* ---- 오더 레일 (6칸) ---- */
      .rwb-rail { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 10px; }
      .rwb-railcard {
        position: relative; padding: 17px 10px 8px; border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--surface); min-height: 62px; display: flex; flex-direction: column; gap: 5px; justify-content: center;
      }
      .rwb-railcard.locked { background: var(--surface-2); color: var(--text-faint); align-items: center; justify-content: center; text-align: center; }
      .rwb-railcard-lock { font: 700 12px/1.3 system-ui, sans-serif; color: var(--text-faint); }
      .rwb-railcard-slot { position: absolute; top: 4px; left: 6px; font: 800 9px/1 system-ui, sans-serif; color: var(--text-faint); }
      .rwb-railcard-type {
        position: absolute; top: 4px; left: 18px; right: 30px;
        font: 700 8px/1 system-ui, sans-serif; color: var(--text-faint);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .rwb-railcard-reqs { display: flex; gap: 6px; }
      .rwb-railcard-req { position: relative; width: 36px; height: 36px; }
      .rwb-railcard-req img { width: 100%; height: 100%; object-fit: contain; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); }
      .rwb-railcard-req > span:not(.rwb-mark) {
        display: grid; place-items: center; width: 100%; height: 100%;
        border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2);
        font: 700 8px/1 system-ui, sans-serif; color: var(--text-faint); overflow: hidden;
      }
      .rwb-mark { position: absolute; right: -4px; bottom: -4px; width: 13px; height: 13px; border-radius: 50%;
                  display: grid; place-items: center; font: 800 9px/1 system-ui, sans-serif; color: #fff; }
      .rwb-mark.ok { background: var(--ok); }
      .rwb-mark.x { background: var(--bad); }
      .rwb-railcard-coin { font: 800 12px/1 system-ui, sans-serif; color: #b45309; font-variant-numeric: tabular-nums; }
      .rwb-tag-fixed { position: absolute; top: 4px; right: 6px; font: 800 9px/1 system-ui, sans-serif;
                       color: #7a5a1e; background: #f7f2e8; border-radius: 4px; padding: 1px 4px; }

      .rwb-note { margin: 2px 0 12px; font-size: 11px; color: var(--text-faint); }

      /* ---- 로그 종류 칩 (저채도 구분색) ---- */
      .rwb-k { display: inline-block; padding: 1px 6px; border-radius: 999px; font: 800 10px/1.5 system-ui, sans-serif; margin-right: 6px; }
      .rwb-k.k-chore  { background: #eef2f6; color: #35506b; }
      .rwb-k.k-order  { background: #f5eef2; color: #6b3554; }
      .rwb-k.k-level  { background: #f7f2e8; color: #7a5a1e; }
      .rwb-k.k-reward { background: #eef6ef; color: #2f6b45; }
      .rwb-k.k-sell   { background: #f6f0ea; color: #7a4e2b; }
      .rwb-k.k-energy { background: #fbf3e6; color: #b45309; }
      .rwb-k.k-day    { background: #eef4f6; color: #256373; }
      .rwb-k.k-merge  { background: #f0f0f5; color: #4a4a63; }
      .rwb-k.k-prod   { background: #eef6f2; color: #1f6b52; }
      .rwb-k.k-gem    { background: #f6eef9; color: #6b3585; }
    </style>
  </head>
  <body>
    <nav class="nav">
      <div class="wrap wrap--wide nav-inner">
        <a class="nav-back" href="../index.html">← 허브</a>
        <span class="nav-spacer"></span>
      </div>
    </nav>

    <div class="wrap wrap--wide">
      <div class="rwb-head">
        <h1>로즈우드 자동 플레이</h1>
        <span class="rwb-sub"><b>개발 기획서 v1.11 · 시트 2026-09-21 export</b> · <code>initial_board</code> 63칸 · 7열 × 9행</span>
      </div>

      <div class="rwb-bar">
        <button type="button" class="rwb-btn pri" id="rwbPlay">▶ 재생</button>
        <button type="button" class="rwb-btn" id="rwbStep">⏭ 한 수</button>
        <button type="button" class="rwb-btn" id="rwbSpeed">⏩ 1배속</button>
        <button type="button" class="rwb-btn" id="rwbReset">↺ 보드 초기화</button>
      </div>

      <div class="rwb-opts" id="rwbOpts">
        <label class="rwb-opt">
          <input type="checkbox" id="optEnergyRefill" checked>
          <span class="rwb-opt-txt"><b>에너지 리필</b><i>탭이 막히면 +100 채우고 진행</i></span>
        </label>
        <label class="rwb-opt">
          <input type="checkbox" id="optGemUnlimited" checked>
          <span class="rwb-opt-txt"><b>쥬얼 제한 해제</b><i>젬이 음수로 계속 차감된다</i></span>
        </label>
        <label class="rwb-opt">
          <input type="checkbox" id="optGenNoCooldown">
          <span class="rwb-opt-txt"><b>생산자 타임 제한 해제</b><i>재고 0 즉시 상한까지 리필</i></span>
        </label>
        <label class="rwb-opt">
          <input type="checkbox" id="optChestNoTimer">
          <span class="rwb-opt-txt"><b>체스트 시간 제한 해제</b><i>개봉 시작 즉시 열린다</i></span>
        </label>
      </div>

      <div class="rwb-acckpis" id="rwbAccKpis"></div>

      <div class="rwb-statrow" id="rwbStatsRow"></div>

      <div class="rwb-kpis">
        <div class="rwb-kpi">
          <div class="rwb-kpi-n" id="rwbNmv">0</div>
          <div class="rwb-kpi-l">둔 수</div>
        </div>
        <div class="rwb-kpi e">
          <div class="rwb-kpi-n" id="rwbEnergy">0</div>
          <div class="rwb-kpi-l">에너지 <span class="rwb-kpi-s" id="rwbEnergySub"></span></div>
        </div>
        <div class="rwb-stat">
          <span>상자+거미줄 <b id="rwbNbw">0</b></span>
          <span>거미줄만 <b id="rwbNw">0</b></span>
          <span>상자만 <b id="rwbNb">0</b></span>
