<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coin Match 지면 플로우 맵</title>
    <meta name="description" content="코인 매치 전 지면을 드래그·확대로 훑는 오픈맵. 지면을 누르면 탭이 열려 그 지면의 다이어그램, 버튼을 누르면 호출 사슬 다이어그램까지 3단으로 내려간다." />
    <meta name="color-scheme" content="light" />
  </head>
  <body>
<style>
  :root {
    --bg: #f6f7f9;
    --grid: #e4e8ef;
    --surface: #ffffff;
    --surface-2: #f1f3f7;
    --surface-3: #e9ecf2;
    --ink: #16192a;
    --ink-2: #3c4258;
    --muted: #5a6178;
    --faint: #8b93a8;
    --line: #dfe3ea;
    --line-soft: #eceff4;
    --shadow: rgba(20, 25, 45, .1);
    --shadow-lg: 0 10px 34px rgba(20, 25, 45, .16);

    --c-entry: #0e7490;
    --c-lobby: #1f9e4a;
    --c-game: #1d4ed8;
    --c-result: #a8801a;
    --c-meta: #6d28d9;
    --c-commerce: #dc2626;
    --c-system: #5a6178;

    --t-gate: #d97706;
    --t-net: #1f7fd4;
    --t-ad: #d1542c;
    --t-nav: #1f9e4a;
    --t-call: #5a6178;

    --font-ui: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }

  /* ============ L1 : 오픈맵 ============ */
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  #stage.dragging { cursor: grabbing; }

  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  #wires { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
  #wlabels { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; z-index: 3; }

  .wire { fill: none; stroke: var(--line); stroke-width: 1.6; }
  .wire.trunk { stroke: var(--ink-2); stroke-width: 2.4; }
  .wire.back { stroke: var(--c-lobby); stroke-dasharray: 8 6; stroke-width: 1.8; }
  .wire.branch { stroke: var(--c-entry); stroke-width: 1.8; }

  .wlabel {
    font-family: var(--font-mono);
    font-size: 10.5px;
    fill: var(--muted);
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 4px;
    stroke-linejoin: round;
  }
  .wlabel.strong { fill: var(--ink-2); font-size: 11.5px; }
  /* 선에서 멀리 밀어낸 라벨을 원래 화살표와 이어주는 지시선 */
  .wlead { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
  #wires.focused ~ #wlabels .wlead { opacity: .05; }

  #wires.focused .wire { opacity: .08; }
  #wires.focused .wlabel { opacity: .05; }
  #wires.focused .wire.hot { opacity: 1; stroke-width: 2.6; }
  #wires.focused .wlabel.hot { opacity: 1; }

  /* 카드는 훑는 용도 — 제목 · 역할 한 줄 · 개념도만. 나머지는 지면 팝업에 있다. */
  .node {
    position: absolute;
    display: flex;
    flex-direction: column;
    gap: 5px;
    text-align: left;
    font-family: inherit;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line);
    border-top: 3px solid var(--cc);
    border-radius: 4px;
    padding: 8px 10px 9px;
    box-shadow: 0 1px 2px var(--shadow);
    cursor: pointer;
    transition: box-shadow .13s ease, opacity .13s ease;
  }
  .node:hover { box-shadow: 0 4px 14px var(--shadow); }
  .node:focus-visible { outline: 2px solid var(--cc); outline-offset: 2px; }
  .node.selected { box-shadow: 0 0 0 2px var(--cc), 0 6px 18px var(--shadow); }
  #world.focused .node { opacity: .24; }
  #world.focused .node.hot { opacity: 1; }

  .node { position: absolute; }
  /* 카드 우측 초소형 화면 개념도 — 9:16 세로, 점 하나가 프리팹 버튼 하나.
     좌표를 세로 화면 기준으로 찍으므로 상자도 세로여야 점 배치가 안 뭉개진다. */
  .n-wf {
    position: absolute; top: 8px; right: 9px;
    width: 24px; height: 42.7px;
    border: 1px solid var(--line); border-radius: 2px;
    background: var(--surface-2); pointer-events: none;
  }
  .n-wf u {
    position: absolute; width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px;
    border-radius: 50%; background: var(--cc); opacity: .6; display: block;
  }

  .n-title { font-size: 14.5px; font-weight: 650; letter-spacing: -.012em; line-height: 1.25; padding-right: 46px; }
  .n-ko { font-size: 11px; color: var(--ink-2); }

  /* 진행 칸(rung) — 판 종료 후 7단계와 진입 분기 4경로는 한 줄짜리로 낮게 그린다 (v1.2).
     일반 카드 높이(58~138)로 두면 이 11칸이 세로 예산을 다 먹고,
     fit 줌에서 카드 제목이 합격선 11px 밑으로 떨어진다 (layout.py 머리말의 세로 예산).
     역할 한 줄(ko)은 지면 팝업에 그대로 있다.
     위쪽 3px 색띠는 남긴다 — 정산 · 메타 · 시스템이 색 리듬으로 읽히는 지점이다. */
  .node.rung { padding: 6px 10px 7px; gap: 0; }
  .node.rung .n-title { font-size: 13px; padding-right: 10px; }
  .node.rung .n-ko { display: none; }

  /* 칩 = 이 지면에서 열리는 다른 지면. 화살표 대신 소속으로 표현한다. */
  .n-chips {
    display: flex; flex-wrap: wrap; gap: 4px 5px; align-items: center;
    margin-top: 4px; padding-top: 7px; border-top: 1px dashed var(--line);
  }
  .n-chips .c-h {
    flex: 0 0 100%; display: flex; align-items: center; gap: 6px;
    font-size: 9px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--faint); font-weight: 800; margin: 1px 0 1px;
  }
  .n-chips .c-h em { font-style: normal; color: var(--cc); }
  .n-chips .c-h:not(:first-child) { margin-top: 5px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10.5px; font-weight: 650; line-height: 1.2; color: var(--ink-2);
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 3px 8px 3px 6px;
    white-space: nowrap; cursor: pointer;
  }
  .chip i { width: 5px; height: 5px; border-radius: 50%; background: var(--tc, var(--cc)); flex: 0 0 auto; }
  .chip:hover { border-color: var(--cc); color: var(--ink); background: var(--surface); }
  .chip.on { border-color: var(--cc); color: var(--ink); box-shadow: 0 0 0 2px var(--cc); }
  .chip.zone {
    background: var(--surface); border-style: solid; border-left: 3px solid var(--cc);
    border-radius: 4px; font-weight: 700; color: var(--ink);
  }

  /* 띠 라벨 = 진행 단계의 세로 눈금. 맵을 패닝하면 고정 오버레이 아래로 들어갈 수 있어
     배경을 깔아 어디에 놓여도 읽히게 한다. 맵 조작을 막지 않게 pointer-events 를 끊는다. */
  .band-label {
    position: absolute; left: 70px;
    font-size: 12px; font-weight: 800; letter-spacing: .04em;
    color: var(--muted); pointer-events: none; white-space: nowrap;
    border-left: 3px solid var(--line); padding: 2px 8px 2px 9px; line-height: 1.5;
    background: var(--bg); border-radius: 0 3px 3px 0;
  }

  .cat-entry { --cc: var(--c-entry); }
  .cat-lobby { --cc: var(--c-lobby); }
  .cat-game { --cc: var(--c-game); }
  .cat-result { --cc: var(--c-result); }
  .cat-meta { --cc: var(--c-meta); }
  .cat-commerce { --cc: var(--c-commerce); }
  .cat-system { --cc: var(--c-system); }
  .node.gate { border-top-width: 1px; border-left: 3px solid var(--cc); background: var(--surface-2); }

  /* ============ 크롬 ============ */
  .panel {
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 5px;
    box-shadow: 0 4px 20px var(--shadow);
  }

  #head { top: 14px; left: 14px; padding: 11px 13px; max-width: 318px; }
  #head h1 { margin: 0; font-size: 13px; font-weight: 750; letter-spacing: -.01em; }
  #head p { margin: 4px 0 0; font-size: 10.5px; color: var(--muted); line-height: 1.5; }
  #head b { color: var(--ink-2); font-weight: 650; }
  #legend { display: flex; flex-wrap: wrap; gap: 3px 9px; margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line); }
  #legend span { font-size: 9.5px; color: var(--ink-2); display: flex; align-items: center; gap: 5px; }
  #legend i { width: 8px; height: 8px; border-radius: 1px; display: block; }

  #tools { top: 14px; right: 14px; display: flex; gap: 4px; padding: 6px; z-index: 6; }
  #tools button {
    font-family: inherit; font-size: 11px; font-weight: 650;
    color: var(--ink-2); background: transparent;
    border: 1px solid var(--line); border-radius: 3px;
    padding: 5px 9px; cursor: pointer; min-width: 30px;
  }
  #tools button:hover { background: var(--surface-2); color: var(--ink); }
  #tools button:focus-visible { outline: 2px solid var(--c-lobby); outline-offset: 1px; }
  #zoomval { font-family: var(--font-mono); font-size: 11px; color: var(--muted); display: flex; align-items: center; padding: 0 6px; font-variant-numeric: tabular-nums; }


  /* 검색 — 메소드 · 지면 · 프리팹 · 버튼 이름을 한 상자에서 찾는다.
     맞은 항목을 고르면 그 지면을 열고, 메소드면 그 메소드가 걸린 가지 칸까지 펼친다. */
  #find { top: 56px; right: 14px; width: 342px; padding: 0; z-index: 7; }
  #fx-bar { display: flex; align-items: center; gap: 7px; padding: 6px 9px; }
  #fx-ico { flex: none; font-size: 11px; color: var(--faint); }
  #fx-q {
    flex: 1; min-width: 0; font-family: inherit; font-size: 11.5px; color: var(--ink);
    background: transparent; border: 0; outline: none; padding: 3px 0;
  }
  #fx-q::placeholder { color: var(--faint); }
  #fx-q::-webkit-search-cancel-button { display: none; }
  #fx-n { flex: none; font-family: var(--font-mono); font-size: 9.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  #fx-list { display: none; max-height: min(54vh, 470px); overflow-y: auto; border-top: 1px solid var(--line); }
  #find.open #fx-list { display: block; }
  .fx-it { display: flex; align-items: baseline; gap: 7px; padding: 6px 9px; cursor: pointer; border-bottom: 1px solid var(--line-soft); }
  .fx-it:last-child { border-bottom: 0; }
  .fx-it:hover { background: var(--surface-2); }
  .fx-it.sel { background: var(--surface-2); box-shadow: inset 2px 0 0 var(--cc, var(--c-lobby)); }
  .fx-k { flex: none; font-size: 9px; font-weight: 700; color: #fff; background: var(--cc, var(--c-system)); border-radius: 2px; padding: 1px 4px; letter-spacing: -.01em; }
  .fx-t { flex: 1; min-width: 0; font-size: 11px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fx-t.mono { font-family: var(--font-mono); font-size: 10.5px; }
  .fx-t mark { background: #fde68a; color: inherit; border-radius: 1px; padding: 0 1px; }
  .fx-w { flex: none; max-width: 42%; font-size: 9.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fx-msg { padding: 9px 10px; font-size: 10.5px; color: var(--muted); line-height: 1.5; }
  .fx-msg code { font-family: var(--font-mono); font-size: 9.5px; }

  #hint { bottom: 14px; left: 50%; transform: translateX(-50%); padding: 7px 13px; font-size: 10.5px; color: var(--muted); display: flex; gap: 13px; white-space: nowrap; z-index: 4; }
  #hint b { color: var(--ink-2); font-weight: 650; }

  #mini { bottom: 14px; left: 14px; width: 200px; height: 162px; padding: 6px; cursor: crosshair; z-index: 4; }
  #mini-in { position: relative; width: 100%; height: 100%; }
  #mini .mn { position: absolute; border-radius: 1px; opacity: .5; }
  #mini-vp { position: absolute; border: 1.5px solid var(--c-lobby); background: rgba(31, 158, 74, .1); border-radius: 1px; }

  /* ============ L2/L3 : 탭 도크 ============ */
  /* 노드를 누르면 화면 가운데 팝업으로 띄운다. 다이어그램이 커야 읽히므로 폭을 넓게 쓴다. */
  #veil {
    position: fixed; inset: 0; z-index: 7;
    background: rgba(20, 25, 45, .34);
    backdrop-filter: blur(1.5px);
    display: none;
  }
  #veil.open { display: block; }

  #dock {
    position: fixed; z-index: 8;
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(2240px, 97vw);
    height: min(1200px, 95vh);
    display: none; flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 7px;
    box-shadow: 0 24px 70px rgba(20, 25, 45, .3);
    overflow: hidden;
  }
  #dock.open { display: flex; }

  /* 탭 대신 한 갈래 드릴다운. 헤더에 뒤로 · 현재 경로 · 닫기만 둔다. */
  #dock-head {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px 8px 8px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--line);
  }
  #d-back {
    flex: 0 0 auto;
    font-family: inherit; font-size: 11.5px; font-weight: 700;
    color: var(--ink-2); background: var(--surface);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 6px 11px; cursor: pointer; white-space: nowrap;
  }
  #d-back:hover { color: var(--ink); border-color: var(--muted); }
  #d-back:focus-visible { outline: 2px solid var(--c-lobby); outline-offset: 1px; }
  #d-close {
    flex: 0 0 auto; width: 26px; height: 26px;
    font-family: inherit; font-size: 15px; line-height: 1;
    color: var(--faint); background: transparent;
    border: 1px solid var(--line); border-radius: 4px; cursor: pointer;
  }
  #d-close:hover { color: var(--ink); background: var(--surface); }

  #crumb { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; overflow: hidden; font-size: 11px; }
  .g-node { align-items: flex-start; }
  #crumb .step { color: var(--muted); font-weight: 600; white-space: nowrap; }
  #crumb .sep { color: var(--faint); flex: 0 0 auto; }
  #crumb .cur { color: var(--ink); font-weight: 750; white-space: nowrap; }
  #crumb .lv { flex: 0 0 auto; margin-left: auto; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); border: 1px solid var(--line); border-radius: 2px; padding: 1px 5px; font-weight: 700; }

  #dock-body { overflow-y: auto; padding: 16px 26px 30px; flex: 1; }

  /* ---- 공통: 탭 안 다이어그램 ---- */
  .g-root {
    position: relative;
    border: 1px solid var(--line); border-left: 4px solid var(--cc);
    border-radius: 5px; background: var(--surface-2);
    padding: 11px 13px;
  }
  .g-root .r-cat { font-size: 9px; letter-spacing: .09em; text-transform: uppercase; color: var(--cc); font-weight: 800; }
  .g-root .r-title { font-size: 16.5px; font-weight: 720; letter-spacing: -.015em; margin-top: 3px; }
  .g-root .r-ko { font-size: 11.5px; color: var(--ink-2); margin-top: 2px; }
  .g-root .r-file { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); margin-top: 6px; word-break: break-all; }
  /* 표에 넣기 애매한 한 줄 보충 — 지면 머리 아래에 붙인다 */
  .g-root .r-more { font-size: 11.5px; line-height: 1.6; color: var(--ink-2); margin-top: 8px; max-width: 78ch; }

  .g-lane { margin-top: 15px; }
  .g-lane-h {
    display: flex; align-items: center; gap: 8px;
    font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); font-weight: 800; margin-bottom: 4px;
  }
  .g-lane-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .g-lane-h em { font-style: normal; color: var(--faint); font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 10px; }

  /* 트리: 왼쪽 척추 + 가지마다 팔꿈치 선과 화살촉 */
  .g-tree { position: relative; padding-left: 26px; }
  .g-tree::before {
    content: ""; position: absolute; left: 10px; top: 0; bottom: 20px;
    width: 1px; background: var(--line);
  }
  /* v2 — 세로로 쌓는다. 가로 플렉스로 두면 펼친 .b-flow 가 형제 아이템이 되어
     글자 폭(236px)으로 쪼그라들고, 가로가 남는데 세로로 기어간다. */
  .g-branch { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 0; margin: 6px 0; }
  /* 팔꿈치 선을 칸(.g-branch) 이 아니라 첫 줄(.g-row) 에 건다 —
     세로 플렉스가 되면서 칸 높이가 펼친 내용만큼 늘어나므로, 칸 기준 50% 는 아래로 밀린다.
     줄에 걸면 JS 측정 없이 항상 그 줄 한가운데에 맞는다. */
  .g-branch > .g-row::before {
    content: ""; position: absolute; left: -16px; top: 50%;
    width: 12px; height: 1px; background: var(--line);
  }
  .g-branch > .g-row::after {
    content: ""; position: absolute; left: -5px; top: 50%;
    transform: translateY(-50%);
    border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent;
    border-left: 5px solid var(--line);
  }

  .g-node {
    flex: 1 1 auto; min-width: 0; text-align: left; font-family: inherit;
    display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 9px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-left: 3px solid var(--nc, var(--line));
    border-radius: 4px; padding: 8px 10px; cursor: pointer;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .g-node:hover { border-color: var(--cc); box-shadow: 0 2px 8px var(--shadow); }
  .g-node:focus-visible { outline: 2px solid var(--cc); outline-offset: 2px; }
  .g-node .b-n {
    width: 20px; height: 20px; border-radius: 3px;
    background: var(--surface-2); border: 1px solid var(--line);
    font-family: var(--font-mono); font-size: 9.5px; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
  }
  .g-node:hover .b-n { border-color: var(--cc); color: var(--cc); }
  .g-node .b-main { min-width: 0; }
  .g-node .b-k { font-size: 12.5px; font-weight: 700; line-height: 1.35; word-break: keep-all; }
  .g-node .b-sum {
    font-size: 11px; color: var(--ink-2); line-height: 1.5; margin-top: 3px;
    white-space: normal; word-break: keep-all; overflow-wrap: anywhere;
  }
  .g-node .b-go { font-size: 9.5px; font-weight: 750; color: var(--cc); white-space: nowrap; }

  /* 가지 끝 도착 노드 */
  .g-to {
    display: inline-flex; align-items: center; gap: 5px; flex: 0 0 auto;
    font-family: inherit; font-size: 10px; font-weight: 700; color: var(--ink-2);
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
    padding: 4px 9px 4px 7px; cursor: pointer; max-width: 100%;
  }
  .g-to:hover { border-color: var(--tc); color: var(--ink); background: var(--surface); }
  .g-to i { width: 7px; height: 7px; border-radius: 2px; background: var(--tc); flex: 0 0 auto; }
  .g-to span { white-space: normal; word-break: keep-all; text-align: left; }
  .g-arrow { flex: 0 0 auto; color: var(--faint); font-size: 11px; }

  .n-gate { --nc: var(--t-gate); }
  .n-net { --nc: var(--t-net); }
  .n-ad { --nc: var(--t-ad); }
  .n-nav { --nc: var(--t-nav); }
  .n-call { --nc: var(--t-call); }

  /* 폭이 남는 만큼 레인 열을 늘린다 (2열 고정이면 넓은 화면에서 공간이 남는다). */
  .g-lanes {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 4px 24px; align-items: start;
  }
  .g-lanes > .g-lane.wide { grid-column: 1 / -1; }

  /* 상단 흐름 밴드 : 들어오는 지면 → 현재 → 나가는 지면 (글 대신 도형으로 문맥 제시) */
  .io {
    display: grid; grid-template-columns: 1fr auto minmax(120px, auto) auto 1fr;
    align-items: center; gap: 8px;
    margin-top: 12px; padding: 11px 12px;
    border: 1px solid var(--line); border-radius: 5px; background: var(--surface-2);
  }
  .io-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .io-col.r { align-items: flex-end; }
  .io-now {
    text-align: center; border: 2px solid var(--cc); border-radius: 5px;
    background: var(--surface); padding: 7px 10px;
  }
  .io-now b { display: block; font-size: 12px; font-weight: 750; line-height: 1.25; }
  .io-now span { display: block; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--cc); font-weight: 800; margin-top: 2px; }
  .io-ar { color: var(--faint); font-size: 13px; text-align: center; }
  .io-none { font-size: 10px; color: var(--faint); }
  .io-more { font-size: 9.5px; color: var(--faint); font-weight: 650; }
  .io .g-to { max-width: 100%; }

  /* 2단 본문 = 왼쪽 UI 와이어프레임 · 오른쪽 로직 가지. 좁으면 위아래로 떨어진다.
     프리팹 버튼이 없는 지면은 .one 으로 로직만 전폭 표시한다. */
  .two { display: grid; grid-template-columns: minmax(300px, 24%) 1fr; gap: 28px; align-items: start; margin-top: 14px; }
  .one { margin-top: 14px; }
  @media (max-width: 1100px) { .two { grid-template-columns: 1fr; } }

  .wf-wrap { position: sticky; top: 0; max-width: 420px; }
  /* UGC 모드처럼 가로 화면인 지면은 세로 틀보다 넓게 써야 읽힌다 */
  .wf-wrap.wide { max-width: 760px; }
  /* 게임은 세로 모드다 — 디자인 해상도 720x1280 그대로 9:16
     (intro.fire 의 cc.Canvas._designResolution · fitWidth) */
  .wf {
    position: relative; aspect-ratio: 9 / 16;
    border: 2px solid var(--line); border-radius: 10px;
    background: var(--surface-2); overflow: hidden;
  }
  /* 화면보다 작은 패널 루트 프리팹의 실제 패널 범위 */
  .wf-panel {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    border: 1px dashed var(--line); border-radius: 8px; background: var(--surface);
  }

  /* ── 컨텍스트 · FB 지면 문서 ──────────────────────────────── */
  .t-sep { width: 1px; height: 18px; background: var(--line); margin: 0 2px; }
  .sec-lede { margin: 2px 0 18px; }
  .sec-lede h2 { font-size: 19px; font-weight: 800; margin: 0 0 6px; letter-spacing: -.01em; }
  .sec-lede p { font-size: 13px; line-height: 1.65; color: var(--ink-2); margin: 0; max-width: 74ch; }
  #dock-body h3 {
    font-size: 14px; font-weight: 750; margin: 26px 0 9px;
    padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  #dock-body h3 em { font-style: normal; font-weight: 500; font-size: 12px; color: var(--faint); }
  .warn {
    font-size: 12.5px; line-height: 1.65; margin: 14px 0 4px; padding: 11px 13px;
    border-left: 3px solid var(--c-result); border-radius: 4px; background: var(--surface-2);
  }
  .warn b { color: var(--c-result); }
  .note { font-size: 11.5px; line-height: 1.6; color: var(--faint); margin: 8px 0 0; }

  .fig { margin: 16px 0 6px; }
  .fig svg { width: 100%; height: auto; max-width: 760px; display: block; color: var(--ink); }
  .fig figcaption {
    font-size: 11.5px; line-height: 1.6; color: var(--ink-2);
    margin-top: 9px; max-width: 74ch;
  }
  .sm-box { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
  .sm-box.s-solo { stroke: var(--c-entry); stroke-width: 1.8; }
  .sm-box.s-p2p  { stroke: var(--c-commerce); stroke-width: 1.8; }
  .sm-box.s-tour { stroke: var(--c-event); stroke-width: 1.8; }
  .sm-box.s-fb   { stroke: var(--line); }
  .sm-grp { fill: none; stroke: var(--faint); stroke-width: 1; stroke-dasharray: 4 4; }
  .sm-grp-t { font-size: 11px; font-weight: 700; fill: var(--faint); font-family: inherit; }
  .sm-t { font-size: 14px; font-weight: 800; fill: currentColor; font-family: inherit; }
  .sm-s { font-size: 11px; fill: var(--ink-2); font-family: inherit; }
  .sm-c { font-size: 10.5px; fill: var(--faint); font-family: inherit; }
  .sm-a { stroke: var(--ink-2); stroke-width: 1.3; fill: none; }
  .sm-a.ok { stroke: var(--c-entry); stroke-width: 1.8; }
  .sm-l { font-size: 10.5px; font-weight: 700; fill: var(--ink-2); font-family: inherit; }

  /* 넓은 표는 자기 안에서만 옆으로 흐른다 — 본문이 가로 스크롤되면 안 된다 */
  .tw { overflow-x: auto; margin: 10px 0 4px; }
  .tb { width: 100%; border-collapse: collapse; font-size: 12px; }
  .tb th {
    text-align: left; font-size: 10px; font-weight: 800; text-transform: uppercase;
    letter-spacing: .04em; color: var(--faint); padding: 0 10px 6px 0;
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  .tb td {
    padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line);
    vertical-align: top; line-height: 1.55; word-break: keep-all; overflow-wrap: anywhere;
  }
  .tb td:last-child, .tb th:last-child { padding-right: 0; }
  .tb .mut { color: var(--faint); }
  .sc { font-size: 10.5px; color: var(--faint); white-space: nowrap; }
  .pill {
    font-style: normal; font-size: 9px; font-weight: 800; letter-spacing: .03em;
    padding: 1px 5px; border-radius: 8px; white-space: nowrap;
    color: var(--c-entry); border: 1px solid var(--c-entry);
  }
  .pill.q { color: var(--faint); border-color: var(--line); }
  .lnk {
    font: inherit; font-size: 12px; font-weight: 700; color: var(--c-entry);
    background: none; border: 0; padding: 0; cursor: pointer; text-align: left;
    border-bottom: 1px solid currentColor;
  }

  /* 컨텍스트 배지 — 맵 카드에서 이 지면이 컨텍스트를 건드린다는 표시 */
  .n-ctxb {
    position: absolute; right: 8px; bottom: 7px;
    font-size: 9px; font-weight: 800; letter-spacing: .03em;
    padding: 2px 6px; border-radius: 8px; cursor: pointer;
    color: var(--c-entry); background: var(--surface); border: 1px solid var(--c-entry);
  }
  .n-ctxb:hover { background: var(--c-entry); color: #fff; }

  /* ── 장식 레이어 ── 화면을 알아보게 해주는 비클릭 요소.
     v1 은 cc.Button 만 그려서 화면의 4.5% 만 보였다. 클릭은 버튼만 받아야 하므로
     pointer-events 를 끈다(툴팁은 title 로 브라우저가 띄운다 → auto 로 되돌린다). */
  .wf-d {
    position: absolute; transform: translate(-50%, -50%);
    border-radius: 3px; pointer-events: none; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .wf-d.d-img   { border: 1px solid var(--line); background: var(--surface-2); opacity: .5; }
  .wf-d.d-anim  { border: 1px dashed var(--line); background: none; opacity: .45; }
  .wf-d.d-gauge { border: 1px solid var(--line); background:
    repeating-linear-gradient(90deg, var(--surface-2) 0 5px, transparent 5px 9px); opacity: .7; }
  .wf-d.d-list  { border: 1px solid var(--line); background:
    repeating-linear-gradient(-45deg, var(--surface-2) 0 4px, transparent 4px 8px); opacity: .8; }
  .wf-d.d-lbl   { border: 0; background: none; opacity: 1; }
  .wf-d.d-lbl b {
    font-size: 9px; font-weight: 600; color: var(--ink-2); line-height: 1.05;
    white-space: nowrap; padding: 0 1px; background: var(--surface);
    max-width: 100%; overflow: hidden; text-overflow: clip;
  }
  .wf-d.ctx { opacity: .28; }
  .wf-rep {
    position: absolute; right: 1px; bottom: 0; font-style: normal;
    font-size: 8px; font-weight: 800; color: var(--faint); background: var(--surface);
    padding: 0 2px; border-radius: 2px;
  }
  /* 공통 헤더 — 모든 지면에 상주하는데 어느 팝업 프리팹에도 없다 */
  .wf-d.d-hdr { border: 1px solid var(--c-entry); background: var(--surface); opacity: .85; }
  .wf-d.d-hdr.d-lbl { border: 0; background: none; }
  .wf-d.d-hdr.d-lbl b { color: var(--c-entry); font-weight: 800; }

  .wf-btn {
    position: absolute; transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; font-size: 10.5px; font-weight: 750; line-height: 1.12;
    color: var(--ink); background: var(--surface);
    border: 1px solid var(--nc, var(--line)); border-radius: 4px;
    padding: 2px 3px; cursor: pointer; text-align: center;
  }
  /* 상자는 실제 크기. 글자는 두 줄까지 접어 옆 버튼을 덮지 않게 한다 */
  .wf-btn span {
    background: var(--surface); border-radius: 2px;
    max-width: 132px; word-break: keep-all; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .wf-btn.off { border-style: dashed; opacity: .74; }
  .wf-btn.mv { border-style: dotted; border-width: 2px; }
  /* 같은 프리팹을 공유하는 다른 노드 담당 버튼 — 화면 전체를 보여주되 담당은 구분한다 */
  .wf-btn.ctx {
    opacity: .42; border-color: var(--line); background: var(--surface-2);
    border-left-color: var(--line); font-weight: 600;
  }
  .wf-btn.ctx span { background: var(--surface-2); }
  .wf-btn.ctx:hover { opacity: 1; border-color: var(--cc); }
  .wf-alt, .wf-mv {
    font-style: normal; font-size: 7.5px; font-weight: 800; margin-left: 2px;
    color: var(--cc); vertical-align: super;
  }
  .wf-mv { color: var(--c-warnmark, #b26a00); }
  .wf-btn.big { font-size: 12.5px; font-weight: 800; }
  .wf-btn:hover { z-index: 9; border-color: var(--cc); box-shadow: 0 2px 9px var(--shadow); }
  .wf-btn:hover span { -webkit-line-clamp: 4; max-width: 200px; }
  .wf-btn:hover span { background: var(--surface); }
  .wf-btn:focus-visible { z-index: 9; outline: 2px solid var(--cc); outline-offset: 1px; }
  /* 화면 전체를 덮는 터치 영역 (배경 터치 · 수령 터치 · dim) */
  .wf-full {
    position: absolute; left: 4px; top: 4px; right: 4px; bottom: 4px;
    display: flex; align-items: flex-start; justify-content: flex-end; gap: 4px;
    font-family: inherit; font-size: 9px; font-weight: 750; color: var(--muted);
    background: transparent; border: 1px dashed var(--line); border-radius: 7px;
    padding: 4px 6px; cursor: pointer;
  }
  .wf-full em { font-style: normal; font-size: 8px; color: var(--faint); letter-spacing: .05em; }
  .wf-full:hover { border-color: var(--cc); color: var(--ink); }
  /* 작아서 이름을 못 넣은 버튼 : 번호만 찍고 아래 범례에서 이름을 준다 */
  .wf-btn.tiny { padding: 0; font-size: 9px; }
  .wf-num {
    font-size: 9px; font-weight: 800; color: var(--cc);
    line-height: 1; display: block;
  }
  .wf-key {
    margin-top: 9px; display: flex; flex-wrap: wrap; gap: 5px 6px; align-items: center;
  }
  .wf-key-h {
    flex: 0 0 100%; font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--faint); font-weight: 800;
  }
  .wf-key-i {
    display: inline-flex; align-items: center; gap: 5px; word-break: keep-all;
    font-family: inherit; font-size: 10.5px; font-weight: 700; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 5px; padding: 3px 7px 3px 4px; cursor: pointer;
  }
  .wf-key-i b {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 15px; height: 15px; border-radius: 3px;
    background: var(--surface-2); color: var(--cc); font-size: 9px; font-weight: 800;
  }
  .wf-key-i code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 9px; color: var(--faint); font-weight: 600;
  }
  .wf-key-i:hover { border-color: var(--cc); box-shadow: 0 1px 5px var(--shadow); }
  .wf-key-i.off { border-style: dashed; opacity: .78; }
  .wf-key-i.ctx { opacity: .55; }

  .wf-cap { margin-top: 7px; font-size: 10px; color: var(--muted); line-height: 1.55; }
  .wf-cap b { color: var(--ink-2); }
  .wf-lg { border-bottom: 1px dashed var(--ink-2); }

  /* 3단 본문 : 메소드명 + 한 줄 동작 */
  .f-text code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; font-weight: 700; color: var(--ink);
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 3px; padding: 0 4px;
  }
  .f-d { display: block; font-style: normal; margin-top: 3px; color: var(--ink-2); }
  .b-sum code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px; font-weight: 700; color: var(--ink-2);
  }
  /* 가지 셀 = 한 줄 요약 + 눌러서 펼치는 흐름 (3단을 이 자리로 합쳤다) */
  .g-branch > .g-row { position: relative; display: flex; align-items: flex-start; gap: 7px; flex-wrap: wrap; }
  /* v2 — 펼친 흐름은 칸 전폭을 쓴다 (v1 은 팝업 폭의 11% 밖에 못 썼다) */
  .b-flow { display: none; width: 100%; margin: 9px 0 6px; }
  .g-branch.open > .b-flow { display: block; }
  .g-branch.open .b-go { color: var(--muted); }
  .g-branch.open .b-go::after { content: ""; }
  .g-branch.flash > .g-row .g-node { border-color: var(--cc); box-shadow: 0 0 0 2px var(--cc); }
  .b-flow .f-flow { margin-top: 0; }
  .b-flow .f-step { font-size: 11px; }

  /* v2 — 기본 노출에서 뺀 것들. 숨긴 게 아니라 접은 것이므로 제목에 개수를 적는다. */
  .g-more, .g-inner {
    margin-top: 14px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-2); padding: 10px 13px;
  }
  .g-more { border-left: 3px solid var(--line); }
  .g-more > summary { font-size: 11.5px; font-weight: 750; color: var(--ink-2); cursor: pointer; }
  .g-more[open] > summary { margin-bottom: 10px; }
  .g-more > summary::marker { color: var(--faint); }
  .g-inner summary { font-size: 11px; font-weight: 750; color: var(--muted); cursor: pointer; }
  .g-inner[open] summary { margin-bottom: 10px; }
  /* v2 — 접힘 안도 잘게 쪼개면 같은 문제가 반복된다. 열을 넓게 잡아 2~3열로. */
  .g-more .g-lanes, .g-inner .g-lanes { grid-template-columns: repeat(auto-fill, minmax(660px, 1fr)); }

  .f-raw {
    margin-top: 12px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--surface-2); padding: 8px 11px;
  }
  .f-raw summary { font-size: 10.5px; font-weight: 750; color: var(--muted); cursor: pointer; }
  .f-raw p { margin: 7px 0 0; font-size: 10.5px; line-height: 1.65; color: var(--ink-2); word-break: keep-all; }

  /* ---- 3단: 호출 사슬 플로우 ---- */
  /* v2 — 단계를 가로로 흘린다. 폭이 남으면 옆으로, 모자라면 다음 줄로 접힌다.
     세로로만 쌓으면 가로가 남는데 세로로 길어진다. */
  .f-flow { display: flex; flex-wrap: wrap; align-items: stretch; margin-top: 2px; }
  .f-step {
    flex: 1 1 250px; min-width: 0; max-width: 560px;   /* 한 단계뿐일 때 화면 끝까지 늘어나지 않게 */
    display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;
    border: 1px solid var(--line); border-left: 4px solid var(--st);
    border-radius: 5px; background: var(--surface); padding: 9px 11px;
  }
  .f-step.is-gate { border-style: dashed; background: rgba(217, 119, 6, .045); }
  .f-step.is-end { border-color: var(--st); box-shadow: 0 0 0 1px var(--st) inset; }
  .f-step.can { cursor: pointer; }
  .f-step.can:hover { box-shadow: 0 2px 10px var(--shadow); }
  .f-n {
    font-family: var(--font-mono); font-size: 10px; color: var(--st); font-weight: 750;
    border: 1px solid var(--st); border-radius: 3px; text-align: center; padding: 1px 0;
    opacity: .85;
  }
  .f-body { min-width: 0; }
  .f-type { display: flex; align-items: center; gap: 6px; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; color: var(--st); }
  .f-text { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink); line-height: 1.5; margin-top: 3px; word-break: break-word; }
  .f-open { display: inline-flex; align-items: center; gap: 5px; margin-top: 7px; font-size: 10px; font-weight: 750; color: var(--tc); }
  .f-open i { width: 7px; height: 7px; border-radius: 2px; background: var(--tc); }

  /* 단계 사이 연결선 + 화살촉 (v2 — 가로 배치라 선도 가로로 눕는다) */
  .f-link { position: relative; flex: 0 0 26px; align-self: center; height: 14px; margin: 0; }
  .f-link::before { content: ""; position: absolute; left: 3px; top: 50%; width: 15px; height: 1px; background: var(--line); }
  .f-link::after {
    content: ""; position: absolute; left: 17px; top: 50%; transform: translateY(-50%);
    border-top: 4px solid transparent; border-bottom: 4px solid transparent;
    border-left: 6px solid var(--line);
  }
  /* "다음 / 통과하면" 글자는 뺀다 — 게이트는 이미 점선 테두리와 f-type 이 말해 준다 (텍스트 최소화) */
  .f-link b { display: none; }

  .f-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line-soft); }
  .f-legend span { display: flex; align-items: center; gap: 5px; font-size: 9.5px; color: var(--muted); }
  .f-legend i { width: 3px; height: 11px; border-radius: 1px; }

  .f-note { margin-top: 13px; border: 1px solid var(--line); border-left: 3px solid var(--t-gate); border-radius: 4px; background: var(--surface-2); padding: 10px 12px; }
  .f-note .t { font-size: 9.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--t-gate); }
  .f-note p { margin: 5px 0 0; font-size: 11px; color: var(--ink-2); line-height: 1.55; }
  .f-note code { font-family: var(--font-mono); font-size: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 2px; padding: 0 3px; }

  @media (max-width: 1000px) {
    #mini, #hint { display: none; }
    #find { width: min(342px, 46vw); }
    #dock { width: 96vw; height: 94vh; }
    .io { grid-template-columns: 1fr; }

    result: "결과 · 사후", meta: "머지 · 가챠 · 레이드", commerce: "상점 · 이벤트", system: "시스템 · 공통"
  };

  /* 호출 사슬 안의 메소드명 → 맵 노드. 3단 스텝에서 "이 지면 보기"로 바로 넘어간다. */
  const JUMP = {
    showViewGame: "viewgame", showUGCViewGame: "ugcgame", showViewGameAsync: "picgame",
    showViewAsyncPage: "asyncpage", showViewShop: "shop", showViewRanking: "ranking",
    showViewMail: "mail", showViewUserProfileWithId: "profile", showMyViewUserProfile: "profile",

    showPopupUGCMyStageShare: "p_ugcshare", showPopupFreeCoin: "p_freecoin",
    showPopupHotTime: "p_hottime", showPopupSpecialGift: "p_specgift",
