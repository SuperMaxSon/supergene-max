<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solitaire TriPeaks 지면 플로우 맵</title>
    <meta name="description" content="솔리테어 트라이픽스 전 지면과 버튼별 호출 메소드를 드래그·확대로 훑는 인터랙티브 맵. 상위 문서 docs/solitaire-flow-map.html 에 임베드된다." />
    <meta name="color-scheme" content="light" />
  </head>
  <body>
<style>
  :root {
    --bg: #f6f7f9;
    --grid: #e4e8ef;
    --surface: #ffffff;
    --surface-2: #f1f3f7;
    --ink: #16192a;
    --ink-2: #3c4258;
    --muted: #5a6178;
    --line: #dfe3ea;
    --shadow: rgba(20, 25, 45, .1);

    --c-entry: #0e7490;
    --c-lobby: #1f9e4a;
    --c-game: #1d4ed8;
    --c-result: #a8801a;
    --c-event: #6d28d9;
    --c-commerce: #dc2626;
    --c-system: #5a6178;

    --font-ui: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
  }

  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  #stage.dragging { cursor: grabbing; }

  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  #wires { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }

  .wire { fill: none; stroke: var(--line); stroke-width: 1.6; }
  .wire.trunk { stroke: var(--ink-2); stroke-width: 2.3; }
  .wire.back { stroke: var(--c-lobby); stroke-dasharray: 8 6; stroke-width: 1.8; }
  .wire.branch { stroke: var(--c-entry); stroke-width: 1.8; }

  .wlabel {
    font-family: var(--font-mono);
    font-size: 10.5px;
    fill: var(--muted);
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 4px;
    stroke-linejoin: round;
  }
  .wlabel.strong { fill: var(--ink-2); font-size: 11.5px; }

  #wires.focused .wire { opacity: .09; }
  #wires.focused .wlabel { opacity: .06; }
  #wires.focused .wire.hot { opacity: 1; stroke-width: 2.6; }
  #wires.focused .wlabel.hot { opacity: 1; }

  .node {
    position: absolute;
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: left;
    font-family: inherit;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line);
    border-top: 3px solid var(--cc);
    border-radius: 3px;
    padding: 10px 12px 12px;
    box-shadow: 0 1px 2px var(--shadow);
    cursor: pointer;
    transition: box-shadow .14s ease, opacity .14s ease;
  }
  .node:hover { box-shadow: 0 5px 16px var(--shadow); }
  .node:focus-visible { outline: 2px solid var(--cc); outline-offset: 2px; }
  .node.selected { box-shadow: 0 0 0 2px var(--cc), 0 6px 18px var(--shadow); }
  #world.focused .node { opacity: .26; }
  #world.focused .node.hot { opacity: 1; }

  .n-head { display: flex; align-items: baseline; gap: 8px; }
  .n-cat { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--cc); font-weight: 700; white-space: nowrap; }
  .n-kind { margin-left: auto; font-size: 9.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 2px; padding: 0 4px; white-space: nowrap; }
  .n-title { font-size: 15px; font-weight: 650; letter-spacing: -.01em; line-height: 1.25; }
  .n-ko { font-size: 11.5px; color: var(--ink-2); margin-top: -3px; }
  .n-file { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); word-break: break-all; }

  .n-acts { list-style: none; margin: 4px 0 0; padding: 6px 0 0; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 5px; }
  .n-acts li { display: flex; flex-direction: column; gap: 1px; }
  .n-acts .k { font-size: 10.5px; font-weight: 600; color: var(--ink-2); }
  .n-acts code { font-family: var(--font-mono); font-size: 10px; color: var(--muted); line-height: 1.35; word-break: break-word; }
  .n-more { font-size: 10px; color: var(--cc); font-weight: 600; }

  .cat-entry { --cc: var(--c-entry); }
  .cat-lobby { --cc: var(--c-lobby); }
  .cat-game { --cc: var(--c-game); }
  .cat-result { --cc: var(--c-result); }
  .cat-event { --cc: var(--c-event); }
  .cat-commerce { --cc: var(--c-commerce); }
  .cat-system { --cc: var(--c-system); }

  .node.gate { border-top-width: 1px; border-left: 3px solid var(--cc); background: var(--surface-2); }

  .panel {
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 0 4px 20px var(--shadow);
  }

  #head { top: 14px; left: 14px; padding: 12px 14px; max-width: 336px; }
  #head h1 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
  #head p { margin: 4px 0 0; font-size: 11px; color: var(--muted); line-height: 1.5; }
  #head b { color: var(--ink-2); font-weight: 650; }
  #legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); }
  #legend span { font-size: 10px; color: var(--ink-2); display: flex; align-items: center; gap: 5px; }
  #legend i { width: 9px; height: 9px; border-radius: 1px; display: block; }

  #tools { top: 14px; right: 14px; display: flex; gap: 4px; padding: 6px; z-index: 3; }
  #tools button {
    font-family: inherit; font-size: 11px; font-weight: 600;
    color: var(--ink-2); background: transparent;
    border: 1px solid var(--line); border-radius: 3px;
    padding: 5px 9px; cursor: pointer; min-width: 30px;
  }
  #tools button:hover { background: var(--surface-2); color: var(--ink); }
  #tools button:focus-visible { outline: 2px solid var(--c-lobby); outline-offset: 1px; }
  #zoomval { font-family: var(--font-mono); font-size: 11px; color: var(--muted); display: flex; align-items: center; padding: 0 6px; font-variant-numeric: tabular-nums; }

  #hint { bottom: 14px; left: 50%; transform: translateX(-50%); padding: 7px 14px; font-size: 11px; color: var(--muted); display: flex; gap: 14px; white-space: nowrap; }
  #hint b { color: var(--ink-2); font-weight: 600; }

  #mini { bottom: 14px; left: 14px; width: 214px; height: 168px; padding: 6px; cursor: crosshair; }
  #mini-in { position: relative; width: 100%; height: 100%; }
  #mini .mn { position: absolute; border-radius: 1px; opacity: .5; }
  #mini-vp { position: absolute; border: 1.5px solid var(--c-lobby); background: color-mix(in srgb, var(--c-lobby) 12%, transparent); border-radius: 1px; }

  #insp {
    top: 72px; right: 14px; bottom: 14px; width: 376px;
    display: none; flex-direction: column; padding: 0; overflow: hidden; z-index: 2;
  }
  #insp.open { display: flex; }
  #insp-head { padding: 16px 18px 14px; border-bottom: 1px solid var(--line); position: relative; }
  #insp-cat { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--cc); }
  #insp-title { margin: 5px 0 0; font-size: 18px; font-weight: 680; letter-spacing: -.015em; padding-right: 30px; }
  #insp-ko { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
  #insp-file { font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-top: 7px; word-break: break-all; }
  #insp-close {
    position: absolute; top: 12px; right: 12px;
    width: 26px; height: 26px; border-radius: 3px;
    border: 1px solid var(--line); background: transparent;
    color: var(--muted); font-size: 15px; line-height: 1; cursor: pointer;
  }
  #insp-close:hover { color: var(--ink); background: var(--surface-2); }
  #insp-body { overflow-y: auto; padding: 4px 18px 22px; }
  #insp-body h3 {
    font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); font-weight: 700;
    margin: 18px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line);
  }
  .row { display: flex; flex-direction: column; gap: 2px; padding: 7px 0; border-bottom: 1px dotted var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .rk { font-size: 11.5px; font-weight: 650; color: var(--ink); }
  .row .rv { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-2); line-height: 1.45; word-break: break-word; }
  .goto { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .goto button {
    font-family: inherit; font-size: 10.5px; color: var(--ink-2);
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 2px; padding: 4px 8px; cursor: pointer;
  }
  .goto button:hover { border-color: var(--cc); color: var(--ink); }

  @media (max-width: 900px) {
    #mini, #hint { display: none; }
    #insp { width: auto; left: 14px; top: auto; height: 48vh; }
    #head { max-width: 210px; }
  }
  @media (prefers-reduced-motion: reduce) { .node { transition: none; } }
</style>

<div id="stage">
  <div id="world">
    <svg id="wires" aria-hidden="true">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"></path>
        </marker>
      </defs>
      <g id="wire-g"></g>
      <g id="wlabel-g"></g>
    </svg>
    <div id="nodes"></div>
  </div>
</div>

<div id="head" class="panel">
  <h1>지면 플로우 맵 · 범례</h1>
  <p>드래그로 이동, 휠로 확대·축소. <b>카드를 클릭</b>하면 그 지면의 버튼 → 호출 메소드 전체와 앞뒤 흐름이 오른쪽에 열린다.</p>
  <div id="legend">
    <span><i style="background:var(--c-entry)"></i>진입 · 라우팅</span>
    <span><i style="background:var(--c-lobby)"></i>로비 · 데코</span>
    <span><i style="background:var(--c-game)"></i>인게임</span>
    <span><i style="background:var(--c-result)"></i>결과 · 보상</span>
    <span><i style="background:var(--c-event)"></i>이벤트 · 미션</span>
    <span><i style="background:var(--c-commerce)"></i>상점 · 소셜</span>
    <span><i style="background:var(--c-system)"></i>시스템 · 공통</span>
  </div>
</div>

<div id="tools" class="panel">
  <button id="b-out" title="축소">−</button>
  <div id="zoomval">100%</div>
  <button id="b-in" title="확대">+</button>
  <button id="b-fit">전체</button>
  <button id="b-top">시작점</button>
</div>

<div id="mini" class="panel"><div id="mini-in"><div id="mini-vp"></div></div></div>

<div id="hint" class="panel">
  <span><b>드래그</b> 이동</span>
  <span><b>휠</b> 확대·축소</span>
  <span><b>카드 클릭</b> 메소드 상세</span>
  <span><b>Esc</b> 선택 해제</span>
</div>

<aside id="insp" class="panel">
  <div id="insp-head">
    <div id="insp-cat"></div>
    <h2 id="insp-title"></h2>
    <div id="insp-ko"></div>
    <div id="insp-file"></div>
    <button id="insp-close" title="닫기">×</button>
  </div>
  <div id="insp-body"></div>
</aside>

<script>

    { a: "p_ev_card", b: "entrypopup", ad: "l", bd: "r", boff: 45, via: [{ x: 2560, y: 1440 }, { x: 2030, y: 1440 }], label: "onPlay → 프리게임" },

    { a: "lobby", b: "entrypopup", ad: "b", bd: "t", label: "onClickPlay() → showPopupGameEntry()", kind: "trunk" },
    { a: "entrypopup", b: "viewgame", ad: "b", bd: "t", label: "onClickEnterStage() → startGame()", kind: "trunk" },
    { a: "entrypopup", b: "p_charge", ad: "r", boff: 0, aoff: -45, bd: "l", label: "골드 부족" },
    { a: "entrypopup", b: "p_shop", ad: "r", aoff: -90, bd: "b", mid: 2540, label: "onClickOpenShop()" },

    { a: "viewgame", b: "stage", ad: "r", aoff: -50, bd: "l", label: "카드 탭 → onClickCard()" },
    { a: "viewgame", b: "p_ingameset", ad: "r", aoff: 55, bd: "l", mid: 2530, label: "onClickOption()" },
    { a: "p_ingameset", b: "p_lang", ad: "r", bd: "l", label: "onClickLanguage()" },
    { a: "p_ingameset", b: "lobby", ad: "t", bd: "b", boff: 90, via: [{ x: 2730, y: 1520 }, { x: 2015, y: 1520 }, { x: 2015, y: 1105 }], label: "onClickQuit() → onClickLeave", kind: "back" },
    { a: "viewgame", b: "p_switch", ad: "b", aoff: 150, bd: "l", label: "tryContextSwitch()" },
    { a: "viewgame", b: "p_quit", ad: "b", aoff: -110, bd: "t", mid: 1968, label: "onClickEndLevel()" },
    { a: "viewgame", b: "p_complete", ad: "b", bd: "t", label: "endGame(star, gold)", kind: "trunk" },

    { a: "p_quit", b: "viewgame", ad: "t", aoff: 90, bd: "b", boff: 75, mid: 2036, label: "onClickBack()", kind: "back" },
    { a: "p_quit", b: "retry", ad: "r", bd: "l", mid: 2060, label: "onClickRetry()" },
    { a: "retry", b: "viewgame", ad: "t", bd: "b", boff: 190, mid: 2004, label: "restartImmediatelyForRetry()", kind: "back" },

    { a: "p_quit", b: "session", ad: "b", bd: "l", aoff: -60, boff: 45, label: "onClickQuit() → showViewLobby(_, true)" },
    { a: "p_complete", b: "session", ad: "b", bd: "t", label: "showViewLobby(rewardData)", kind: "trunk" },
    { a: "p_complete", b: "viewgame", ad: "l", bd: "b", boff: -75, via: [{ x: 1385, y: 2230 }, { x: 1385, y: 1994 }], label: "다음판 직행 · showViewSoloGame(result)", kind: "back" },

    { a: "session", b: "lobby", ad: "l", aoff: -45, bd: "t", boff: -90, via: [{ x: 150, y: 2605 }, { x: 150, y: 655 }, { x: 1640, y: 655 }], label: "runPostGameFlow() 완료 → 로비 조작 해제", kind: "back" },
    { a: "session", b: "p_reward", ad: "b", aoff: -230, bd: "t", mid: 2860 },
    { a: "session", b: "p_gift", ad: "b", aoff: -120, bd: "t", mid: 2870 },
    { a: "session", b: "p_shadow", ad: "b", aoff: -20, bd: "t", mid: 2880 },
    { a: "session", b: "p_tutorial", ad: "b", aoff: 90, bd: "t", mid: 2880 },
    { a: "session", b: "p_common", ad: "b", aoff: 180, bd: "t", mid: 2870 },
    { a: "session", b: "p_misc", ad: "b", aoff: 260, bd: "t", mid: 2860 },
    { a: "session", b: "entrypopup", ad: "r", bd: "r", boff: 90, via: [{ x: 2100, y: 2650 }], label: "showPreLevelPopup()" }
  ];

  const CATNAME = {
    entry: "진입 · 라우팅", lobby: "로비 · 데코", game: "인게임",
    result: "결과 · 보상", event: "이벤트 · 미션", commerce: "상점 · 소셜", system: "시스템 · 공통"
  };

  const stage = document.getElementById("stage");
  const world = document.getElementById("world");
  const svg = document.getElementById("wires");
  const wireG = document.getElementById("wire-g");
  const labelG = document.getElementById("wlabel-g");
  const nodeLayer = document.getElementById("nodes");
  const byId = {};
  N.forEach(function (n) { byId[n.id] = n; });

  const esc = function (s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  };

  N.forEach(function (n) {
    const el = document.createElement("button");
    el.type = "button";
    el.className = "node cat-" + n.cat + (n.gate ? " gate" : "");
    el.style.left = n.x + "px";
    el.style.top = n.y + "px";
    el.style.width = n.w + "px";
    el.dataset.id = n.id;

    let html = '<div class="n-head"><span class="n-cat">' + esc(CATNAME[n.cat]) + '</span>'
      + '<span class="n-kind">' + esc(n.kind) + '</span></div>'
      + '<div class="n-title">' + esc(n.title) + '</div>'
      + '<div class="n-ko">' + esc(n.ko) + '</div>'
      + '<div class="n-file">' + esc(n.file) + '</div>';
    if (n.acts && n.acts.length) {
      html += '<ul class="n-acts">';
      n.acts.forEach(function (a) {
        html += '<li><span class="k">' + esc(a[0]) + '</span><code>' + esc(a[1]) + '</code></li>';
      });
      html += "</ul>";
    }
    if (n.more) { html += '<div class="n-more">' + esc(n.more) + "</div>"; }
    el.innerHTML = html;
    nodeLayer.appendChild(el);
    n.el = el;
  });

  let WW = 0, WH = 0;
  const measure = function () {
    let maxX = 0, maxY = 0;
    N.forEach(function (n) {
      n.h = n.el.offsetHeight;
      maxX = Math.max(maxX, n.x + n.w);
      maxY = Math.max(maxY, n.y + n.h);
    });
    WW = maxX + 380;
    WH = maxY + 160;
    world.style.width = WW + "px";
    world.style.height = WH + "px";
    svg.setAttribute("width", WW);
    svg.setAttribute("height", WH);
    svg.setAttribute("viewBox", "0 0 " + WW + " " + WH);
  };

  const anchor = function (n, d, off) {
    const o = off || 0;
    if (d === "t") return { x: n.x + n.w / 2 + o, y: n.y, ax: "v" };
    if (d === "b") return { x: n.x + n.w / 2 + o, y: n.y + n.h, ax: "v" };
    if (d === "l") return { x: n.x, y: n.y + n.h / 2 + o, ax: "h" };
    return { x: n.x + n.w, y: n.y + n.h / 2 + o, ax: "h" };
  };

  const simpleRoute = function (p, q, mid) {
    const pts = [];
    if (p.ax === "v" && q.ax === "v") {
      if (Math.abs(p.x - q.x) > 1) {
        const my = mid != null ? mid : (p.y + q.y) / 2;
        pts.push({ x: p.x, y: my }, { x: q.x, y: my });
      }
    } else if (p.ax === "h" && q.ax === "h") {
      if (Math.abs(p.y - q.y) > 1) {
        const mx = mid != null ? mid : (p.x + q.x) / 2;
        pts.push({ x: mx, y: p.y }, { x: mx, y: q.y });
      }
    } else if (p.ax === "v") {
      pts.push({ x: p.x, y: q.y });
    } else {
      pts.push({ x: q.x, y: p.y });
    }
    return pts;
  };

  const buildPoints = function (p, q, e) {
    let pts = [{ x: p.x, y: p.y }];
    if (e.via && e.via.length) {
      const v0 = e.via[0];
      if (p.ax === "v" && Math.abs(v0.x - p.x) > 1) pts.push({ x: p.x, y: v0.y });
      if (p.ax === "h" && Math.abs(v0.y - p.y) > 1) pts.push({ x: v0.x, y: p.y });
      e.via.forEach(function (v) { pts.push({ x: v.x, y: v.y }); });
      const last = e.via[e.via.length - 1];
      if (q.ax === "v" && Math.abs(last.x - q.x) > 1) pts.push({ x: q.x, y: last.y });
      if (q.ax === "h" && Math.abs(last.y - q.y) > 1) pts.push({ x: last.x, y: q.y });
    } else {
      pts = pts.concat(simpleRoute(p, q, e.mid));
    }
    pts.push({ x: q.x, y: q.y });

    const out = [];
    pts.forEach(function (pt) {
      const prev = out[out.length - 1];
      if (!prev || Math.abs(prev.x - pt.x) > 0.5 || Math.abs(prev.y - pt.y) > 0.5) out.push(pt);
    });
    return out;
  };

  const roundPath = function (pts, r) {
    if (pts.length < 3) {
      return "M " + pts[0].x + " " + pts[0].y + " L " + pts[pts.length - 1].x + " " + pts[pts.length - 1].y;
    }
    let d = "M " + pts[0].x + " " + pts[0].y;
    for (let i = 1; i < pts.length - 1; i++) {
      const a = pts[i - 1], b = pts[i], c = pts[i + 1];
      const d1 = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      const d2 = Math.hypot(c.x - b.x, c.y - b.y) || 1;
      const rr = Math.max(0, Math.min(r, d1 / 2, d2 / 2));
      const p1 = { x: b.x - ((b.x - a.x) / d1) * rr, y: b.y - ((b.y - a.y) / d1) * rr };
      const p2 = { x: b.x + ((c.x - b.x) / d2) * rr, y: b.y + ((c.y - b.y) / d2) * rr };
      d += " L " + p1.x + " " + p1.y + " Q " + b.x + " " + b.y + " " + p2.x + " " + p2.y;
    }
    const last = pts[pts.length - 1];
    d += " L " + last.x + " " + last.y;
    return d;
  };

  const drawWires = function () {
    wireG.innerHTML = "";
    labelG.innerHTML = "";
    E.forEach(function (e) {
      const a = byId[e.a], b = byId[e.b];
      if (!a || !b) return;
      const p = anchor(a, e.ad, e.aoff);
      const q = anchor(b, e.bd, e.boff);
      const pts = buildPoints(p, q, e);

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", roundPath(pts, 14));
      path.setAttribute("class", "wire" + (e.kind ? " " + e.kind : ""));
      path.setAttribute("marker-end", "url(#ah)");
      wireG.appendChild(path);
      e.path = path;

      if (!e.label) { e.lbl = null; return; }
      let best = 0, bl = -1;
      for (let k = 0; k < pts.length - 1; k++) {
        const L = Math.hypot(pts[k + 1].x - pts[k].x, pts[k + 1].y - pts[k].y);
        if (L > bl) { bl = L; best = k; }
      }
      const s = pts[best], t = pts[best + 1];
      const horiz = Math.abs(t.y - s.y) < 1;
      const tx2 = document.createElementNS("http://www.w3.org/2000/svg", "text");
      tx2.setAttribute("x", horiz ? (s.x + t.x) / 2 : (s.x + t.x) / 2 + 7);
      tx2.setAttribute("y", (s.y + t.y) / 2 + (horiz ? -6 : -2));
      tx2.setAttribute("text-anchor", horiz ? "middle" : "start");
      tx2.setAttribute("class", "wlabel" + (e.kind === "trunk" ? " strong" : ""));
      tx2.textContent = e.label;
      labelG.appendChild(tx2);
      e.lbl = tx2;
    });
  };

  /* 미니맵 */
  const mini = document.getElementById("mini");
  const miniIn = document.getElementById("mini-in");
  const miniVp = document.getElementById("mini-vp");
  let mScale = 1;

  const buildMini = function () {
    Array.prototype.slice.call(miniIn.querySelectorAll(".mn")).forEach(function (d) { d.remove(); });
    const r = miniIn.getBoundingClientRect();
    if (!r.width) return;
    mScale = Math.min(r.width / WW, r.height / WH);
    N.forEach(function (n) {
      const d = document.createElement("div");
      d.className = "mn";
      d.style.left = (n.x * mScale) + "px";
      d.style.top = (n.y * mScale) + "px";
      d.style.width = Math.max(2, n.w * mScale) + "px";
      d.style.height = Math.max(2, n.h * mScale) + "px";
      d.style.background = "var(--c-" + n.cat + ")";
      miniIn.appendChild(d);
    });
  };

  /* 트랜스폼 */
  let tx = 0, ty = 0, sc = 1;
  const MIN = 0.14, MAX = 2.2;
  const zoomLabel = document.getElementById("zoomval");

  const apply = function () {
    world.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + sc + ")";
    zoomLabel.textContent = Math.round(sc * 100) + "%";
    stage.style.backgroundSize = (48 * sc) + "px " + (48 * sc) + "px";
    stage.style.backgroundPosition = tx + "px " + ty + "px";
    miniVp.style.left = (-tx / sc * mScale) + "px";
    miniVp.style.top = (-ty / sc * mScale) + "px";
    miniVp.style.width = (stage.clientWidth / sc * mScale) + "px";
    miniVp.style.height = (stage.clientHeight / sc * mScale) + "px";
  };

  const clampScale = function (s) { return Math.max(MIN, Math.min(MAX, s)); };

  const fitAll = function () {
    const pad = 56;
    sc = clampScale(Math.min((stage.clientWidth - pad * 2) / WW, (stage.clientHeight - pad * 2) / WH));
    tx = (stage.clientWidth - WW * sc) / 2;
    ty = (stage.clientHeight - WH * sc) / 2;
    apply();
  };

  const goTop = function () {
    sc = clampScale(0.72);
    const n = byId.intro;
    tx = stage.clientWidth / 2 - (n.x + n.w / 2) * sc;
    ty = 120 - n.y * sc;
    apply();
  };

  const centerOn = function (n) {
    const pad = document.getElementById("insp").classList.contains("open") && window.innerWidth > 900 ? 400 : 0;
    tx = (stage.clientWidth - pad) / 2 - (n.x + n.w / 2) * sc;
    ty = stage.clientHeight / 2 - (n.y + n.h / 2) * sc;
    apply();
  };

  /* 팬 · 줌 */
  let dragging = false, moved = 0, lx = 0, ly = 0, pinchDist = 0;
  const pointers = new Map();

  stage.addEventListener("pointerdown", function (ev) {
    pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pointers.size > 1) { dragging = false; return; }
    dragging = true; moved = 0; lx = ev.clientX; ly = ev.clientY;
    stage.classList.add("dragging");
    try { stage.setPointerCapture(ev.pointerId); } catch (err) { /* noop */ }
  });

  stage.addEventListener("pointermove", function (ev) {
    if (!pointers.has(ev.pointerId)) return;
    pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });

    if (pointers.size === 2) {
      const pp = Array.from(pointers.values());
      const d = Math.hypot(pp[0].x - pp[1].x, pp[0].y - pp[1].y);
      const cx = (pp[0].x + pp[1].x) / 2, cy = (pp[0].y + pp[1].y) / 2;
      if (pinchDist) {
        const ns = clampScale(sc * (d / pinchDist));
        const k = ns / sc;
        tx = cx - (cx - tx) * k;
        ty = cy - (cy - ty) * k;
        sc = ns;
        apply();
      }
      pinchDist = d;
      return;
    }
    if (!dragging) return;
    const dx = ev.clientX - lx, dy = ev.clientY - ly;
    moved += Math.abs(dx) + Math.abs(dy);
    tx += dx; ty += dy; lx = ev.clientX; ly = ev.clientY;
    apply();
  });

  const endPointer = function (ev) {
    pointers.delete(ev.pointerId);
    if (pointers.size < 2) pinchDist = 0;
    if (pointers.size === 0) { dragging = false; stage.classList.remove("dragging"); }
  };
  stage.addEventListener("pointerup", endPointer);
  stage.addEventListener("pointercancel", endPointer);

  stage.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    const ns = clampScale(sc * Math.pow(0.9988, ev.deltaY * (ev.deltaMode === 1 ? 18 : 1)));
    const k = ns / sc;
    tx = ev.clientX - (ev.clientX - tx) * k;
    ty = ev.clientY - (ev.clientY - ty) * k;
    sc = ns;
    apply();
  }, { passive: false });

  const zoomBtn = function (dir) {
    const ns = clampScale(sc * (dir > 0 ? 1.25 : 0.8));
    const cx = stage.clientWidth / 2, cy = stage.clientHeight / 2;
    const k = ns / sc;
    tx = cx - (cx - tx) * k;
    ty = cy - (cy - ty) * k;
    sc = ns;
    apply();
  };
  document.getElementById("b-in").addEventListener("click", function () { zoomBtn(1); });
  document.getElementById("b-out").addEventListener("click", function () { zoomBtn(-1); });
  document.getElementById("b-fit").addEventListener("click", fitAll);
  document.getElementById("b-top").addEventListener("click", goTop);

  mini.addEventListener("pointerdown", function (ev) {
    ev.stopPropagation();
    const r = miniIn.getBoundingClientRect();
    tx = stage.clientWidth / 2 - ((ev.clientX - r.left) / mScale) * sc;
    ty = stage.clientHeight / 2 - ((ev.clientY - r.top) / mScale) * sc;
    apply();
  });

  /* 인스펙터 */
  const insp = document.getElementById("insp");
  const iCat = document.getElementById("insp-cat");
  const iTitle = document.getElementById("insp-title");
  const iKo = document.getElementById("insp-ko");
  const iFile = document.getElementById("insp-file");
  const iBody = document.getElementById("insp-body");
  let selected = null;

  const clearFocus = function () {
    selected = null;
    insp.classList.remove("open");
    world.classList.remove("focused");
    svg.classList.remove("focused");
    N.forEach(function (n) { n.el.classList.remove("hot", "selected"); });
    E.forEach(function (e) {
      if (e.path) e.path.classList.remove("hot");
      if (e.lbl) e.lbl.classList.remove("hot");
    });
  };

  const select = function (id, recenter) {
    const n = byId[id];
    if (!n) return;
    clearFocus();
    selected = id;
    world.classList.add("focused");
    svg.classList.add("focused");
    n.el.classList.add("hot", "selected");

    const ins = [], outs = [];
    E.forEach(function (e) {
      if (e.a !== id && e.b !== id) return;
      if (e.path) e.path.classList.add("hot");
      if (e.lbl) e.lbl.classList.add("hot");
      const other = e.a === id ? e.b : e.a;
      if (byId[other]) byId[other].el.classList.add("hot");
      (e.a === id ? outs : ins).push(e);
    });

    insp.classList.add("open");
    insp.style.setProperty("--cc", "var(--c-" + n.cat + ")");
    iCat.textContent = CATNAME[n.cat] + " · " + n.kind;
    iTitle.textContent = n.title;
    iKo.textContent = n.ko;
    iFile.textContent = n.file;

    let html = "";
    if (n.detail && n.detail.length) {
      n.detail.forEach(function (sec) {
        html += "<h3>" + esc(sec.h) + "</h3>";
        sec.rows.forEach(function (r) {
          html += '<div class="row"><span class="rk">' + esc(r[0]) + '</span><span class="rv">' + esc(r[1]) + "</span></div>";
        });
      });
    } else if (n.acts) {
      html += "<h3>버튼 → 호출 메소드</h3>";
      n.acts.forEach(function (a) {
        html += '<div class="row"><span class="rk">' + esc(a[0]) + '</span><span class="rv">' + esc(a[1]) + "</span></div>";
      });
    }

    if (outs.length) {
      html += "<h3>나가는 흐름 (" + outs.length + ")</h3>";
      outs.forEach(function (e) {
        html += '<div class="row"><span class="rk">→ ' + esc(byId[e.b].title) + '</span>'
          + (e.label ? '<span class="rv">' + esc(e.label) + "</span>" : "")
          + '<span class="goto"><button data-go="' + e.b + '">이 지면 보기</button></span></div>';
      });
    }
    if (ins.length) {
      html += "<h3>들어오는 흐름 (" + ins.length + ")</h3>";
      ins.forEach(function (e) {
        html += '<div class="row"><span class="rk">← ' + esc(byId[e.a].title) + '</span>'
          + (e.label ? '<span class="rv">' + esc(e.label) + "</span>" : "")
          + '<span class="goto"><button data-go="' + e.a + '">이 지면 보기</button></span></div>';
      });
    }
    iBody.innerHTML = html;
    iBody.scrollTop = 0;
    if (recenter !== false) centerOn(n);
  };

  nodeLayer.addEventListener("click", function (ev) {
    const el = ev.target.closest(".node");
    if (!el || moved > 6) return;
    select(el.dataset.id, el.dataset.id !== selected);
  });

  iBody.addEventListener("click", function (ev) {
    const b = ev.target.closest("button[data-go]");
    if (b) select(b.dataset.go, true);
  });

  document.getElementById("insp-close").addEventListener("click", clearFocus);
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { clearFocus(); return; }
    const step = 100;
    if (ev.key === "ArrowLeft") { tx += step; apply(); }
    else if (ev.key === "ArrowRight") { tx -= step; apply(); }
    else if (ev.key === "ArrowUp") { ty += step; apply(); }
    else if (ev.key === "ArrowDown") { ty -= step; apply(); }
  });

  const boot = function () {
    measure();
    drawWires();
    buildMini();
    goTop();
  };
  boot();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { measure(); drawWires(); buildMini(); apply(); });
  }
  window.addEventListener("resize", function () { buildMini(); apply(); });
})();
</script>
