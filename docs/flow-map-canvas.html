<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solitaire TriPeaks 지면 플로우 맵</title>
    <meta name="description" content="솔리테어 트라이픽스 전 지면을 드래그·확대로 훑는 오픈맵. 지면을 누르면 탭이 열려 그 지면의 다이어그램, 버튼을 누르면 호출 사슬 다이어그램까지 3단으로 내려간다." />
    <meta name="color-scheme" content="light" />
  </head>
  <body>
<style>
  :root {
    --bg: #f6f7f9;
    --grid: #e4e8ef;
    --surface: #ffffff;
    --surface-2: #f1f3f7;
    --surface-3: #e9ecf2;
    --ink: #16192a;
    --ink-2: #3c4258;
    --muted: #5a6178;
    --faint: #8b93a8;
    --line: #dfe3ea;
    --line-soft: #eceff4;
    --shadow: rgba(20, 25, 45, .1);
    --shadow-lg: 0 10px 34px rgba(20, 25, 45, .16);

    --c-entry: #0e7490;
    --c-lobby: #1f9e4a;
    --c-game: #1d4ed8;
    --c-result: #a8801a;
    --c-event: #6d28d9;
    --c-commerce: #dc2626;
    --c-system: #5a6178;

    --t-gate: #d97706;
    --t-net: #1f7fd4;
    --t-ad: #d1542c;
    --t-nav: #1f9e4a;
    --t-call: #5a6178;

    --font-ui: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }

  /* ============ L1 : 오픈맵 ============ */
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  #stage.dragging { cursor: grabbing; }

  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  #wires { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }

  .wire { fill: none; stroke: var(--line); stroke-width: 1.6; }
  .wire.trunk { stroke: var(--ink-2); stroke-width: 2.4; }
  .wire.back { stroke: var(--c-lobby); stroke-dasharray: 8 6; stroke-width: 1.8; }
  .wire.branch { stroke: var(--c-entry); stroke-width: 1.8; }

  .wlabel {
    font-family: var(--font-mono);
    font-size: 10.5px;
    fill: var(--muted);
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 4px;
    stroke-linejoin: round;
  }
  .wlabel.strong { fill: var(--ink-2); font-size: 11.5px; }

  #wires.focused .wire { opacity: .08; }
  #wires.focused .wlabel { opacity: .05; }
  #wires.focused .wire.hot { opacity: 1; stroke-width: 2.6; }
  #wires.focused .wlabel.hot { opacity: 1; }

  /* 카드는 훑는 용도 — 제목·역할·대표 호출 한 줄까지만. 상세는 탭에서 본다. */
  .node {
    position: absolute;
    display: flex;
    flex-direction: column;
    gap: 5px;
    text-align: left;
    font-family: inherit;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line);
    border-top: 3px solid var(--cc);
    border-radius: 4px;
    padding: 9px 11px 10px;
    box-shadow: 0 1px 2px var(--shadow);
    cursor: pointer;
    transition: box-shadow .13s ease, opacity .13s ease;
  }
  .node:hover { box-shadow: 0 4px 14px var(--shadow); }
  .node:focus-visible { outline: 2px solid var(--cc); outline-offset: 2px; }
  .node.selected { box-shadow: 0 0 0 2px var(--cc), 0 6px 18px var(--shadow); }
  #world.focused .node { opacity: .24; }
  #world.focused .node.hot { opacity: 1; }

  .node { position: absolute; }
  /* 카드 우측 초소형 화면 개념도 — 16:9 가로, 점 하나가 프리팹 버튼 하나 */
  .n-wf {
    position: absolute; top: 8px; right: 9px;
    width: 40px; height: 22.5px;
    border: 1px solid var(--line); border-radius: 2px;
    background: var(--surface-2); pointer-events: none;
  }
  .n-wf u {
    position: absolute; width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px;
    border-radius: 50%; background: var(--cc); opacity: .6; display: block;
  }

  .n-head { display: flex; align-items: center; gap: 7px; padding-right: 32px; }
  .n-cat { font-size: 9px; letter-spacing: .09em; text-transform: uppercase; color: var(--cc); font-weight: 800; white-space: nowrap; }
  .n-kind { font-size: 9px; color: var(--faint); border: 1px solid var(--line); border-radius: 2px; padding: 0 4px; white-space: nowrap; }
  .n-title { font-size: 14.5px; font-weight: 650; letter-spacing: -.012em; line-height: 1.25; }
  .n-ko { font-size: 11px; color: var(--ink-2); margin-top: -2px; }
  .n-lead { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); line-height: 1.35; border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 2px; }
  .n-foot { display: flex; align-items: center; gap: 6px; font-size: 9.5px; color: var(--cc); font-weight: 700; }
  .n-foot .n-dot { width: 3px; height: 3px; border-radius: 50%; background: currentColor; }

  .cat-entry { --cc: var(--c-entry); }
  .cat-lobby { --cc: var(--c-lobby); }
  .cat-game { --cc: var(--c-game); }
  .cat-result { --cc: var(--c-result); }
  .cat-event { --cc: var(--c-event); }
  .cat-commerce { --cc: var(--c-commerce); }
  .cat-system { --cc: var(--c-system); }
  .node.gate { border-top-width: 1px; border-left: 3px solid var(--cc); background: var(--surface-2); }

  /* ============ 크롬 ============ */
  .panel {
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 5px;
    box-shadow: 0 4px 20px var(--shadow);
  }

  #head { top: 14px; left: 14px; padding: 11px 13px; max-width: 318px; }
  #head h1 { margin: 0; font-size: 13px; font-weight: 750; letter-spacing: -.01em; }
  #head p { margin: 4px 0 0; font-size: 10.5px; color: var(--muted); line-height: 1.5; }
  #head b { color: var(--ink-2); font-weight: 650; }
  #legend { display: flex; flex-wrap: wrap; gap: 3px 9px; margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line); }
  #legend span { font-size: 9.5px; color: var(--ink-2); display: flex; align-items: center; gap: 5px; }
  #legend i { width: 8px; height: 8px; border-radius: 1px; display: block; }

  #tools { top: 14px; right: 14px; display: flex; gap: 4px; padding: 6px; z-index: 6; }
  #tools button {
    font-family: inherit; font-size: 11px; font-weight: 650;
    color: var(--ink-2); background: transparent;
    border: 1px solid var(--line); border-radius: 3px;
    padding: 5px 9px; cursor: pointer; min-width: 30px;
  }
  #tools button:hover { background: var(--surface-2); color: var(--ink); }
  #tools button:focus-visible { outline: 2px solid var(--c-lobby); outline-offset: 1px; }
  #zoomval { font-family: var(--font-mono); font-size: 11px; color: var(--muted); display: flex; align-items: center; padding: 0 6px; font-variant-numeric: tabular-nums; }

  #hint { bottom: 14px; left: 50%; transform: translateX(-50%); padding: 7px 13px; font-size: 10.5px; color: var(--muted); display: flex; gap: 13px; white-space: nowrap; z-index: 4; }
  #hint b { color: var(--ink-2); font-weight: 650; }

  #mini { bottom: 14px; left: 14px; width: 200px; height: 162px; padding: 6px; cursor: crosshair; z-index: 4; }
  #mini-in { position: relative; width: 100%; height: 100%; }
  #mini .mn { position: absolute; border-radius: 1px; opacity: .5; }
  #mini-vp { position: absolute; border: 1.5px solid var(--c-lobby); background: rgba(31, 158, 74, .1); border-radius: 1px; }

  /* ============ L2/L3 : 탭 도크 ============ */
  /* 노드를 누르면 화면 가운데 팝업으로 띄운다. 다이어그램이 커야 읽히므로 폭을 넓게 쓴다. */
  #veil {
    position: fixed; inset: 0; z-index: 7;
    background: rgba(20, 25, 45, .34);
    backdrop-filter: blur(1.5px);
    display: none;
  }
  #veil.open { display: block; }

  #dock {
    position: fixed; z-index: 8;
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(1120px, 92vw);
    height: min(880px, 88vh);
    display: none; flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 7px;
    box-shadow: 0 24px 70px rgba(20, 25, 45, .3);
    overflow: hidden;
  }
  #dock.open { display: flex; }

  /* 탭 대신 한 갈래 드릴다운. 헤더에 뒤로 · 현재 경로 · 닫기만 둔다. */
  #dock-head {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px 8px 8px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--line);
  }
  #d-back {
    flex: 0 0 auto;
    font-family: inherit; font-size: 11.5px; font-weight: 700;
    color: var(--ink-2); background: var(--surface);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 6px 11px; cursor: pointer; white-space: nowrap;
  }
  #d-back:hover { color: var(--ink); border-color: var(--muted); }
  #d-back:focus-visible { outline: 2px solid var(--c-lobby); outline-offset: 1px; }
  #d-close {
    flex: 0 0 auto; width: 26px; height: 26px;
    font-family: inherit; font-size: 15px; line-height: 1;
    color: var(--faint); background: transparent;
    border: 1px solid var(--line); border-radius: 4px; cursor: pointer;
  }
  #d-close:hover { color: var(--ink); background: var(--surface); }

  #crumb { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; overflow: hidden; font-size: 11px; }
  #crumb .step { color: var(--muted); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #crumb .sep { color: var(--faint); flex: 0 0 auto; }
  #crumb .cur { color: var(--ink); font-weight: 750; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #crumb .lv { flex: 0 0 auto; margin-left: auto; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); border: 1px solid var(--line); border-radius: 2px; padding: 1px 5px; font-weight: 700; }

  #dock-body { overflow-y: auto; padding: 16px 22px 26px; flex: 1; }

  /* ---- 공통: 탭 안 다이어그램 ---- */
  .g-root {
    position: relative;
    border: 1px solid var(--line); border-left: 4px solid var(--cc);
    border-radius: 5px; background: var(--surface-2);
    padding: 11px 13px;
  }
  .g-root .r-cat { font-size: 9px; letter-spacing: .09em; text-transform: uppercase; color: var(--cc); font-weight: 800; }
  .g-root .r-title { font-size: 16.5px; font-weight: 720; letter-spacing: -.015em; margin-top: 3px; }
  .g-root .r-ko { font-size: 11.5px; color: var(--ink-2); margin-top: 2px; }
  .g-root .r-file { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); margin-top: 6px; word-break: break-all; }

  .g-lane { margin-top: 15px; }
  .g-lane-h {
    display: flex; align-items: center; gap: 8px;
    font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); font-weight: 800; margin-bottom: 4px;
  }
  .g-lane-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .g-lane-h em { font-style: normal; color: var(--faint); font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 10px; }

  /* 트리: 왼쪽 척추 + 가지마다 팔꿈치 선과 화살촉 */
  .g-tree { position: relative; padding-left: 26px; }
  .g-tree::before {
    content: ""; position: absolute; left: 10px; top: 0; bottom: 20px;
    width: 1px; background: var(--line);
  }
  .g-branch { position: relative; display: flex; align-items: center; gap: 7px; margin: 6px 0; }
  .g-branch::before {
    content: ""; position: absolute; left: -16px; top: 50%;
    width: 12px; height: 1px; background: var(--line);
  }
  .g-branch::after {
    content: ""; position: absolute; left: -5px; top: 50%;
    transform: translateY(-50%);
    border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent;
    border-left: 5px solid var(--line);
  }

  .g-node {
    flex: 1 1 auto; min-width: 0; text-align: left; font-family: inherit;
    display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 9px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-left: 3px solid var(--nc, var(--line));
    border-radius: 4px; padding: 8px 10px; cursor: pointer;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .g-node:hover { border-color: var(--cc); box-shadow: 0 2px 8px var(--shadow); }
  .g-node:focus-visible { outline: 2px solid var(--cc); outline-offset: 2px; }
  .g-node .b-n {
    width: 20px; height: 20px; border-radius: 3px;
    background: var(--surface-2); border: 1px solid var(--line);
    font-family: var(--font-mono); font-size: 9.5px; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
  }
  .g-node:hover .b-n { border-color: var(--cc); color: var(--cc); }
  .g-node .b-main { min-width: 0; }
  .g-node .b-k { font-size: 12.5px; font-weight: 700; line-height: 1.3; }
  .g-node .b-sum { font-family: var(--font-mono); font-size: 10px; color: var(--muted); line-height: 1.4; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g-node .b-go { font-size: 9.5px; font-weight: 750; color: var(--cc); white-space: nowrap; }

  /* 가지 끝 도착 노드 */
  .g-to {
    display: inline-flex; align-items: center; gap: 5px; flex: 0 0 auto;
    font-family: inherit; font-size: 10px; font-weight: 700; color: var(--ink-2);
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
    padding: 4px 9px 4px 7px; cursor: pointer; max-width: 150px;
  }
  .g-to:hover { border-color: var(--tc); color: var(--ink); background: var(--surface); }
  .g-to i { width: 7px; height: 7px; border-radius: 2px; background: var(--tc); flex: 0 0 auto; }
  .g-to span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g-arrow { flex: 0 0 auto; color: var(--faint); font-size: 11px; }

  .n-gate { --nc: var(--t-gate); }
  .n-net { --nc: var(--t-net); }
  .n-ad { --nc: var(--t-ad); }
  .n-nav { --nc: var(--t-nav); }
  .n-call { --nc: var(--t-call); }

  /* 폭이 50%면 레인을 2열로 펴서 스크롤 대신 한눈에 담는다. */
  @media (min-width: 1000px) {
    .g-lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 22px; align-items: start; }
    .g-lanes > .g-lane.wide { grid-column: 1 / -1; }
  }

  /* 상단 흐름 밴드 : 들어오는 지면 → 현재 → 나가는 지면 (글 대신 도형으로 문맥 제시) */
  .io {
    display: grid; grid-template-columns: 1fr auto minmax(120px, auto) auto 1fr;
    align-items: center; gap: 8px;
    margin-top: 12px; padding: 11px 12px;
    border: 1px solid var(--line); border-radius: 5px; background: var(--surface-2);
  }
  .io-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .io-col.r { align-items: flex-end; }
  .io-now {
    text-align: center; border: 2px solid var(--cc); border-radius: 5px;
    background: var(--surface); padding: 7px 10px;
  }
  .io-now b { display: block; font-size: 12px; font-weight: 750; line-height: 1.25; }
  .io-now span { display: block; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--cc); font-weight: 800; margin-top: 2px; }
  .io-ar { color: var(--faint); font-size: 13px; text-align: center; }
  .io-none { font-size: 10px; color: var(--faint); }
  .io-more { font-size: 9.5px; color: var(--faint); font-weight: 650; }
  .io .g-to { max-width: 100%; }

  /* 2단 본문 = 왼쪽 UI 와이어프레임 · 오른쪽 로직 가지. 좁으면 위아래로 떨어진다.
     프리팹 버튼이 없는 지면은 .one 으로 로직만 전폭 표시한다. */
  .two { display: grid; grid-template-columns: minmax(340px, 46%) 1fr; gap: 22px; align-items: start; margin-top: 14px; }
  .one { margin-top: 14px; }
  @media (max-width: 980px) { .two { grid-template-columns: 1fr; } }

  .wf-wrap { position: sticky; top: 0; }
  /* 게임은 가로 모드다 — 디자인 해상도 1280x720 그대로 16:9 */
  .wf {
    position: relative; aspect-ratio: 16 / 9;
    border: 2px solid var(--line); border-radius: 10px;
    background: var(--surface-2); overflow: hidden;
  }
  /* 720x720 같은 패널 루트 프리팹의 실제 패널 범위 */
  .wf-panel {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    border: 1px dashed var(--line); border-radius: 8px; background: var(--surface);
  }
  .wf-btn {
    position: absolute; transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; font-size: 8.5px; font-weight: 750; line-height: 1.15;
    color: var(--ink); background: var(--surface);
    border: 1px solid var(--nc, var(--line)); border-radius: 3px;
    padding: 1px 2px; cursor: pointer; text-align: center;
  }
  /* 상자는 실제 크기, 글자는 넘쳐도 읽히게 둔다 */
  .wf-btn span {
    white-space: nowrap; background: var(--surface);
    padding: 0 1px; border-radius: 2px;
  }
  .wf-btn.off { border-style: dashed; opacity: .74; }
  .wf-btn.mv { border-style: dotted; border-width: 2px; }
  .wf-alt, .wf-mv {
    font-style: normal; font-size: 7.5px; font-weight: 800; margin-left: 2px;
    color: var(--cc); vertical-align: super;
  }
  .wf-mv { color: var(--c-warnmark, #b26a00); }
  .wf-btn.big { font-size: 10px; font-weight: 800; }
  .wf-btn:hover { z-index: 9; border-color: var(--cc); box-shadow: 0 1px 6px var(--shadow); }
  .wf-btn:hover span { background: var(--surface); }
  .wf-btn:focus-visible { z-index: 9; outline: 2px solid var(--cc); outline-offset: 1px; }
  /* 화면 전체를 덮는 터치 영역 (배경 터치 · 수령 터치 · dim) */
  .wf-full {
    position: absolute; left: 4px; top: 4px; right: 4px; bottom: 4px;
    display: flex; align-items: flex-start; justify-content: flex-end; gap: 4px;
    font-family: inherit; font-size: 9px; font-weight: 750; color: var(--muted);
    background: transparent; border: 1px dashed var(--line); border-radius: 7px;
    padding: 4px 6px; cursor: pointer;
  }
  .wf-full em { font-style: normal; font-size: 8px; color: var(--faint); letter-spacing: .05em; }
  .wf-full:hover { border-color: var(--cc); color: var(--ink); }
  .wf-cap { margin-top: 7px; font-size: 10px; color: var(--muted); line-height: 1.55; }
  .wf-cap b { color: var(--ink-2); }
  .wf-lg { border-bottom: 1px dashed var(--ink-2); }

  /* ---- 3단: 호출 사슬 플로우 ---- */
  .f-flow { display: flex; flex-direction: column; margin-top: 2px; }
  .f-step {
    display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;
    border: 1px solid var(--line); border-left: 4px solid var(--st);
    border-radius: 5px; background: var(--surface); padding: 9px 11px;
  }
  .f-step.is-gate { border-style: dashed; background: rgba(217, 119, 6, .045); }
  .f-step.is-end { border-color: var(--st); box-shadow: 0 0 0 1px var(--st) inset; }
  .f-step.can { cursor: pointer; }
  .f-step.can:hover { box-shadow: 0 2px 10px var(--shadow); }
  .f-n {
    font-family: var(--font-mono); font-size: 10px; color: var(--st); font-weight: 750;

  const jumpFor = function (text) {

  /* ── UI : 프리팹 실측 ────────────────────────────────────────
     버튼 위치는 추정하지 않는다. PF(프리팹 파싱 결과)의 좌표를 그대로 쓴다.
     각 버튼의 핸들러명으로 로직 표의 행을 찾아 붙이고, 표에 없던 버튼은
     EXTRA 의 사슬을 담은 섹션을 하나 덧붙여 3단까지 이어지게 한다. */

  /* 섹션 묶음은 노드당 한 번만 만든다 (프리팹 추가 버튼 섹션이 붙는다) */
  const SEC_CACHE = {};
  const baseSections = function (n) {
    if (n.detail && n.detail.length) return n.detail;
    return [{ h: "버튼 → 호출 메소드", rows: (n.acts || []).map(function (a) { return [a[0], a[1]]; }) }];
  };

  const extraOf = function (id, h) {
    return EXTRA[id + ":" + h] || EXTRA[h] || null;
  };

  /* 프리팹 노드 이름 · 라벨 문자열에서 사람이 읽을 이름을 고른다.
     숫자만 있는 라벨(재화 표시 등)은 버튼 이름이 아니므로 버린다. */
  const nameOf = function (b) {
    if (b.L) return b.L;                 /* 경로로 확정한 이름이 가장 정확하다 */
    const t = (b.t || "").trim();
    if (t && !/^[\d,.:%\s+x/-]*$/.test(t) && t.length <= 14) return t;
    if (BTNNAME[b.n] && BTNNAME[b.n] !== "버튼") return BTNNAME[b.n];
    if (b.h) return b.h.replace(/^on(Click|Change)/, "");
    return BTNNAME[b.n] || b.n || "버튼";
  };

  const sectionsOf = function (n) {
    if (SEC_CACHE[n.id]) return SEC_CACHE[n.id];
    const secs = baseSections(n).slice();
    const pf = PF[n.id];
    if (pf) {
      const add = [];
      pf.btns.forEach(function (b) {
        b._sec = -1;
        const re = b.h
          ? new RegExp("\\b" + b.h.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*\\(")
          : null;
        if (re) {
          for (let si = 0; si < secs.length; si++) {
            const rows = secs[si].rows;
            for (let ri = 0; ri < rows.length; ri++) {
              if (re.test(rows[ri][1])) { b._sec = si; b._row = ri; b._label = b.L || rows[ri][0]; return; }
            }
          }
        }
        /* detail 에 없어도 acts(카드 요약)에 있으면 그 사슬을 쓴다 */
        let row = null;
        if (re && n.acts) {
          for (let i = 0; i < n.acts.length; i++) {
            if (re.test(n.acts[i][1])) { row = [n.acts[i][0], n.acts[i][1]]; break; }
          }
        }
        if (!row) {
          const ex = extraOf(n.id, b.h);
          row = ex ? [ex[0], ex[1]]
                   : [nameOf(b), b.h
                        ? b.h + "() — 프리팹에서 확인된 핸들러. 로직 표에는 아직 정리되지 않았다."

        }
        add.push({ b: b, row: row });
      });
      if (add.length) {
        secs.push({ h: "프리팹 실측 · 표 밖 버튼", rows: add.map(function (a) { return a.row; }) });
        const si = secs.length - 1;
        add.forEach(function (a, i) { a.b._sec = si; a.b._row = i; a.b._label = a.b.L || a.row[0]; });
      }
    }
    SEC_CACHE[n.id] = secs;
    return secs;
  };
  const rowCountOf = function (n) {

  };

  const BIG = /PLAY|시작|플레이|받기|수령|그만|다시|계속|구매|스핀|참가/;

  /* 지면의 UI 버튼 = 프리팹 버튼 그대로. 좌표·크기까지 함께 넘긴다. */
  const uiButtons = function (n) {
    const pf = PF[n.id];
    if (!pf) return [];
    sectionsOf(n);   /* _sec/_row 채우기 */
    const secs = SEC_CACHE[n.id];
    const out = pf.btns.map(function (b) {
      const row = secs[b._sec] ? secs[b._sec].rows[b._row] : null;
      const steps = row ? splitChain(row[1]) : [""];
      return {
        label: b._label || nameOf(b), sec: b._sec, row: b._row, steps: steps.length,
        type: stepType(steps[steps.length - 1] || ""), big: BIG.test(b._label || ""),
        x: b.x, y: b.y, w: b.w, h: b.hh, on: b.a === 1,
        moved: b.mv === 1, alt: b.alt || null,
        handler: b.h, node: b.n, full: b.w >= 0.9 && b.hh >= 0.9
      };
    });
    /* 한 로직 행에 버튼이 여러 개 붙는 경우(IAP A/B/C, 인게임 아이템 4종)
       라벨이 똑같아지므로 프리팹 노드 이름으로 갈라준다. */
    const count = function (arr) {
      const c = {};
      arr.forEach(function (x) { c[x.label] = (c[x.label] || 0) + 1; });
      return c;
    };
    let seen = count(out);
    out.forEach(function (x) {                       /* 1차: 프리팹 노드 이름으로 갈라본다 */
      if (seen[x.label] < 2) return;
      const alt = BTNNAME[x.node];
      if (alt && alt !== "버튼" && alt !== x.label) x.label = alt;
    });
    seen = count(out);                               /* 2차: 그래도 남은 동명만 번호를 붙인다 */
    const used = {};
    out.forEach(function (x) {
      if (seen[x.label] < 2) return;
      used[x.label] = (used[x.label] || 0) + 1;
      x.label = x.label + " " + used[x.label];
    });
    return out;
  };

  const stage = document.getElementById("stage");
  const world = document.getElementById("world");
  const svg = document.getElementById("wires");
  const wireG = document.getElementById("wire-g");
  const labelG = document.getElementById("wlabel-g");
  const nodeLayer = document.getElementById("nodes");
  const byId = {};
  N.forEach(function (n) { byId[n.id] = n; });

  /* 카드 우측의 초소형 화면 개념도 — 프리팹 실좌표를 그대로 점으로 찍는다 (16:9) */
  const wfGlyph = function (n) {
    const b = uiButtons(n);
    if (!b.length) return "";
    let o = '<span class="n-wf">';
    b.slice(0, 20).forEach(function (x) {
      if (x.full) return;
      o += '<u style="left:' + (x.x * 100).toFixed(1) + '%;top:' + (x.y * 100).toFixed(1) + '%"></u>';
    });
    return o + '</span>';
  };

  /* ============ L1 카드 ============ */
  N.forEach(function (n) {
    const el = document.createElement("button");
    el.type = "button";
    el.className = "node cat-" + n.cat + (n.gate ? " gate" : "");
    el.style.left = n.x + "px";
    el.style.top = n.y + "px";
    el.style.width = n.w + "px";
    el.dataset.id = n.id;

    const lead = n.acts && n.acts.length ? n.acts[0] : null;
    el.innerHTML =
      '<div class="n-head"><span class="n-cat">' + esc(CATNAME[n.cat]) + '</span>'
      + '<span class="n-kind">' + esc(n.kind) + '</span></div>'
      + '<div class="n-title">' + esc(n.title) + '</div>'
      + '<div class="n-ko">' + esc(n.ko) + '</div>'
      + (lead ? '<div class="n-lead">' + esc(lead[0]) + ' · ' + esc(lead[1]) + '</div>' : '')
      + '<div class="n-foot"><span class="n-dot"></span>UI ' + uiButtons(n).length + ' · 항목 ' + rowCountOf(n) + '</div>'
      + wfGlyph(n);
    nodeLayer.appendChild(el);
    n.el = el;
  });

  /* ============ 월드 크기 · 배선 ============ */
  let WW = 0, WH = 0;
  const measure = function () {
    let maxX = 0, maxY = 0;
    N.forEach(function (n) {
      n.h = n.el.offsetHeight;
      maxX = Math.max(maxX, n.x + n.w);
      maxY = Math.max(maxY, n.y + n.h);
    });
    WW = maxX + 380;
    WH = maxY + 160;
    world.style.width = WW + "px";
    world.style.height = WH + "px";
    svg.setAttribute("width", WW);
    svg.setAttribute("height", WH);
    svg.setAttribute("viewBox", "0 0 " + WW + " " + WH);
  };

  const anchor = function (n, d, off) {
    const o = off || 0;
    if (d === "t") return { x: n.x + n.w / 2 + o, y: n.y, ax: "v" };
    if (d === "b") return { x: n.x + n.w / 2 + o, y: n.y + n.h, ax: "v" };
    if (d === "l") return { x: n.x, y: n.y + n.h / 2 + o, ax: "h" };
    return { x: n.x + n.w, y: n.y + n.h / 2 + o, ax: "h" };
  };

  const simpleRoute = function (p, q, mid) {
    const pts = [];
    if (p.ax === "v" && q.ax === "v") {
      if (Math.abs(p.x - q.x) > 1) {
        const my = mid != null ? mid : (p.y + q.y) / 2;
        pts.push({ x: p.x, y: my }, { x: q.x, y: my });
      }
    } else if (p.ax === "h" && q.ax === "h") {
      if (Math.abs(p.y - q.y) > 1) {
        const mx = mid != null ? mid : (p.x + q.x) / 2;
        pts.push({ x: mx, y: p.y }, { x: mx, y: q.y });
      }
    } else if (p.ax === "v") {
      pts.push({ x: p.x, y: q.y });
    } else {
      pts.push({ x: q.x, y: p.y });
    }
    return pts;
  };

  const buildPoints = function (p, q, e) {
    let pts = [{ x: p.x, y: p.y }];
    if (e.via && e.via.length) {
      const v0 = e.via[0];
      if (p.ax === "v" && Math.abs(v0.x - p.x) > 1) pts.push({ x: p.x, y: v0.y });
      if (p.ax === "h" && Math.abs(v0.y - p.y) > 1) pts.push({ x: v0.x, y: p.y });
      e.via.forEach(function (v) { pts.push({ x: v.x, y: v.y }); });
      const last = e.via[e.via.length - 1];
      if (q.ax === "v" && Math.abs(last.x - q.x) > 1) pts.push({ x: q.x, y: last.y });
      if (q.ax === "h" && Math.abs(last.y - q.y) > 1) pts.push({ x: last.x, y: q.y });
    } else {
      pts = pts.concat(simpleRoute(p, q, e.mid));
    }
    pts.push({ x: q.x, y: q.y });

    const out = [];
    pts.forEach(function (pt) {
      const prev = out[out.length - 1];
      if (!prev || Math.abs(prev.x - pt.x) > 0.5 || Math.abs(prev.y - pt.y) > 0.5) out.push(pt);
    });
    return out;
  };

  const roundPath = function (pts, r) {
    if (pts.length < 3) {
      return "M " + pts[0].x + " " + pts[0].y + " L " + pts[pts.length - 1].x + " " + pts[pts.length - 1].y;
    }
    let d = "M " + pts[0].x + " " + pts[0].y;
    for (let i = 1; i < pts.length - 1; i++) {
      const a = pts[i - 1], b = pts[i], c = pts[i + 1];
      const d1 = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      const d2 = Math.hypot(c.x - b.x, c.y - b.y) || 1;
      const rr = Math.max(0, Math.min(r, d1 / 2, d2 / 2));
      const p1 = { x: b.x - ((b.x - a.x) / d1) * rr, y: b.y - ((b.y - a.y) / d1) * rr };
      const p2 = { x: b.x + ((c.x - b.x) / d2) * rr, y: b.y + ((c.y - b.y) / d2) * rr };
      d += " L " + p1.x + " " + p1.y + " Q " + b.x + " " + b.y + " " + p2.x + " " + p2.y;
    }
    const last = pts[pts.length - 1];
    d += " L " + last.x + " " + last.y;
    return d;
  };

  const drawWires = function () {
    wireG.innerHTML = "";
    labelG.innerHTML = "";
    E.forEach(function (e) {
      const a = byId[e.a], b = byId[e.b];
      if (!a || !b) return;
      const p = anchor(a, e.ad, e.aoff);
      const q = anchor(b, e.bd, e.boff);
      const pts = buildPoints(p, q, e);

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", roundPath(pts, 14));
      path.setAttribute("class", "wire" + (e.kind ? " " + e.kind : ""));
      path.setAttribute("marker-end", "url(#ah)");
      wireG.appendChild(path);
      e.path = path;

      if (!e.label) { e.lbl = null; return; }
      let best = 0, bl = -1;
      for (let k = 0; k < pts.length - 1; k++) {
        const L = Math.hypot(pts[k + 1].x - pts[k].x, pts[k + 1].y - pts[k].y);
        if (L > bl) { bl = L; best = k; }
      }
      const s = pts[best], t = pts[best + 1];
      const horiz = Math.abs(t.y - s.y) < 1;
      const tx2 = document.createElementNS("http://www.w3.org/2000/svg", "text");
      tx2.setAttribute("x", horiz ? (s.x + t.x) / 2 : (s.x + t.x) / 2 + 7);
      tx2.setAttribute("y", (s.y + t.y) / 2 + (horiz ? -6 : -2));
      tx2.setAttribute("text-anchor", horiz ? "middle" : "start");
      tx2.setAttribute("class", "wlabel" + (e.kind === "trunk" ? " strong" : ""));
      tx2.textContent = e.label;
      labelG.appendChild(tx2);
      e.lbl = tx2;
    });
  };

  /* ============ 미니맵 ============ */
  const mini = document.getElementById("mini");
  const miniIn = document.getElementById("mini-in");
  const miniVp = document.getElementById("mini-vp");
  let mScale = 1;

  const buildMini = function () {
    Array.prototype.slice.call(miniIn.querySelectorAll(".mn")).forEach(function (d) { d.remove(); });
    const r = miniIn.getBoundingClientRect();
    if (!r.width) return;
    mScale = Math.min(r.width / WW, r.height / WH);
    N.forEach(function (n) {
      const d = document.createElement("div");
      d.className = "mn";
      d.style.left = (n.x * mScale) + "px";
      d.style.top = (n.y * mScale) + "px";
      d.style.width = Math.max(2, n.w * mScale) + "px";
      d.style.height = Math.max(2, n.h * mScale) + "px";
      d.style.background = "var(--c-" + n.cat + ")";
      miniIn.appendChild(d);
    });
  };

  /* ============ 팬 · 줌 ============ */
  let tx = 0, ty = 0, sc = 1;
  const MIN = 0.14, MAX = 2.2;
  const zoomLabel = document.getElementById("zoomval");
  const dock = document.getElementById("dock");

  /* 팝업은 화면 가운데를 덮으므로 맵 중앙 계산에서 빼는 여백은 없다. */
  const dockPad = function () { return 0; };

  const apply = function () {
    world.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + sc + ")";
    zoomLabel.textContent = Math.round(sc * 100) + "%";
    stage.style.backgroundSize = (48 * sc) + "px " + (48 * sc) + "px";
    stage.style.backgroundPosition = tx + "px " + ty + "px";
    miniVp.style.left = (-tx / sc * mScale) + "px";
    miniVp.style.top = (-ty / sc * mScale) + "px";
    miniVp.style.width = (stage.clientWidth / sc * mScale) + "px";
    miniVp.style.height = (stage.clientHeight / sc * mScale) + "px";
  };

  const clampScale = function (s) { return Math.max(MIN, Math.min(MAX, s)); };

  const fitAll = function () {
    const pad = 56;
    const vw = stage.clientWidth - dockPad();
    sc = clampScale(Math.min((vw - pad * 2) / WW, (stage.clientHeight - pad * 2) / WH));
    tx = (vw - WW * sc) / 2;
    ty = (stage.clientHeight - WH * sc) / 2;
    apply();
  };

  const goTop = function () {
    sc = clampScale(0.72);
    const n = byId.intro;
    tx = (stage.clientWidth - dockPad()) / 2 - (n.x + n.w / 2) * sc;
    ty = 120 - n.y * sc;
    apply();
  };

  const centerOn = function (n) {
    tx = (stage.clientWidth - dockPad()) / 2 - (n.x + n.w / 2) * sc;
    ty = stage.clientHeight / 2 - (n.y + n.h / 2) * sc;
    apply();
  };

  let dragging = false, moved = 0, lx = 0, ly = 0, pinchDist = 0, downNode = null;
  const pointers = new Map();

  stage.addEventListener("pointerdown", function (ev) {
    pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pointers.size > 1) { dragging = false; downNode = null; return; }
    dragging = true; moved = 0; lx = ev.clientX; ly = ev.clientY;
    downNode = ev.target && ev.target.closest ? ev.target.closest(".node") : null;
    stage.classList.add("dragging");
    /* setPointerCapture 를 걸면 click 이 #stage 로 재지정돼 노드 클릭이 죽는다.
       캡처 대신 window 에서 move/up 을 받고, 노드 활성화는 pointerup 에서 직접 판정한다. */
  });

  window.addEventListener("pointermove", function (ev) {
    if (!pointers.has(ev.pointerId)) return;
    pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });

    if (pointers.size === 2) {
      const pp = Array.from(pointers.values());
      const d = Math.hypot(pp[0].x - pp[1].x, pp[0].y - pp[1].y);
      const cx = (pp[0].x + pp[1].x) / 2, cy = (pp[0].y + pp[1].y) / 2;
      if (pinchDist) {
        const ns = clampScale(sc * (d / pinchDist));
        const k = ns / sc;
        tx = cx - (cx - tx) * k;
        ty = cy - (cy - ty) * k;
        sc = ns;
        apply();
      }
      pinchDist = d;
      return;
    }
    if (!dragging) return;
    const dx = ev.clientX - lx, dy = ev.clientY - ly;
    moved += Math.abs(dx) + Math.abs(dy);
    tx += dx; ty += dy; lx = ev.clientX; ly = ev.clientY;
    apply();
  });

  const endPointer = function (ev, cancelled) {
    pointers.delete(ev.pointerId);
    if (pointers.size < 2) pinchDist = 0;
    if (pointers.size > 0) return;
    dragging = false;
    stage.classList.remove("dragging");
    const hit = downNode;
    downNode = null;
    if (!cancelled && hit && moved <= 6) openScreen(hit.dataset.id, { reset: true });
  };
  window.addEventListener("pointerup", function (ev) { endPointer(ev, false); });
  window.addEventListener("pointercancel", function (ev) { endPointer(ev, true); });

  stage.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    const ns = clampScale(sc * Math.pow(0.9988, ev.deltaY * (ev.deltaMode === 1 ? 18 : 1)));
    const k = ns / sc;
    tx = ev.clientX - (ev.clientX - tx) * k;
    ty = ev.clientY - (ev.clientY - ty) * k;
    sc = ns;
    apply();
  }, { passive: false });

  const zoomBtn = function (dir) {
    const ns = clampScale(sc * (dir > 0 ? 1.25 : 0.8));
    const cx = (stage.clientWidth - dockPad()) / 2, cy = stage.clientHeight / 2;
    const k = ns / sc;
    tx = cx - (cx - tx) * k;
    ty = cy - (cy - ty) * k;
    sc = ns;
    apply();
  };
  document.getElementById("b-in").addEventListener("click", function () { zoomBtn(1); });
  document.getElementById("b-out").addEventListener("click", function () { zoomBtn(-1); });
  document.getElementById("b-fit").addEventListener("click", fitAll);
  document.getElementById("b-top").addEventListener("click", goTop);

  mini.addEventListener("pointerdown", function (ev) {
    ev.stopPropagation();
    const r = miniIn.getBoundingClientRect();
    tx = (stage.clientWidth - dockPad()) / 2 - ((ev.clientX - r.left) / mScale) * sc;
    ty = stage.clientHeight / 2 - ((ev.clientY - r.top) / mScale) * sc;
    apply();
  });

  /* ============ 하이라이트 ============ */
  const highlight = function (id) {
    N.forEach(function (n) { n.el.classList.remove("hot", "selected"); });
    E.forEach(function (e) {
      if (e.path) e.path.classList.remove("hot");
      if (e.lbl) e.lbl.classList.remove("hot");
    });
    if (!id) {
      world.classList.remove("focused");
      svg.classList.remove("focused");
      return;
    }
    world.classList.add("focused");
    svg.classList.add("focused");
    byId[id].el.classList.add("hot", "selected");
    E.forEach(function (e) {
      if (e.a !== id && e.b !== id) return;
      if (e.path) e.path.classList.add("hot");
      if (e.lbl) e.lbl.classList.add("hot");
      const other = e.a === id ? e.b : e.a;
      if (byId[other]) byId[other].el.classList.add("hot");
    });
  };

  /* ============ 탭 도크 ============ */
  const crumbEl = document.getElementById("crumb");
  const bodyEl = document.getElementById("dock-body");
  const backBtn = document.getElementById("d-back");

  /* 파고든 순서를 그대로 쌓는 한 갈래 스택. 뒤로가기가 한 칸씩 되돌린다. */
  let stack = [];     /* [{id, view:{sec,row}|null}] */
  const cur = function () { return stack.length ? stack[stack.length - 1] : null; };

  const shortTitle = function (n) {
    return n.title.replace(/\s*·.*$/, "").replace(/\(.*\)/, "").trim().slice(0, 22);
  };

  /* ── 2단 UI 와이어프레임 : 프리팹 좌표를 1280x720 가로 틀에 그대로 올린다 ── */
  const wireframe = function (n, cc) {
    const b = uiButtons(n);
    if (!b.length) return "";                 /* 프리팹 버튼이 없으면 와이어프레임 자체를 두지 않는다 */
    const pf = PF[n.id];

    const full = b.filter(function (x) { return x.full; });
    const spot = b.filter(function (x) { return !x.full; });

    let o = '<div class="wf-wrap"><div class="wf" style="--cc: ' + cc + '">';
    if (pf.panel) {
      o += '<span class="wf-panel" style="width:' + (pf.panel.w * 100).toFixed(1)
        + '%;height:' + (pf.panel.h * 100).toFixed(1) + '%"></span>';
    }
    full.forEach(function (x) {
      o += '<button class="wf-full" data-sec="' + x.sec + '" data-row="' + x.row + '"'
        + ' title="' + esc(x.node + " · " + (x.handler || "핸들러 없음")) + '">'
        + esc(x.label) + ' <em>화면 전체</em></button>';
    });
    spot.forEach(function (x) {
      const w = Math.max(x.w * 100, 6.2), h = Math.max(x.h * 100, 8.5);
      const tip = x.node + " · " + (x.handler || "핸들러 없음") + " · " + x.steps + "단계"
        + (x.on ? "" : " · 프리팹 저장 시점 비활성")
        + (x.moved ? " · 위치는 코드가 런타임에 정함" : "")
        + (x.alt ? "\n같은 자리 변형: " + x.alt.join(", ") : "");
      o += '<button class="wf-btn n-' + x.type + (x.big ? " big" : "") + (x.on ? "" : " off")
        + (x.moved ? " mv" : "") + '" data-sec="' + x.sec + '" data-row="' + x.row + '"'
        + ' style="left:' + (x.x * 100).toFixed(2) + '%;top:' + (x.y * 100).toFixed(2) + '%;'
        + 'width:' + w.toFixed(2) + '%;min-height:' + h.toFixed(2) + '%"'
        + ' title="' + esc(tip) + '">'
        + '<span>' + esc(x.label) + (x.alt ? '<i class="wf-alt">+' + x.alt.length + '</i>' : '')
        + (x.moved ? '<i class="wf-mv">?</i>' : '') + '</span></button>';
    });
    o += '</div>';
    const folded = b.reduce(function (n, x) { return n + (x.alt ? x.alt.length : 0); }, 0);
    const movedN = b.filter(function (x) { return x.moved; }).length;
    o += '<div class="wf-cap"><b>' + esc(pf.src) + '</b> 실측 · 1280&times;720 가로 · 버튼 ' + b.length + '개'
      + (folded ? ' · <b>+n</b> 은 같은 자리에 겹친 상태별 변형 ' + folded + '개' : '')
      + (pf.parked ? ' · 에디터에서 옆으로 빼둔 배타 패널 ' + pf.parked + '개 제외' : '')
      + (movedN ? ' · <b>?</b> 는 코드가 런타임에 위치를 정해 <b>좌표를 믿을 수 없는</b> 버튼 ' + movedN + '개' : '')
      + '<br>회전 · <code>cc.Widget</code> 정렬은 계산하지 않고 프리팹에 저장된 좌표를 씁니다. '
      + '<span class="wf-lg">점선</span>은 프리팹 저장 시점 비활성(런타임 조건부 노출).</div>';
    return o + '</div>';
  };

  /* ---- 2단 : 지면 다이어그램 (흐름 밴드 + 가지 트리) ---- */
  const renderScreen = function (t) {
    const n = byId[t.id];
    const secs = sectionsOf(n);
    const cc = "var(--c-" + n.cat + ")";

    const outs = [], ins = [];
    E.forEach(function (e) {
      if (e.a === t.id) outs.push(e);
      else if (e.b === t.id) ins.push(e);
    });

    let h = '<div class="g-root" style="--cc: ' + cc + '">'
      + '<div class="r-cat">' + esc(CATNAME[n.cat]) + ' · ' + esc(n.kind) + '</div>'
      + '<div class="r-title">' + esc(n.title) + '</div>'
      + '<div class="r-ko">' + esc(n.ko) + '</div>'
      + '<div class="r-file">' + esc(n.file) + '</div></div>';

    /* 문맥은 글로 적지 않고 밴드 하나로 보여준다 : 들어오는 지면 → 현재 → 나가는 지면 */
    const side = function (list, dir, cls) {
      if (!list.length) return '<div class="io-col ' + cls + '"><span class="io-none">없음</span></div>';
      const cap = 5;
      let o = '<div class="io-col ' + cls + '">';
      list.slice(0, cap).forEach(function (e) {
        const other = byId[dir === "out" ? e.b : e.a];
        o += '<button class="g-to" data-jump="' + other.id + '" style="--tc: var(--c-' + other.cat + ')"'
          + ' title="' + esc((e.label || "") + " → " + other.title) + '">'
          + '<i></i><span>' + esc(shortTitle(other)) + '</span></button>';
      });
      if (list.length > cap) o += '<span class="io-more">+' + (list.length - cap) + '개</span>';
      return o + '</div>';
    };

    h += '<div class="io" style="--cc: ' + cc + '">'
      + side(ins, "in", "")
      + '<div class="io-ar">→</div>'
      + '<div class="io-now"><span>현재</span><b>' + esc(shortTitle(n)) + '</b></div>'
      + '<div class="io-ar">→</div>'
      + side(outs, "out", "r")
      + '</div>';

    /* 왼쪽 = UI 와이어프레임, 오른쪽 = 로직 가지. 프리팹 버튼이 없는 지면은 로직만 전폭으로. */
    const wf = wireframe(n, cc);
    h += wf ? '<div class="two">' + wf + '<div>' : '<div class="one"><div>';
    h += '<div class="g-lanes">';
    secs.forEach(function (sec, si) {
      h += '<div class="g-lane' + (sec.rows.length >= 8 ? " wide" : "") + '" style="--cc: ' + cc + '">'
        + '<div class="g-lane-h">' + esc(sec.h) + ' <em>' + sec.rows.length + '</em></div>'
        + '<div class="g-tree">';
      sec.rows.forEach(function (r, ri) {
        const steps = splitChain(r[1]);
        const ty = stepType(steps[steps.length - 1] || r[1]);
        const jid = jumpFor(r[1]);
        const to = jid && jid !== t.id ? byId[jid] : null;
        h += '<div class="g-branch">'
          + '<button class="g-node n-' + ty + '" data-sec="' + si + '" data-row="' + ri + '">'
          + '<span class="b-n">' + (ri + 1) + '</span>'
          + '<span class="b-main"><span class="b-k">' + esc(r[0]) + '</span>'
          + '<span class="b-sum">' + esc(steps[0]) + (steps.length > 1 ? " …" : "") + '</span></span>'
          + '<span class="b-go">' + steps.length + '단계 ▸</span>'
          + '</button>'
          + (to
              ? '<span class="g-arrow">→</span>'
                + '<button class="g-to" data-jump="' + to.id + '" style="--tc: var(--c-' + to.cat + ')" title="' + esc(to.title) + '">'
                + '<i></i><span>' + esc(shortTitle(to)) + '</span></button>'
              : '')
          + '</div>';
      });
      h += '</div></div>';
    });
    h += '</div></div></div>';

    bodyEl.innerHTML = h;
    crumbEl.innerHTML = '<span class="cur">' + esc(shortTitle(n)) + '</span>'
      + '<span class="lv">2단 · UI + 로직</span>';
  };

  /* ---- 3단 : 호출 사슬 플로우 다이어그램 ---- */
  const renderChain = function (t) {
    const n = byId[t.id];
    const sec = sectionsOf(n)[t.view.sec];
    const row = sec.rows[t.view.row];
    const steps = splitChain(row[1]);
    const cc = "var(--c-" + n.cat + ")";

    let h = '<div class="g-root" style="--cc: ' + cc + '">'
      + '<div class="r-cat">' + esc(sec.h) + '</div>'
      + '<div class="r-title">' + esc(row[0]) + '</div>'
      + '<div class="r-ko">' + esc(n.title) + ' · ' + steps.length + '단계</div></div>';

    h += '<div class="g-lane"><div class="g-lane-h">호출 사슬 <em>위에서 아래로</em></div><div class="f-flow">';
    steps.forEach(function (st, i) {
      const ty = stepType(st);
      const jid = jumpFor(st);
      const to = jid && jid !== t.id ? byId[jid] : null;
      const isEnd = i === steps.length - 1;
      if (i > 0) h += '<div class="f-link"><b>' + (stepType(steps[i - 1]) === "gate" ? "통과하면" : "다음") + '</b></div>';
      h += '<div class="f-step st-' + ty + (ty === "gate" ? " is-gate" : "") + (isEnd ? " is-end" : "")
        + (to ? " can" : "") + '"' + (to ? ' data-jump="' + to.id + '" style="--tc: var(--c-' + to.cat + ')"' : '') + '>'
        + '<span class="f-n">' + (i + 1).toString().padStart(2, "0") + '</span>'
        + '<span class="f-body">'
        + '<span class="f-type">' + TYPENAME[ty] + (isEnd ? " · 도착" : "") + '</span>'
        + '<span class="f-text">' + esc(st) + '</span>'
        + (to ? '<span class="f-open"><i></i>' + esc(shortTitle(to)) + ' 다이어그램 열기 ▸</span>' : '')
        + '</span></div>';
    });
    h += '</div></div>';

    h += '<div class="f-legend">'
      + '<span><i style="background:var(--t-gate)"></i>게이트 · 판정</span>'
      + '<span><i style="background:var(--t-net)"></i>서버 호출</span>'
      + '<span><i style="background:var(--t-ad)"></i>광고</span>'
      + '<span><i style="background:var(--t-nav)"></i>지면 이동</span>'
      + '<span><i style="background:var(--t-call)"></i>호출</span>'
      + '</div>';

    h += '<div class="f-note"><div class="t">단계 구분 기준</div>'
      + '<p>점선 = 통과해야 넘어가는 게이트 · 두꺼운 마지막 상자 = 도착. 유형은 메소드명으로 자동 분류하므로 '
      + '분기 조건은 파일에서 최종 확인하세요.</p></div>';

    bodyEl.innerHTML = h;
    crumbEl.innerHTML = '<span class="step">' + esc(shortTitle(n)) + '</span>'
      + '<span class="sep">›</span><span class="cur">' + esc(row[0]) + '</span>'
      + '<span class="lv">3단 · 호출 사슬</span>';
  };

  const veil = document.getElementById("veil");

  const renderBody = function () {
    const t = cur();
    if (!t) {
      dock.classList.remove("open");
      veil.classList.remove("open");
      crumbEl.innerHTML = "";
      bodyEl.innerHTML = "";
      highlight(null);
      return;
    }
    dock.classList.add("open");
    veil.classList.add("open");
    backBtn.textContent = stack.length > 1 ? "← 뒤로" : "← 맵으로";
    if (t.view) renderChain(t); else renderScreen(t);
    bodyEl.scrollTop = 0;
    highlight(t.id);
  };

  /* 지면 열기 = 스택에 한 칸 쌓기. 맵에서 새로 누르면 스택을 비우고 다시 시작한다. */
  const openScreen = function (id, opts) {
    const o = opts || {};
    if (o.reset) stack = [];
    stack.push({ id: id, view: null });
    renderBody();
    if (o.recenter !== false) centerOn(byId[id]);
  };

  const openChain = function (sec, row) {
    const t = cur();
    if (!t) return;
    stack.push({ id: t.id, view: { sec: sec, row: row } });
    renderBody();
  };

  const goBack = function () {
    stack.pop();
    renderBody();
    const t = cur();
    if (t) centerOn(byId[t.id]);
  };

  const closeAll = function () {
    stack = [];
    renderBody();
  };

  /* 키보드 활성화(Enter · Space)는 detail 0 의 click 으로 온다. 포인터 클릭은 pointerup 이 처리. */
  nodeLayer.addEventListener("click", function (ev) {
    if (ev.detail !== 0) return;
    const el = ev.target.closest(".node");
    if (el) openScreen(el.dataset.id, { reset: true });
  });

  bodyEl.addEventListener("click", function (ev) {
    const jump = ev.target.closest("[data-jump]");
    if (jump) { openScreen(jump.dataset.jump, {}); return; }
    const node = ev.target.closest(".g-node, .wf-btn, .wf-full");
    if (node) openChain(parseInt(node.dataset.sec, 10), parseInt(node.dataset.row, 10));
  });

  backBtn.addEventListener("click", goBack);
  document.getElementById("d-close").addEventListener("click", closeAll);
  document.getElementById("veil").addEventListener("click", closeAll);

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { goBack(); return; }
    if (ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
    const step = 100;
    if (ev.key === "ArrowLeft") { tx += step; apply(); }
    else if (ev.key === "ArrowRight") { tx -= step; apply(); }
    else if (ev.key === "ArrowUp") { ty += step; apply(); }
    else if (ev.key === "ArrowDown") { ty -= step; apply(); }
  });

  /* ============ 부팅 ============ */
  /* 문서에 임베드된 경우엔 새 탭으로 크게 여는 버튼을 붙인다. */
  if (window.self !== window.top) {
    const full = document.createElement("button");
    full.id = "b-full";
    full.textContent = "크게 보기";
    full.title = "새 탭에서 맵만 열기";
    full.addEventListener("click", function () {
      window.open(window.location.href, "_blank", "noopener");
    });
    document.getElementById("tools").appendChild(full);
  }

  const boot = function () {
    measure();
    drawWires();
    buildMini();
    goTop();
  };
  boot();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { measure(); drawWires(); buildMini(); apply(); });
  }
  window.addEventListener("resize", function () { buildMini(); apply(); });
})();
</script>
  </body>
</html>
