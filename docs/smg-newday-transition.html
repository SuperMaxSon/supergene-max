<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>새날 전환 영상 녹화</title>
    <meta name="description" content="심부름 마지막 채팅이 끝난 뒤 새날 전환 영상이 나오는 모습을 day 별로 녹화한 영상 7개." />
    <meta name="color-scheme" content="light" />
    <link rel="stylesheet" href="../style.css" />
    <!-- figure.shot 은 img 만 카드 폭에 맞춘다. 영상 7개를 같은 격자에 놓으려면 video 도 폭을 맞춰야 해서 한 줄만 더한다(style.css 는 건드리지 않음). -->
    <style>
      figure.shot video { display: block; width: 100%; height: auto; background: #000; }
    </style>
  </head>
  <body>
    <nav class="nav">
      <div class="wrap wrap--wide nav-inner">
        <a class="nav-back" href="../index.html">← 허브</a>
        <a class="nav-back" href="#videos">영상</a>
        <span class="nav-spacer"></span>
      </div>
    </nav>

    <header class="doc-header">
      <div class="wrap wrap--wide">
        <div class="doc-eyebrow">검증 · 스토리 머지 연출</div>
        <h1 class="doc-title">새날 전환 영상 녹화 <span class="pill" style="--acc: var(--smg)">시트 v1.25</span></h1>
        <p class="doc-lede">
          전날 마지막 심부름을 시작해 채팅과 꾸미기를 마치면, 새날 안내 대신 그날의 전환 영상이 나옵니다.
          그 흐름을 영상이 있는 day 2 · 4 · 7 · 9 · 11 · 13 · 15 각각 START 탭부터 마을 복귀까지 녹화했습니다.
          완료 채팅이 닫히면 화면이 어두워진 채 바로 영상이 시작되고, 영상이 끝나면 0.5초 동안 어두운 막이 걷히며 마을이 드러납니다.
        </p>
        <div class="doc-meta">
          <span class="tag">클라 2026-11-13 판</span>
          <span class="tag">프리뷰 실행 녹화 · 무음</span>
          <span class="tag">2026-11-13</span>
        </div>
      </div>
    </header>

    <section class="doc-section" id="videos">
      <div class="wrap wrap--wide">
        <div class="shots">
          <figure class="shot">
            <video controls muted playsinline preload="metadata" poster="img/smg-newday-2.jpg" src="vid/smg-newday-2.mp4"></video>
            <figcaption><b>Day 2</b></figcaption>
          </figure>
          <figure class="shot">
            <video controls muted playsinline preload="metadata" poster="img/smg-newday-4.jpg" src="vid/smg-newday-4.mp4"></video>
            <figcaption><b>Day 4</b></figcaption>
          </figure>
          <figure class="shot">
            <video controls muted playsinline preload="metadata" poster="img/smg-newday-7.jpg" src="vid/smg-newday-7.mp4"></video>
            <figcaption><b>Day 7</b></figcaption>
          </figure>
          <figure class="shot">
            <video controls muted playsinline preload="metadata" poster="img/smg-newday-9.jpg" src="vid/smg-newday-9.mp4"></video>
            <figcaption><b>Day 9</b></figcaption>
          </figure>
          <figure class="shot">
            <video controls muted playsinline preload="metadata" poster="img/smg-newday-11.jpg" src="vid/smg-newday-11.mp4"></video>
            <figcaption><b>Day 11</b></figcaption>
          </figure>
          <figure class="shot">
            <video controls muted playsinline preload="metadata" poster="img/smg-newday-13.jpg" src="vid/smg-newday-13.mp4"></video>
            <figcaption><b>Day 13</b></figcaption>
          </figure>
          <figure class="shot">
            <video controls muted playsinline preload="metadata" poster="img/smg-newday-15.jpg" src="vid/smg-newday-15.mp4"></video>
            <figcaption><b>Day 15</b></figcaption>
          </figure>
        </div>
      </div>
    </section>
  </body>
</html>
