    showPopupStageSwitch: "p_stageswitch",
    showPopupResultRewardBox: "p_resultbox", showPopupResultRewardPicture: "p_resultpic",
    showPopupDailyChallenge: "p_dailychallen", showPopupEventTile: "p_eventtile",
    showEventTileRewardBox: "p_eventtilerew", showPopupMiniGameWheel: "p_minigamewhee",
    showPopupMission: "p_mission", showPopupChangeLandmark: "p_changelandma",
    showPopupStarterPack: "p_starterpack", showPopupRemoveAds: "p_removeads",
    showPopupToastShop: "p_toastshop", showPopupCrossPromotionMission: "p_crosspromoti",
    showPopupUserProfile: "p_userprofile", showPopupMail: "p_mail",
    showPopupSwitchContextPVP: "switchctx", showPopupSwitchContextTournament: "switchctx",
    showPopupSetting: "p_setting", showPopupSettingLanguage: "p_settinglangu",
    showPopupPrivacyPolicy: "p_privacypolic", showPopupError: "p_error",
    showPopupErrorDefault: "p_error", showPopupToastError: "p_toasterror",
    showPopupAdBreak: "p_adbreak", showPopupHowToPlay: "p_howtoplay",
    showPopupTutorialReward: "p_tutorialrewa",
    showPopupCollectionTutorial: "p_collectiontu", showPopupHighlightTutorial: "p_highlighttut"
  };


  /* 카드 · 칩 · 브레드크럼에서 쓰는 짧은 제목 (렌더보다 먼저 정의돼야 한다) */
  const shortTitle = function (n) {
    return n.title.replace(/\s*·.*$/, "").replace(/\(.*\)/, "").trim();
  };

  /* 화살표 라벨은 짧아야 카드 사이에 들어간다. 사슬이면 도착 메소드만, 인자는 버린다.
     원문은 <title> 로 남겨 마우스를 올리면 보인다. */
  const shortLabel = function (txt) {
    let v = String(txt);
    if (v.indexOf("→") > -1) v = v.split("→").pop().trim();
    v = v.replace(/\([^)]*\)/g, "");
    return v.trim();
  };

  /* 칩에 쓰는 이름 — 클래스명보다 역할(ko)이 짧고 읽힌다 */
  const chipName = function (n) {
    return String(n.ko || n.title).split(" (")[0].trim();
  };

  const esc = function (s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  };

  /* 사슬 문자열 → 스텝 배열. 원문에 이미 있는 "→"가 곧 단계 구분이다. */
  const splitChain = function (chain) {
    return String(chain).split("→").map(function (x) { return x.trim(); }).filter(Boolean);
  };

  /* 사슬 한 칸을 "메소드명() · 한 줄 동작" 으로 줄인다.
     대외 공유용이라 괄호 안 인자 · 가드 설명 · 로그는 화면에 올리지 않는다. */
  const METH = /([A-Za-z_][A-Za-z0-9_$]*)\s*\(/g;
  const methodsOf = function (text) {
    METH.lastIndex = 0;
    const out = [];
    let m;
    while ((m = METH.exec(String(text)))) out.push(m[1]);
    return out;
  };
  const brief = function (text, label) {
    const ms = methodsOf(text);
    for (let i = ms.length - 1; i >= 0; i--) {
      if (DESC[ms[i]]) return { m: ms[i], d: DESC[ms[i]] };
    }
    const t = String(text).replace(/\s+/g, " ").trim();
    const cut = t.length > 44 ? t.slice(0, 43) + "…" : t;
    if (ms.length) {
      /* 사전에 없으면 진입 메소드를 쓰고, 설명이 그 서명을 되풀이할 뿐이면 비운다 */
      const m0 = ms[0];
      const dup = t.replace(/^[A-Za-z_$][A-Za-z0-9_$.]*\s*/, "").indexOf("(") === 0
        || t.indexOf(m0) === 0 || t.indexOf("." + m0) > -1;
      return { m: m0, d: dup ? "" : cut };
    }
    /* 스텝에 메소드 표기가 없으면 행 이름에서 찾는다 (openPopup(showFn) 같은 경우) */
    if (label) {
      const lm = methodsOf(label);
      if (lm.length) return { m: lm[0], d: DESC[lm[0]] || cut };
    }
    return { m: "", d: cut };
  };
  /* 대외용 흐름에서 뺄 칸 — 로그 · 갱신 · 연출처럼 큰 틀에 영향이 없는 것 */
  const bigSteps = function (steps) {
    /* 사전에 한 줄 설명이 있는 칸(= 큰 틀에서 의미 있는 호출)과 판정 칸만 남긴다.
       로그 · 갱신 · 연출 호출은 대외 공유용 흐름에서 뺀다. */
    const keep = steps.filter(function (st, i) {
      if (i === 0 || i === steps.length - 1) return true;
      if (stepType(st) === "gate") return true;
      return methodsOf(st).some(function (m) { return DESC[m]; });
    });
    if (keep.length <= 4) return keep;
    return [keep[0], keep[1], keep[keep.length - 2], keep[keep.length - 1]];
  };

  const stepType = function (text) {
    if (/tryShow(Reward|Interstitial)AD|ADPlayer/.test(text)) return "ad";
    if (/BaseNetworkManager|claim[A-Z]|buyItem|purchaseAsync|sendGameEnd|getEventInfos|loadStageList|invalidateCache|upgradeMetaCity|forceSubscribeBotAsync/.test(text)) return "net";
    if (/show(View|Popup)[A-Za-z]*|showViewLobby|tryContextSwitch|trySwitchToJoinedTournament|showBushView/.test(text)) return "nav";
    if (/가드|판정|확인|이면|아니면|없으면|남으면|통과|소진|초과|충분|부족|잠금|차단|막|체크|경우|조건|유효/.test(text)) return "gate";
    return "call";
  };

  const TYPENAME = { gate: "게이트 · 판정", net: "서버 호출", ad: "광고", nav: "지면 이동", call: "호출" };

  const jumpFor = function (text) {
    const m = String(text).match(/\b(show[A-Za-z]+|tryContextSwitch|trySwitchToJoinedTournament|onClickCard|clickCard|upgradeMetaCity)\b/g);
    if (!m) return null;
    for (let i = 0; i < m.length; i++) { if (JUMP[m[i]]) return JUMP[m[i]]; }
    return null;
  };

  /* ── UI : 프리팹 실측 ────────────────────────────────────────
     버튼 위치는 추정하지 않는다. PF(프리팹 파싱 결과)의 좌표를 그대로 쓴다.
     각 버튼의 핸들러명으로 로직 표의 행을 찾아 붙이고, 표에 없던 버튼은
     EXTRA 의 사슬을 담은 섹션을 하나 덧붙여 3단까지 이어지게 한다. */

  /* 섹션 묶음은 노드당 한 번만 만든다 (프리팹 추가 버튼 섹션이 붙는다) */
  const SEC_CACHE = {};
  const baseSections = function (n) {
    if (n.detail && n.detail.length) return n.detail;
    return [{ h: "버튼 → 호출 메소드", rows: (n.acts || []).map(function (a) { return [a[0], a[1]]; }) }];
  };

  const extraOf = function (id, h) {
    return EXTRA[id + ":" + h] || EXTRA[h] || null;
  };

  /* PF.boxes 는 화면 요소 전체다. 로직 섹션은 버튼만 쓴다. */
  const pfButtons = function (id) {
    const pf = PF[id];
    if (!pf) return [];
    if (!pf._btns) pf._btns = pf.boxes.filter(function (b) { return b.k === "b"; });
    return pf._btns;
  };
  /* 버튼이 아닌 것 = 화면을 알아보게 해주는 장식 (패널 · 타이틀 · 아이콘 · 리스트) */
  const pfDecor = function (id) {
    const pf = PF[id];
    if (!pf) return [];
    if (!pf._deco) pf._deco = pf.boxes.filter(function (b) { return b.k !== "b"; });
    return pf._deco;
  };

  /* 프리팹 노드 이름 · 라벨 문자열에서 사람이 읽을 이름을 고른다.
     숫자만 있는 라벨(재화 표시 등)은 버튼 이름이 아니므로 버린다. */
  const nameOf = function (b) {
    if (b.L) return b.L;                 /* 경로로 확정한 이름이 가장 정확하다 */
    const t = (b.t || "").trim();
    if (t && !/^[\d,.:%\s+x/-]*$/.test(t) && t.length <= 14) return t;
    if (BTNNAME[b.n] && BTNNAME[b.n] !== "버튼") return BTNNAME[b.n];
    if (b.h) return b.h.replace(/^on(Click|Change)/, "");
    return BTNNAME[b.n] || b.n || "버튼";
  };

  const sectionsOf = function (n) {
    if (SEC_CACHE[n.id]) return SEC_CACHE[n.id];
    const secs = baseSections(n).slice();
    const pf = PF[n.id];
    if (pf) {
      const add = [];
      pfButtons(n.id).forEach(function (b) {
        b._sec = -1;
        if (b.ctx) return;          /* 담당 노드의 표에만 둔다 (중복 제거) */
        const re = b.h
          ? new RegExp("\\b" + b.h.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*\\(")
          : null;
        if (re) {
          for (let si = 0; si < secs.length; si++) {
            const rows = secs[si].rows;
            for (let ri = 0; ri < rows.length; ri++) {
              if (re.test(rows[ri][1])) { b._sec = si; b._row = ri; b._label = b.L || rows[ri][0]; return; }
            }
          }
        }
        /* detail 에 없어도 acts(카드 요약)에 있으면 그 사슬을 쓴다 */
        let row = null;
        if (re && n.acts) {
          for (let i = 0; i < n.acts.length; i++) {
            if (re.test(n.acts[i][1])) { row = [n.acts[i][0], n.acts[i][1]]; break; }
          }
        }
        if (!row) {
          const ex = extraOf(n.id, b.h);
          row = ex ? [ex[0], ex[1]]
                   : [nameOf(b), b.h
                        ? b.h + "() — 프리팹에서 확인된 핸들러. 로직 표에는 아직 정리되지 않았다."
                        : "클릭 이벤트가 비어 있다 — 코드에서 등록하거나 연출 전용 터치 영역이다."];
        }
        add.push({ b: b, row: row });
      });
      if (add.length) {
        secs.push({ h: "프리팹 실측 · 표 밖 버튼", rows: add.map(function (a) { return a.row; }) });
        const si = secs.length - 1;
        add.forEach(function (a, i) { a.b._sec = si; a.b._row = i; a.b._label = a.b.L || a.row[0]; });
      }
    }
    SEC_CACHE[n.id] = secs;
    return secs;
  };
  const rowCountOf = function (n) {
    return sectionsOf(n).reduce(function (s, sec) { return s + sec.rows.length; }, 0);
  };

  const BIG = /PLAY|START|NEW GAME|시작|플레이|받기|수령|합치기|MERGE|뽑기|다시|계속|구매|참가|대전/;

  /* 지면의 UI 버튼 = 프리팹 버튼 그대로. 좌표·크기까지 함께 넘긴다. */
  const uiButtons = function (n, noCtx) {
    const pf = PF[n.id];
    if (!pf) return [];
    sectionsOf(n);   /* _sec/_row 채우기 */
    const secs = SEC_CACHE[n.id];
    const out = pfButtons(n.id).map(function (b) {
      const row = secs[b._sec] ? secs[b._sec].rows[b._row] : null;
      const steps = row ? splitChain(row[1]) : [""];
      return {
        label: b._label || nameOf(b), sec: b._sec, row: b._row, steps: steps.length,
        type: stepType(steps[steps.length - 1] || ""), big: BIG.test(b._label || ""),
        x: b.x, y: b.y, w: b.w, h: b.hh, on: b.a !== 0,   /* PF 는 비활성일 때만 a:0 을 붙인다. a === 1 로 보면 활성 버튼이 전부 비활성으로 그려진다 */
        moved: b.mv === 1, alt: b.alt || null, ctx: b.ctx || null,
        handler: b.h, node: b.n, full: b.w >= 0.9 && b.hh >= 0.9
      };
    });
    /* 같은 프리팹을 공유하는 다른 구역의 버튼은 그 노드의 로직 표에서 이름을 가져온다.
       (로비 화면에 main_view 버튼이 함께 그려지므로 이름이 비어 보이면 안 된다) */
    if (!noCtx) {
      const cache = {};
      out.forEach(function (x) {
        if (!x.ctx || !byId[x.ctx]) return;
        if (!cache[x.ctx]) cache[x.ctx] = uiButtons(byId[x.ctx], true);
        const hit = cache[x.ctx].filter(function (y) {
          return y.handler === x.handler && y.node === x.node;
        })[0];
        if (hit) { x.label = hit.label; x.type = hit.type; x.steps = hit.steps; }
      });
    }

    /* 한 로직 행에 버튼이 여러 개 붙는 경우(IAP A/B/C, 인게임 아이템 4종)
       라벨이 똑같아지므로 프리팹 노드 이름으로 갈라준다. */
    const count = function (arr) {
      const c = {};
      arr.forEach(function (x) { c[x.label] = (c[x.label] || 0) + 1; });
      return c;
    };
    let seen = count(out);
    out.forEach(function (x) {                       /* 1차: 프리팹 노드 이름으로 갈라본다 */
      if (seen[x.label] < 2) return;
      const alt = BTNNAME[x.node];
      if (alt && alt !== "버튼" && alt !== x.label) x.label = alt;
    });
    seen = count(out);                               /* 2차: 그래도 남은 동명만 번호를 붙인다 */
    const used = {};
    out.forEach(function (x) {
      if (seen[x.label] < 2) return;
      used[x.label] = (used[x.label] || 0) + 1;
      x.label = x.label + " " + used[x.label];
    });
    return out;
  };

  const stage = document.getElementById("stage");
  const world = document.getElementById("world");
  const svg = document.getElementById("wires");
  const wireG = document.getElementById("wire-g");
  const labelG = document.getElementById("wlabel-g");
  const lblSvg = document.getElementById("wlabels");
  const nodeLayer = document.getElementById("nodes");
  const byId = {};
  N.forEach(function (n) { byId[n.id] = n; });
  /* 맵에 사각형으로 놓이는 것만 카드. 팝업은 부모 카드의 칩이라 좌표가 없다. */
  const CARDS = N.filter(function (n) { return !n.chip; });

  /* 컨텍스트를 건드리는 지면. CTX_RETURNS 가 가리키는 지면 + 판 정산 지면 + 전환 지면.
     배지를 눌러 컨텍스트 문서로 넘어간다 — 맵 구조는 안 건드린다. */
  const CTXNODE = {};
  /* CTX_RETURNS.node 는 대부분 맵 노드가 아니라 서술용 키(cancel · reset · same 등)다.
     실재하는 노드일 때만 배지를 단다 — 아니면 아무 카드에도 안 붙는 죽은 항목이 된다. */
  CTX_RETURNS.forEach(function (r) {
    if (byId[r.node]) CTXNODE[r.node] = CTX_STATES[0].name + " 복귀 " + r.n + "곳";
  });
  CTXNODE.session = "판 종료 후 컨텍스트 분기";
  CTXNODE.switchctx = "전환 지면 본체";
  /* 칩으로 내려간 지면의 배지는 그 부모 카드에 모아 보여준다 */
  const ctxBadge = function (n) {
    const own = [];
    if (CTXNODE[n.id]) own.push(n.id);
    (n.chips || []).forEach(function (c) { if (CTXNODE[c]) own.push(c); });
    if (!own.length) return "";
    const txt = own.length === 1 ? CTXNODE[own[0]] : "컨텍스트 " + own.length + "곳";
    return '<button class="n-ctxb" data-ctxdoc="1" title="'
      + esc(own.map(function (i) { return (byId[i] ? byId[i].title : i) + " — " + CTXNODE[i]; }).join(" · "))
      + ' · 눌러서 컨텍스트 문서로">CTX · ' + esc(txt) + '</button>';
  };
  /* 마종은 로비에 탭이 없다 — 상점 · 도감 · 친구 · 토너먼트가 각각 독립 View 다.
     (코지는 ViewLobby 한 장 안의 탭 5개였다.) 그래서 한 프리팹을 나눠 쓰는 지면이 없다. */
  const ZONE = {};

  /* 카드 우측의 초소형 화면 개념도 — 프리팹 실좌표를 그대로 점으로 찍는다 (16:9) */
  const wfGlyph = function (n) {
    const b = uiButtons(n);
    if (!b.length) return "";
    let o = '<span class="n-wf">';
    b.slice(0, 20).forEach(function (x) {
      if (x.full) return;
      o += '<u style="left:' + (x.x * 100).toFixed(1) + '%;top:' + (x.y * 100).toFixed(1) + '%"></u>';
    });
    return o + '</span>';
  };

  /* ============ L1 카드 ============
     제목 · 역할 한 줄 · 화면 개념도만 둔다. 카테고리 배지 · kind · 대표 호출 · 개수는
     지면 팝업에 다 있어서 카드에서 빼면 카드가 낮아지고 맵이 좁아진다. */
  CARDS.forEach(function (n) {
    const el = document.createElement("button");
    el.type = "button";
    el.className = "node cat-" + n.cat + (n.gate ? " gate" : "") + (n.chips ? " has-chips" : "")
      + (n.rung ? " rung" : "");
    el.style.left = n.x + "px";
    el.style.top = n.y + "px";
    el.style.width = n.w + "px";
    el.dataset.id = n.id;

    let h = '<span class="n-title">' + esc(n.title) + '</span>'
      + '<span class="n-ko">' + esc(n.ko) + '</span>'
      + wfGlyph(n);
    if (n.chips && n.chips.length) {
      const zones = n.chips.filter(function (c) { return ZONE[c]; });
      const pops = n.chips.filter(function (c) { return !ZONE[c]; });
      h += '<span class="n-chips">';
      if (zones.length) {
        h += '<span class="c-h">같은 지면의 다른 구역</span>';
        zones.forEach(function (c) {
          const t = byId[c];
          h += '<span class="chip zone" data-chip="' + c + '" title="' + esc(t.title + " · " + t.ko) + '">'
            + esc(chipName(t)) + '</span>';
        });
      }
      h += '<span class="c-h">여기서 열리는 지면 <em>' + pops.length + '</em></span>';
      pops.forEach(function (c) {
        const t = byId[c];
        h += '<span class="chip" data-chip="' + c + '" style="--tc: var(--c-' + t.cat + ')"'
          + ' title="' + esc(t.title + " · " + t.ko) + '"><i></i>' + esc(chipName(t)) + '</span>';
      });
      h += '</span>';
    }
    h += ctxBadge(n);
    el.innerHTML = h;
    nodeLayer.appendChild(el);
    n.el = el;
  });

  /* 띠 라벨 — 좌표는 layout.py 가 실측 높이로 잰 띠 상단이다 (flowmap-v2-guide §3-2).
     세로 배치에서 이 라벨이 진행 단계의 눈금 역할을 한다.
     맵 드래그를 막지 않도록 CSS 에서 pointer-events 를 끊는다. */
  if (typeof BANDLABEL !== "undefined") {
    BANDLABEL.forEach(function (b) {
      const el = document.createElement("div");
      el.className = "band-label";
      el.style.top = (b.y - 46) + "px";
      el.textContent = b.text;
      nodeLayer.appendChild(el);
    });
  }

  /* ============ 월드 크기 · 배선 ============ */
  let WW = 0, WH = 0;
  const measure = function () {
    let maxX = 0, maxY = 0;
    CARDS.forEach(function (n) {
      /* 레이아웃이 없는 환경(테스트)에서는 높이를 추정해 배선 계산이 어긋나지 않게 한다 */
      n.h = n.el.offsetHeight || (86 + (n.chips ? Math.ceil(n.chips.length / 7) * 34 : 0));
      maxX = Math.max(maxX, n.x + n.w);
      maxY = Math.max(maxY, n.y + n.h);
    });
    /* 칩에서 출발하는 흐름이 있으니 칩의 월드 좌표도 잡아 둔다 */
    CARDS.forEach(function (n) {
      if (!n.chips) return;
      n.chips.forEach(function (c) {
        const t = byId[c], ce = n.el.querySelector('[data-chip="' + c + '"]');
        if (!t || !ce) return;
        t.x = n.x + ce.offsetLeft;
        t.y = n.y + ce.offsetTop;
        t.w = ce.offsetWidth || 90;
        t.h = ce.offsetHeight || 22;
        t.owner = n.id;
      });
    });
    /* 여백은 좌우 대칭으로 최소만 둔다. 오른쪽에만 380 을 두던 이전 값은
       월드 폭의 22% 가 빈칸이라 화면을 좁게 쓰는 원인이었다. */
    WW = maxX + 70;
    WH = maxY + 90;
    BANDS = bandsOf();
    world.style.width = WW + "px";
    world.style.height = WH + "px";
    svg.setAttribute("width", WW);
    svg.setAttribute("height", WH);
    svg.setAttribute("viewBox", "0 0 " + WW + " " + WH);
    lblSvg.setAttribute("width", WW);
    lblSvg.setAttribute("height", WH);
    lblSvg.setAttribute("viewBox", "0 0 " + WW + " " + WH);
  };

  const anchor = function (n, d, off) {
    const o = off || 0;
    if (d === "t") return { x: n.x + n.w / 2 + o, y: n.y, ax: "v" };
    if (d === "b") return { x: n.x + n.w / 2 + o, y: n.y + n.h, ax: "v" };
    if (d === "l") return { x: n.x, y: n.y + n.h / 2 + o, ax: "h" };
    return { x: n.x + n.w, y: n.y + n.h / 2 + o, ax: "h" };
  };

  /* ── 배선 라우터 ──────────────────────────────────────────────
     예전엔 via · aoff · ad · bd 를 데이터에 손으로 박아 뒀다. 그건 세로 레이아웃 전용이라
     배치를 바꾸면 선이 카드를 관통했다. 이제 좌표에서 후보 경로를 만들고
     "카드를 안 지나는 첫 후보"를 고른다 — 배치를 바꿔도 배선이 따라온다.

     통로는 두 종류다. 띠 사이 가로 통로(글줄 折り返し가 지나간다)와
     월드 좌우/상하 여백(같은 띠에서 되돌아가는 선이 돌아간다). */
  let BANDS = [];
  const bandsOf = function () {
    const rows = CARDS.slice().sort(function (a, b) { return a.y - b.y; });
    const out = [];
    rows.forEach(function (n) {
      const last = out[out.length - 1];
      /* 임계값은 레인 안 세로 간격(layout.RAIL_GAP_Y 24 · SPINE_GAP_Y 18)보다 크고
         띠 간격(layout.BAND_Y 76)보다 작아야 한다 — layout.BAND_THRESHOLD 와 같은 값이다.
         크면 진행 단계가 한 띠로 뭉쳐 띠 사이 가로 통로가 사라지고,
         작으면 한 레인이 여러 띠로 갈라져 배선이 무너진다. */
      if (last && n.y < last.bot + 48) {
        last.bot = Math.max(last.bot, n.y + n.h);
        last.top = Math.min(last.top, n.y);
      } else {
        out.push({ top: n.y, bot: n.y + n.h });
      }
    });
    return out;
  };
  const bandIdx = function (n) {
    const c = n.y + n.h / 2;
    for (let i = 0; i < BANDS.length; i++) if (c >= BANDS[i].top - 40 && c <= BANDS[i].bot + 40) return i;
    return 0;
  };
  /* 띠 i 아래의 가로 통로 중앙 y (마지막 띠면 월드 아래 여백) */
  const gapBelow = function (i) {
    if (i + 1 < BANDS.length) return (BANDS[i].bot + BANDS[i + 1].top) / 2;
    return BANDS[i].bot + 46;
  };
  const gapAbove = function (i) {
    if (i > 0) return (BANDS[i - 1].bot + BANDS[i].top) / 2;
    return BANDS[i].top - 46;
  };

  /* 선분이 끝점 두 개를 뺀 카드를 지나가는지 */
  const hits = function (pts, a, b) {
    /* 칩에서 출발·도착하는 선은 그 칩을 품은 카드 안에서 시작한다 — 관통이 아니다 */
    const skip = [a, b, byId[a.chip], byId[b.chip], byId[a.owner], byId[b.owner]];
    for (let i = 1; i < pts.length; i++) {
      const s = pts[i - 1], t = pts[i];
      const x0 = Math.min(s.x, t.x), x1 = Math.max(s.x, t.x);
      const y0 = Math.min(s.y, t.y), y1 = Math.max(s.y, t.y);
      for (let k = 0; k < CARDS.length; k++) {
        const c = CARDS[k];
        if (skip.indexOf(c) >= 0) continue;
        if (x0 < c.x + c.w - 4 && x1 > c.x + 4 && y0 < c.y + c.h - 4 && y1 > c.y + 4) return true;
      }
    }
    return false;
  };

  const plansFor = function (a, b) {
    const ia = bandIdx(a), ib = bandIdx(b);
    const fwd = b.x + b.w / 2 > a.x + a.w / 2;
    const L = 34;              /* 월드 왼쪽 여백 통로 */
    const p = [];
    /* v1.2 : **세로 이웃이면 곧장 위→아래로 잇는다.**
       같은 띠라는 이유로 좌우(r→l) 경로를 먼저 고르면 세로 스파인이 옆으로 돌아 나간다.
       가로 범위가 겹치고 한쪽이 다른 쪽 아래에 있을 때만 쓴다. */
    const xLap = a.x < b.x + b.w && b.x < a.x + a.w;
    if (xLap && b.y >= a.y + a.h - 4) p.push({ ad: "b", bd: "t" });
    else if (xLap && a.y >= b.y + b.h - 4) p.push({ ad: "t", bd: "b" });
    if (ib > ia) p.push({ ad: "b", bd: "t", mid: gapBelow(ia) });
    else if (ib < ia) p.push({ ad: "t", bd: "b", mid: gapAbove(ia) });
    else p.push(fwd ? { ad: "r", bd: "l" } : { ad: "l", bd: "r" });
    /* 같은 띠 · 가까운 띠에서 막히면 통로로 우회한다 */
    p.push({ ad: "b", bd: "b", mid: gapBelow(Math.max(ia, ib)) });
    p.push({ ad: "t", bd: "t", mid: gapAbove(Math.min(ia, ib)) });
    p.push({ ad: "b", bd: "t", mid: gapBelow(ia) });
    p.push({ ad: "t", bd: "b", mid: gapAbove(ia) });
    p.push({ ad: "l", bd: "l", mid: L });
    p.push({ ad: "r", bd: "r", mid: WW - 34 });
    p.push(fwd ? { ad: "r", bd: "l" } : { ad: "l", bd: "r" });
    return p;
  };

  /* 카드를 안 지나는 첫 후보. 다 막히면 마지막 후보(단순 좌우)를 쓴다. */
  const routeFor = function (a, b) {
    const plans = plansFor(a, b);
    for (let i = 0; i < plans.length; i++) {
      const pl = plans[i];
      const pts = buildPoints(anchor(a, pl.ad), anchor(b, pl.bd), { mid: pl.mid });
      if (!hits(pts, a, b)) return { pts: pts, plan: pl };
    }
    const pl = plans[plans.length - 1];
    return { pts: buildPoints(anchor(a, pl.ad), anchor(b, pl.bd), { mid: pl.mid }), plan: pl };
  };

  const simpleRoute = function (p, q, mid) {
    const pts = [];
    if (p.ax === "v" && q.ax === "v") {
      if (Math.abs(p.x - q.x) > 1) {
        const my = mid != null ? mid : (p.y + q.y) / 2;
        pts.push({ x: p.x, y: my }, { x: q.x, y: my });
      }
    } else if (p.ax === "h" && q.ax === "h") {
      if (Math.abs(p.y - q.y) > 1) {
        const mx = mid != null ? mid : (p.x + q.x) / 2;
        pts.push({ x: mx, y: p.y }, { x: mx, y: q.y });
      }
    } else if (p.ax === "v") {
      pts.push({ x: p.x, y: q.y });
    } else {
      pts.push({ x: q.x, y: p.y });
    }
    return pts;
  };

  const buildPoints = function (p, q, e) {
    let pts = [{ x: p.x, y: p.y }];
    if (e.via && e.via.length) {
      const v0 = e.via[0];
      if (p.ax === "v" && Math.abs(v0.x - p.x) > 1) pts.push({ x: p.x, y: v0.y });
      if (p.ax === "h" && Math.abs(v0.y - p.y) > 1) pts.push({ x: v0.x, y: p.y });
      e.via.forEach(function (v) { pts.push({ x: v.x, y: v.y }); });
      const last = e.via[e.via.length - 1];
      if (q.ax === "v" && Math.abs(last.x - q.x) > 1) pts.push({ x: q.x, y: last.y });
      if (q.ax === "h" && Math.abs(last.y - q.y) > 1) pts.push({ x: last.x, y: q.y });
    } else {
      pts = pts.concat(simpleRoute(p, q, e.mid));
    }
    pts.push({ x: q.x, y: q.y });

    const out = [];
    pts.forEach(function (pt) {
      const prev = out[out.length - 1];
      if (!prev || Math.abs(prev.x - pt.x) > 0.5 || Math.abs(prev.y - pt.y) > 0.5) out.push(pt);
    });
    return out;
  };

  const roundPath = function (pts, r) {
    if (pts.length < 3) {
      return "M " + pts[0].x + " " + pts[0].y + " L " + pts[pts.length - 1].x + " " + pts[pts.length - 1].y;
    }
    let d = "M " + pts[0].x + " " + pts[0].y;
    for (let i = 1; i < pts.length - 1; i++) {
      const a = pts[i - 1], b = pts[i], c = pts[i + 1];
      const d1 = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      const d2 = Math.hypot(c.x - b.x, c.y - b.y) || 1;
      const rr = Math.max(0, Math.min(r, d1 / 2, d2 / 2));
      const p1 = { x: b.x - ((b.x - a.x) / d1) * rr, y: b.y - ((b.y - a.y) / d1) * rr };
      const p2 = { x: b.x + ((c.x - b.x) / d2) * rr, y: b.y + ((c.y - b.y) / d2) * rr };
      d += " L " + p1.x + " " + p1.y + " Q " + b.x + " " + b.y + " " + p2.x + " " + p2.y;
    }
    const last = pts[pts.length - 1];
    d += " L " + last.x + " " + last.y;
    return d;
  };

  const drawWires = function () {
    wireG.innerHTML = "";
    labelG.innerHTML = "";
    const pend = [];   /* 라벨 후보 (2패스로 배치) */
    E.forEach(function (e) {
      const a = byId[e.a], b = byId[e.b];
      if (!a || !b) return;
      const pts = routeFor(a, b).pts;

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", roundPath(pts, 14));
      path.setAttribute("class", "wire" + (e.kind ? " " + e.kind : ""));
      path.setAttribute("marker-end", "url(#ah)");
      wireG.appendChild(path);
      e.path = path;

      if (!e.label) { e.lbl = null; return; }
      /* 가장 긴 구간을 고른다. 실제 자리는 아래 2패스에서 폭을 재고 정한다. */
      let best = 0, bl = -1;
      for (let k = 0; k < pts.length - 1; k++) {
        const L = Math.hypot(pts[k + 1].x - pts[k].x, pts[k + 1].y - pts[k].y);
        if (L > bl) { bl = L; best = k; }
      }
      pend.push({ e: e, s: pts[best], t: pts[best + 1] });
    });

    /* ── 라벨 배치 ────────────────────────────────────────────────
       폭을 글자 수로 추정하면 한글(모노스페이스에서 2배 폭)이 섞일 때 크게 어긋나
       카드 위에 얹혀 잘린 것처럼 보인다. 그래서 먼저 그려 실제 폭을 재고 자리를 정한다. */
    const taken = [];
    pend.forEach(function (q) {
      const e = q.e, s = q.s, t = q.t;
      const horiz = Math.abs(t.y - s.y) < 1;
      const strong = e.kind === "trunk";
      const tx2 = document.createElementNS("http://www.w3.org/2000/svg", "text");
      tx2.setAttribute("class", "wlabel" + (strong ? " strong" : ""));
      tx2.setAttribute("text-anchor", horiz ? "middle" : "start");
      tx2.textContent = shortLabel(e.label);
      if (tx2.textContent !== e.label) {
        const ti = document.createElementNS("http://www.w3.org/2000/svg", "title");
        ti.textContent = e.label;
        tx2.appendChild(ti);
      }
      labelG.appendChild(tx2);

      /* 실측 → 안 되면(테스트 환경) 한글 2배 폭으로 추정 */
      let tw = 0;
      try { tw = tx2.getComputedTextLength(); } catch (err) { tw = 0; }
      if (!tw) {
        const cw = strong ? 6.9 : 6.3;
        let u = 0;
        const str = tx2.textContent;
        for (let i = 0; i < str.length; i++) {
          u += /[\u1100-\u11FF\u3130-\u318F\uAC00-\uD7A3\u3000-\u303F\uFF00-\uFFEF]/.test(str[i]) ? 2 : 1;
        }
        tw = u * cw;
      }
      const th = strong ? 13 : 12;

      const spot = function (f, dd) {
        const cx = s.x + (t.x - s.x) * f, cy = s.y + (t.y - s.y) * f;
        if (horiz) {
          const y = cy - 6 + dd;
          return { x: cx, y: y, l: cx - tw / 2, r: cx + tw / 2, tp: y - th, bt: y + 3, d: dd };
        }
        const x = cx + 7 + (dd < 0 ? dd - tw : dd);
        const y = cy - 2;
        return { x: x, y: y, l: x, r: x + tw, tp: y - th, bt: y + 3, d: dd };
      };
      const clash = function (r) {
        for (let i = 0; i < CARDS.length; i++) {
          const nd = CARDS[i];
          if (r.r > nd.x - 5 && r.l < nd.x + nd.w + 5
           && r.bt > nd.y - 5 && r.tp < nd.y + (nd.h || 130) + 5) return true;
        }
        for (let i = 0; i < taken.length; i++) {
          const o = taken[i];
          if (r.r > o.l - 4 && r.l < o.r + 4 && r.bt > o.tp - 3 && r.tp < o.bt + 3) return true;
        }
        return false;
      };
      let put = null;
      const fs2 = [0.5, 0.44, 0.56, 0.36, 0.64, 0.3, 0.7, 0.24, 0.76, 0.18, 0.82, 0.12, 0.88, 0.07, 0.93];
      const ds = [0, -16, 16, -30, 30, -44, 44, -58, 58, -72, 72, -88, 88];
      for (let k = 0; k < ds.length && !put; k++) {
        for (let i = 0; i < fs2.length; i++) {
          const r = spot(fs2[i], ds[k]);
          if (!clash(r)) { put = r; break; }
        }
      }
      if (!put) put = spot(0.5, 0);
      taken.push(put);
      tx2.setAttribute("x", put.x);
      tx2.setAttribute("y", put.y);
      tx2.setAttribute("data-d", put.d);
      if (Math.abs(put.d) >= 25) {
        const ax = (s.x + t.x) / 2, ay = (s.y + t.y) / 2;
        const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
        ln.setAttribute("x1", horiz ? put.x : (put.d < 0 ? put.r : put.l));
        ln.setAttribute("y1", horiz ? (put.d < 0 ? put.bt : put.tp) : put.y - 4);
        ln.setAttribute("x2", ax);
        ln.setAttribute("y2", ay);
        ln.setAttribute("class", "wlead");
        labelG.insertBefore(ln, labelG.firstChild);
      }
      e.lbl = tx2;
    });
  };

  /* ============ 미니맵 ============ */
  const mini = document.getElementById("mini");
  const miniIn = document.getElementById("mini-in");
  const miniVp = document.getElementById("mini-vp");
  let mScale = 1;

  const buildMini = function () {
    Array.prototype.slice.call(miniIn.querySelectorAll(".mn")).forEach(function (d) { d.remove(); });
    const r = miniIn.getBoundingClientRect();
    if (!r.width) return;
    mScale = Math.min(r.width / WW, r.height / WH);
    CARDS.forEach(function (n) {
      const d = document.createElement("div");
      d.className = "mn";
      d.style.left = (n.x * mScale) + "px";
      d.style.top = (n.y * mScale) + "px";
      d.style.width = Math.max(2, n.w * mScale) + "px";
      d.style.height = Math.max(2, n.h * mScale) + "px";
      d.style.background = "var(--c-" + n.cat + ")";
      miniIn.appendChild(d);
    });
  };

  /* ============ 팬 · 줌 ============ */
  let tx = 0, ty = 0, sc = 1;
  const MIN = 0.14, MAX = 2.2;
  const zoomLabel = document.getElementById("zoomval");
  const dock = document.getElementById("dock");

  /* 팝업은 화면 가운데를 덮으므로 맵 중앙 계산에서 빼는 여백은 없다. */
  const dockPad = function () { return 0; };

  const apply = function () {
    world.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + sc + ")";
    zoomLabel.textContent = Math.round(sc * 100) + "%";
    stage.style.backgroundSize = (48 * sc) + "px " + (48 * sc) + "px";
    stage.style.backgroundPosition = tx + "px " + ty + "px";
    miniVp.style.left = (-tx / sc * mScale) + "px";
    miniVp.style.top = (-ty / sc * mScale) + "px";
    miniVp.style.width = (stage.clientWidth / sc * mScale) + "px";
    miniVp.style.height = (stage.clientHeight / sc * mScale) + "px";
  };

  const clampScale = function (s) { return Math.max(MIN, Math.min(MAX, s)); };

  const fitAll = function () {
    const pad = 56;
    const vw = stage.clientWidth - dockPad();
    sc = clampScale(Math.min((vw - pad * 2) / WW, (stage.clientHeight - pad * 2) / WH));
    tx = (vw - WW * sc) / 2;
    ty = (stage.clientHeight - WH * sc) / 2;
    apply();
  };

  const goTop = function () {
    sc = clampScale(0.72);
    const n = byId.intro;
    tx = (stage.clientWidth - dockPad()) / 2 - (n.x + n.w / 2) * sc;
    ty = 120 - n.y * sc;
    apply();
  };

  const centerOn = function (n) {
    if (n && n.chip && byId[n.chip]) n = byId[n.chip];
    tx = (stage.clientWidth - dockPad()) / 2 - (n.x + n.w / 2) * sc;
    ty = stage.clientHeight / 2 - (n.y + n.h / 2) * sc;
    apply();
  };

  let dragging = false, moved = 0, lx = 0, ly = 0, pinchDist = 0, downNode = null, downChip = null, downCtx = null;
  const pointers = new Map();

  stage.addEventListener("pointerdown", function (ev) {
    pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (pointers.size > 1) { dragging = false; downNode = null; downChip = null; downCtx = null; return; }
    dragging = true; moved = 0; lx = ev.clientX; ly = ev.clientY;
    downNode = ev.target && ev.target.closest ? ev.target.closest(".node") : null;
    downChip = ev.target && ev.target.closest ? ev.target.closest("[data-chip]") : null;
    downCtx = ev.target && ev.target.closest ? ev.target.closest("[data-ctxdoc]") : null;
    stage.classList.add("dragging");
    /* setPointerCapture 를 걸면 click 이 #stage 로 재지정돼 노드 클릭이 죽는다.
       캡처 대신 window 에서 move/up 을 받고, 노드 활성화는 pointerup 에서 직접 판정한다. */
  });

  window.addEventListener("pointermove", function (ev) {
    if (!pointers.has(ev.pointerId)) return;
    pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });

    if (pointers.size === 2) {
      const pp = Array.from(pointers.values());
      const d = Math.hypot(pp[0].x - pp[1].x, pp[0].y - pp[1].y);
      const cx = (pp[0].x + pp[1].x) / 2, cy = (pp[0].y + pp[1].y) / 2;
      if (pinchDist) {
        const ns = clampScale(sc * (d / pinchDist));
        const k = ns / sc;
        tx = cx - (cx - tx) * k;
        ty = cy - (cy - ty) * k;
        sc = ns;
        apply();
      }
      pinchDist = d;
      return;
    }
    if (!dragging) return;
    const dx = ev.clientX - lx, dy = ev.clientY - ly;
    moved += Math.abs(dx) + Math.abs(dy);
    tx += dx; ty += dy; lx = ev.clientX; ly = ev.clientY;
    apply();
  });

  const endPointer = function (ev, cancelled) {
    pointers.delete(ev.pointerId);
    if (pointers.size < 2) pinchDist = 0;
    if (pointers.size > 0) return;
    dragging = false;
    stage.classList.remove("dragging");
    const hit = downNode, chip = downChip, cbox = downCtx;
    downNode = null; downChip = null; downCtx = null;
    if (cancelled || moved > 6) return;
    if (cbox) { openScreen("__ctx__", { reset: true, recenter: false }); return; }
    if (chip) { openScreen(chip.dataset.chip, { reset: true }); return; }
    if (hit) openScreen(hit.dataset.id, { reset: true });
  };
  window.addEventListener("pointerup", function (ev) { endPointer(ev, false); });
  window.addEventListener("pointercancel", function (ev) { endPointer(ev, true); });

  stage.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    const ns = clampScale(sc * Math.pow(0.9988, ev.deltaY * (ev.deltaMode === 1 ? 18 : 1)));
    const k = ns / sc;
    tx = ev.clientX - (ev.clientX - tx) * k;
    ty = ev.clientY - (ev.clientY - ty) * k;
    sc = ns;
    apply();
  }, { passive: false });

  const zoomBtn = function (dir) {
    const ns = clampScale(sc * (dir > 0 ? 1.25 : 0.8));
    const cx = (stage.clientWidth - dockPad()) / 2, cy = stage.clientHeight / 2;
    const k = ns / sc;
    tx = cx - (cx - tx) * k;
    ty = cy - (cy - ty) * k;
    sc = ns;
    apply();
  };
  document.getElementById("b-in").addEventListener("click", function () { zoomBtn(1); });
  document.getElementById("b-out").addEventListener("click", function () { zoomBtn(-1); });
  document.getElementById("b-fit").addEventListener("click", fitAll);
  document.getElementById("b-top").addEventListener("click", goTop);
  document.getElementById("b-ctx").addEventListener("click", function () {
    openScreen("__ctx__", { reset: true, recenter: false });
  });
  document.getElementById("b-fb").addEventListener("click", function () {
    openScreen("__fb__", { reset: true, recenter: false });
  });

  mini.addEventListener("pointerdown", function (ev) {
    ev.stopPropagation();
    const r = miniIn.getBoundingClientRect();
    tx = (stage.clientWidth - dockPad()) / 2 - ((ev.clientX - r.left) / mScale) * sc;
    ty = stage.clientHeight / 2 - ((ev.clientY - r.top) / mScale) * sc;
    apply();
  });

  /* ============ 하이라이트 ============ */
  const highlight = function (id) {
    CARDS.forEach(function (n) { n.el.classList.remove("hot", "selected"); });
    E.forEach(function (e) {
      if (e.path) e.path.classList.remove("hot");
      if (e.lbl) e.lbl.classList.remove("hot");
    });
    if (!id) {
      world.classList.remove("focused");
      svg.classList.remove("focused");
      return;
    }
    world.classList.add("focused");
    svg.classList.add("focused");
    const tgt = byId[id];
    const host = tgt.chip ? byId[tgt.chip] : tgt;
    if (host && host.el) host.el.classList.add("hot", "selected");
    nodeLayer.querySelectorAll(".chip.on").forEach(function (e) { e.classList.remove("on"); });
    if (tgt.chip && host && host.el) {
      const ce = host.el.querySelector('[data-chip="' + id + '"]');
      if (ce) ce.classList.add("on");
    }
    E.forEach(function (e) {
      if (e.a !== id && e.b !== id) return;
      if (e.path) e.path.classList.add("hot");
      if (e.lbl) e.lbl.classList.add("hot");
      const other = e.a === id ? e.b : e.a;
      const oh = byId[other] && byId[other].chip ? byId[byId[other].chip] : byId[other];
      if (oh && oh.el) oh.el.classList.add("hot");
    });
  };

  /* ============ 탭 도크 ============ */
  const crumbEl = document.getElementById("crumb");
  const bodyEl = document.getElementById("dock-body");
  const backBtn = document.getElementById("d-back");

  /* 파고든 순서를 그대로 쌓는 한 갈래 스택. 뒤로가기가 한 칸씩 되돌린다. */
  let stack = [];     /* [{id, view:{sec,row}|null}] */
  const cur = function () { return stack.length ? stack[stack.length - 1] : null; };


  /* ── 2단 UI 와이어프레임 : 프리팹 좌표를 720x1280 세로 틀에 그대로 올린다 ── */
  const wireframe = function (n, cc) {
    const pf = PF[n.id];
    if (!pf) return "";                       /* 프리팹이 아예 없는 로직 노드만 와이어프레임을 뺀다 */
    const b = uiButtons(n);
    const deco = pfDecor(n.id);
    if (!b.length && !deco.length) return "";

    const full = b.filter(function (x) { return x.full; });
    const spot = b.filter(function (x) { return !x.full; });

    /* 지면마다 설계 해상도가 다를 수 있다 (UGC 모드는 2290x1280 가로). ar 이 있으면 그 비율로 그린다. */
    let o = '<div class="wf-wrap' + (pf.ar ? ' wide' : '') + '"><div class="wf" style="--cc: ' + cc
      + (pf.ar ? ';aspect-ratio: ' + pf.ar : '') + '">';
    if (pf.panel) {
      o += '<span class="wf-panel" style="width:' + (pf.panel.w * 100).toFixed(1)
        + '%;height:' + (pf.panel.h * 100).toFixed(1) + '%"></span>';
    }
    /* 장식 레이어. 클릭은 버튼만 받게 pointer-events 를 끈다(CSS).
       프리팹 문서 순서(z)대로 그려 큰 배경이 작은 요소를 덮지 않게 한다. */
    const DKIND = { l: "lbl", i: "img", s: "list", g: "gauge", m: "anim" };
    deco.forEach(function (x) {
      const w = Math.max(x.w * 100, 0.6), h = Math.max(x.hh * 100, 1.0);
      const txt = (x.t || "").trim();
      o += '<span class="wf-d d-' + (DKIND[x.k] || "img") + (x.ctx ? " ctx" : "") + '"'
        + ' style="left:' + (x.x * 100).toFixed(2) + '%;top:' + (x.y * 100).toFixed(2) + '%;'
        + 'width:' + w.toFixed(2) + '%;height:' + h.toFixed(2) + '%"'
        + ' title="' + esc(x.n + (txt ? " · \u201c" + txt + "\u201d" : "")
            + (x.rep ? " · 같은 셀 " + x.rep + "개" : "")) + '">'
        + (x.k === "l" && txt ? '<b>' + esc(txt.length > 18 ? txt.slice(0, 18) + "\u2026" : txt) + '</b>' : '')
        + (x.rep ? '<i class="wf-rep">\u00d7' + x.rep + '</i>' : '')
        + '</span>';
    });
    full.forEach(function (x) {
      o += '<button class="wf-full' + (x.ctx ? " ctx" : "") + '"'
        + (x.ctx ? ' data-jump="' + x.ctx + '"' : ' data-sec="' + x.sec + '" data-row="' + x.row + '"')
        + ' title="' + esc(x.ctx && byId[x.ctx]
            ? byId[x.ctx].title + " 담당 — 눌러서 그 지면으로"
            : x.node + " · " + (x.handler || "핸들러 없음")) + '">'
        + esc(x.label) + ' <em>화면 전체</em></button>';
    });
    /* 상자는 실측 크기 그대로. 라벨은 일단 전부 쓰고, 렌더 후 실제 프레임 크기를 재서
       겹치는 것만 번호로 내린다(fitLabels). 프레임 폭이 창 크기에 따라 변하므로 고정 계산은 못 쓴다. */
    spot.forEach(function (x) {
      const w = Math.max(x.w * 100, 3.2), h = Math.max(x.h * 100, 5.0);
      const tip = x.ctx && byId[x.ctx]
        ? "이 버튼은 " + byId[x.ctx].title + " 담당 — 눌러서 그 지면으로"
        : x.node + " · " + (x.handler || "핸들러 없음") + " · " + x.steps + "단계"
        + (x.on ? "" : " · 프리팹 저장 시점 비활성")
        + (x.moved ? " · 위치는 코드가 런타임에 정함" : "");
      o += '<button class="wf-btn n-' + x.type + (x.big ? " big" : "") + (x.on ? "" : " off")
        + (x.moved ? " mv" : "") + (x.ctx ? " ctx" : "") + '"'
        + (x.ctx ? ' data-jump="' + x.ctx + '"' : ' data-sec="' + x.sec + '" data-row="' + x.row + '"')
        + ' data-lbl="' + esc(x.label) + '" data-rank="' + ((x.ctx ? 0 : 4) + (x.big ? 2 : 0)) + '"'
        + (x.alt ? ' data-alt="' + x.alt.length + '"' : '') + (x.moved ? ' data-mv="1"' : '')
        + ' style="left:' + (x.x * 100).toFixed(2) + '%;top:' + (x.y * 100).toFixed(2) + '%;'
        + 'width:' + w.toFixed(2) + '%;height:' + h.toFixed(2) + '%"'
        + ' title="' + esc(x.label + " · " + tip) + '">'
        + '<span>' + esc(x.label) + (x.alt ? '<i class="wf-alt">+' + x.alt.length + '</i>' : '')
        + (x.moved ? '<i class="wf-mv">?</i>' : '') + '</span></button>';
    });
    /* 모든 지면 위에 상주하는 공통 헤더 (코인 · 젬). HeaderLayer.prefab 독립 프리팹이고
       PopupManager.setHeader() 가 띄운다. 세로 위치는 TopCoin 이 코드로 잡으므로 상단에 붙여 그린다. */
    if (typeof HDR !== "undefined" && HDR.length && n.id !== "intro") {
      HDR.forEach(function (x) {
        const txt = (x.t || "").trim();
        o += '<span class="wf-d d-hdr' + (x.k === "l" ? " d-lbl" : "") + '"'
          + ' style="left:' + (x.x * 100).toFixed(2) + '%;top:' + (x.y * 100).toFixed(2) + '%;'
          + 'width:' + Math.max(x.w * 100, 0.6).toFixed(2) + '%;height:' + Math.max(x.hh * 100, 1.0).toFixed(2) + '%"'
          + ' title="공통 헤더 HeaderLayer.prefab (모든 지면 상주) · ' + esc(x.n) + '">'
          + (x.k === "l" && txt ? '<b>' + esc(txt) + '</b>' : '') + '</span>';
      });
    }
    o += '</div>';
    o += '<div class="wf-key" hidden><span class="wf-key-h">번호로 표시한 버튼 — 자리가 좁아 이름을 안에 못 넣은 것</span></div>';
    const ctxN = b.filter(function (x) { return x.ctx; }).length;
    const folded = b.reduce(function (n, x) { return n + (x.alt ? x.alt.length : 0); }, 0);
    const movedN = b.filter(function (x) { return x.moved; }).length;
    o += '<div class="wf-cap"><b>' + esc(pf.src) + '</b>'
      + (pf.sub ? ' 의 <code>' + esc(pf.sub) + '</code> 노드' : '')
      + ' 실측 · ' + (pf.cw ? pf.cw + '&times;' + pf.ch + (pf.ar > 1 ? ' 가로' : ' 세로') : '720&times;1280 세로')
      + ' · 화면 요소 '
      + (b.length + deco.length) + '개 (버튼 ' + b.length + ' · 장식 ' + deco.length + ')'
      + (ctxN ? ' · 이 중 <b>' + ctxN + '개</b>는 같은 프리팹의 다른 구역 담당 (흐린 버튼 — 눌러서 그 지면으로)' : '')
      + (folded ? ' · <b>+n</b> 은 같은 자리에 겹친 상태별 변형 ' + folded + '개' : '')
      + ' · <span class="wf-cnt"></span>'
      + (pf.folded ? ' · 반복 셀 ' + pf.folded + '개는 대표 1개 + <b>&times;n</b> 으로 접음' : '')
      + (pf.nested ? ' · 부모와 같은 자리를 차지하는 중복 상자 ' + pf.nested + '개 제외' : '')
      + (pf.parked ? ' · 에디터에서 옆으로 빼둔 배타 패널 ' + pf.parked + '개 제외' : '')
      + (movedN ? ' · <b>?</b> 는 코드가 런타임에 위치를 정해 <b>좌표를 믿을 수 없는</b> 버튼 ' + movedN + '개' : '')
      + '<br><code>cc.Widget</code> 정렬은 계산해서 반영했습니다(회전은 무시). '
      + '<span class="wf-lg">점선</span>은 프리팹 저장 시점 비활성(런타임 조건부 노출). '
      + '<b>파란 띠</b>는 모든 지면에 상주하는 공통 헤더(<code>HeaderLayer.prefab</code>) — '
      + '<code>PopupManager.setHeader()</code> 가 띄우는 코인 · 젬 바입니다. '
      + '세로 위치는 프리팹이 아니라 <code>TopCoin</code> 이 코드로 잡으므로 <b>화면 상단에 붙여 그렸습니다</b>(가로는 프리팹 실측).'
      + (pf.runtime ? ' <b>' + esc(pf.runtime) + '</b>은 프리팹에 없습니다 — 코드가 런타임에 만듭니다.' : '')
      + (pf['var'] ? ' 같은 지면의 다른 프리팹 변형: <b>' + esc(pf['var'].join(' · ')) + '</b>.' : '')
      + '</div>';
    return o + '</div>';
  };

  /* ---- 2단 : 지면 다이어그램 (흐름 밴드 + 가지 트리) ---- */
  const renderScreen = function (t) {
    const n = byId[t.id];
    const secs = sectionsOf(n);
    const cc = "var(--c-" + n.cat + ")";

    const outs = [], ins = [];
    E.forEach(function (e) {
      if (e.a === t.id) outs.push(e);
      else if (e.b === t.id) ins.push(e);
    });
    /* 팝업 열기는 화살표에서 칩 소속으로 옮겼으므로, 문맥 밴드는 소속에서 만든다 */
    /* 상점처럼 두 곳에서 열리는 지면은 부모를 전부 보여준다 */
    CARDS.forEach(function (c) {
      if (c.chips && c.chips.indexOf(t.id) > -1) ins.push({ a: c.id, b: t.id, label: "여기서 열린다" });
    });
    if (n.chips) n.chips.forEach(function (c) { outs.push({ a: t.id, b: c, label: "여기서 열린다" }); });

    let h = '<div class="g-root" style="--cc: ' + cc + '">'
      + '<div class="r-cat">' + esc(CATNAME[n.cat]) + ' · ' + esc(n.kind) + '</div>'
      + '<div class="r-title">' + esc(n.title) + '</div>'
      + '<div class="r-ko">' + esc(n.ko) + '</div>'
      + '<div class="r-file">' + esc(n.file) + '</div>'
      + (n.more ? '<div class="r-more">' + esc(n.more) + '</div>' : '')
      + '</div>';

    /* 문맥은 글로 적지 않고 밴드 하나로 보여준다 : 들어오는 지면 → 현재 → 나가는 지면 */
    const side = function (list, dir, cls) {
      if (!list.length) return '<div class="io-col ' + cls + '"><span class="io-none">없음</span></div>';
      const cap = 5;
      let o = '<div class="io-col ' + cls + '">';
      list.slice(0, cap).forEach(function (e) {
        const other = byId[dir === "out" ? e.b : e.a];
        o += '<button class="g-to" data-jump="' + other.id + '" style="--tc: var(--c-' + other.cat + ')"'
          + ' title="' + esc((e.label || "") + " → " + other.title) + '">'
          + '<i></i><span>' + esc(shortTitle(other)) + '</span></button>';
      });
      if (list.length > cap) o += '<span class="io-more">+' + (list.length - cap) + '개</span>';
      return o + '</div>';
    };

    h += '<div class="io" style="--cc: ' + cc + '">'
      + side(ins, "in", "")
      + '<div class="io-ar">→</div>'
      + '<div class="io-now"><span>현재</span><b>' + esc(shortTitle(n)) + '</b></div>'
      + '<div class="io-ar">→</div>'
      + side(outs, "out", "r")
      + '</div>';

    /* 왼쪽 = UI 와이어프레임, 오른쪽 = 로직 가지. 프리팹 버튼이 없는 지면은 로직만 전폭으로. */
    const wf = wireframe(n, cc);
    h += wf ? '<div class="two">' + wf + '<div>' : '<div class="one"><div>';
    /* 대외용 기본 화면은 "버튼"만 둔다. 라이프사이클 · 분기 · 메모 같은 내부 설명은 접어서 뒤로. */
    const INTERNAL = /라이프사이클|실행 순서|분기|메모|진입 지점|지면 목록|구분 기준|핵심 메소드|테스트 경로|직행 판정|잠금 · 공통/;
    const open = [], inner = [];
    secs.forEach(function (sec, si) { (INTERNAL.test(sec.h) ? inner : open).push([sec, si]); });

    const lane = function (sec, si, forceWide) {
      let o = '<div class="g-lane' + (forceWide || sec.rows.length >= 8 ? " wide" : "") + '" style="--cc: ' + cc + '">'
        + '<div class="g-lane-h">' + esc(sec.h) + ' <em>' + sec.rows.length + '</em></div>'
        + '<div class="g-tree">';
      sec.rows.forEach(function (r, ri) {
        const steps = splitChain(r[1]);
        const bf = brief(steps[0] || r[1], r[0]);
        const ty = stepType(steps[steps.length - 1] || r[1]);
        const jid = jumpFor(r[1]);
        const to = jid && jid !== t.id ? byId[jid] : null;
        o += '<div class="g-branch" data-key="' + si + '-' + ri + '">'
          + '<div class="g-row">'
          + '<button class="g-node n-' + ty + '" data-sec="' + si + '" data-row="' + ri + '">'
          + '<span class="b-n">' + (ri + 1) + '</span>'
          + '<span class="b-main"><span class="b-k">' + esc(r[0]) + '</span>'
          + '<span class="b-sum">' + (bf.m ? '<code>' + esc(bf.m) + '()</code> ' : '')
          + esc(bf.d) + '</span></span>'
          + '<span class="b-go">흐름 ▾</span>'
          + '</button>'
          + (to
              ? '<span class="g-arrow">→</span>'
                + '<button class="g-to" data-jump="' + to.id + '" style="--tc: var(--c-' + to.cat + ')" title="' + esc(to.title) + '">'
                + '<i></i><span>' + esc(shortTitle(to)) + '</span></button>'
              : '')
          + '</div>'
          + '<div class="b-flow">' + chainHTML(t.id, r, cc) + '</div>'
          + '</div>';
      });
      return o + '</div></div>';
    };

    /* v2 — 기본 노출은 "주요 이동 경로" 하나뿐이다.
       이 맵의 목적은 전반 프로세스 이해지 메소드 카탈로그가 아니다. 버튼 전량과 내부 동작은
       접어서 뒤로 보내고, 검색으로 찾아 들어왔을 때만 openCell() 이 그 접힘을 열어 준다.
       노드의 acts 가 성격상 정확히 "어떤 지면이 열리고 어떤 메소드를 불러 어떻게 된다" 이므로 그대로 쓴다. */
    const MAIN_CAP = 5;
    let mainSec = null, mainKey = "acts", consumed = -1;
    if (n.acts && n.acts.length) {
      mainSec = { h: "주요 이동 경로", rows: n.acts.slice(0, MAIN_CAP).map(function (a) { return [a[0], a[1]]; }) };
    } else if (open.length) {
      /* acts 가 없는 지면(칩 일부)은 첫 섹션을 대신 쓴다. 전부 들어가면 접힘에서 뺀다. */
      mainSec = { h: open[0][0].h, rows: open[0][0].rows.slice(0, MAIN_CAP) };
      mainKey = open[0][1];
      if (open[0][0].rows.length <= MAIN_CAP) consumed = open[0][1];
    }
    /* 주요 이동 경로는 행이 적어도 전폭으로 둔다 — g-lanes 그리드가 380px 열로 쪼개면 v1 과 같은 꼴이 된다 */
    if (mainSec && mainSec.rows.length) h += '<div class="g-lanes">' + lane(mainSec, mainKey, true) + '</div>';

    const rest = open.filter(function (p) { return p[1] !== consumed; });
    if (rest.length) {
      const cnt = rest.reduce(function (a2, p) { return a2 + p[0].rows.length; }, 0);
      h += '<details class="g-more"><summary>버튼 · 호출 메소드 전체 ' + cnt + '개</summary>'
        + '<div class="g-lanes">' + rest.map(function (p) { return lane(p[0], p[1]); }).join("") + '</div></details>';
    }
    h += '</div></div>';
    if (inner.length) {
      const cnt = inner.reduce(function (a2, p) { return a2 + p[0].rows.length; }, 0);
      h += '<details class="g-inner"><summary>내부 동작 · 분기 ' + cnt + '개 (개발용)</summary>'
        + '<div class="g-lanes">' + inner.map(function (p) { return lane(p[0], p[1]); }).join("") + '</div></details>';
    }

    bodyEl.innerHTML = h;
    fitLabels();
    crumbEl.innerHTML = '<span class="cur">' + esc(shortTitle(n)) + '</span>'
      + '<span class="lv">UI + 로직</span>';
  };

  /* 렌더 후 실제 프레임 크기를 재서 라벨 겹침을 없앤다.
     담당 구역 > 주요 행동 > 큰 버튼 순으로 자리를 잡고, 부딪히는 것은 번호로 내린다. */
  const fitLabels = function () {
    const frame = bodyEl.querySelector(".wf");
    if (!frame) return;
    const FW = frame.clientWidth || 900;
    const FH = frame.clientHeight || Math.round(FW * 9 / 16);
    const keyBox = bodyEl.querySelector(".wf-key");
    const btns = Array.from(frame.querySelectorAll(".wf-btn"));
    const info = btns.map(function (el) {
      const st = el.style;
      const lbl = el.dataset.lbl || "";
      const len = lbl.length + (el.dataset.alt ? 2 : 0);
      const bw = parseFloat(st.width) / 100 * FW, bh = parseFloat(st.height) / 100 * FH;
      const lw = Math.min(140, Math.max(len * 7.4, 22));
      const lh = len * 7.4 > 140 ? 30 : 17;
      return {
        el: el, lbl: lbl,
        x: parseFloat(st.left) / 100 * FW, y: parseFloat(st.top) / 100 * FH,
        w: Math.max(bw, lw), h: Math.max(bh, lh),
        rank: parseInt(el.dataset.rank || "0", 10), area: bw * bh
      };
    });
    info.slice().sort(function (a2, b2) {
      return (b2.rank - a2.rank) || (b2.area - a2.area);
    }).forEach(function (q) {
      const hit = info.some(function (o) {
        return o.ok && Math.abs(o.x - q.x) < (o.w + q.w) / 2 - 2
                    && Math.abs(o.y - q.y) < (o.h + q.h) / 2 - 2;
      });
      q.ok = !hit;
    });
    let n = 0;
    info.forEach(function (q) {
      if (q.ok) return;
      n += 1;
      q.el.classList.add("tiny");
      q.el.innerHTML = '<b class="wf-num">' + n + '</b>';
      const item = document.createElement("button");
      item.className = "wf-key-i" + (q.el.classList.contains("off") ? " off" : "")
        + (q.el.classList.contains("ctx") ? " ctx" : "");
      if (q.el.dataset.jump) item.dataset.jump = q.el.dataset.jump;
      else { item.dataset.sec = q.el.dataset.sec; item.dataset.row = q.el.dataset.row; }
      item.innerHTML = '<b>' + n + '</b><span>' + esc(q.lbl) + '</span>';
      keyBox.appendChild(item);
    });
    if (n) keyBox.removeAttribute("hidden");
    const cnt = bodyEl.querySelector(".wf-cnt");
    if (cnt) cnt.textContent = "이름 " + (info.length - n) + "개는 그림 안 · " + n + "개는 번호";
  };

  /* ---- 가지 셀 안에 펼쳐지는 흐름 (예전 3단을 그 자리로 옮긴 것) ---- */
  const chainHTML = function (nid, row, cc) {
    const steps = splitChain(row[1]);
    const flow = bigSteps(steps);
    let h = '<div class="f-flow">';
    flow.forEach(function (st, i) {
      const ty = stepType(st);
      const jid = jumpFor(st);
      const to = jid && jid !== nid ? byId[jid] : null;
      const isEnd = i === flow.length - 1;
      const bf = brief(st, row[0]);
      if (i > 0) h += '<div class="f-link"><b>' + (stepType(flow[i - 1]) === "gate" ? "통과하면" : "다음") + '</b></div>';
      h += '<div class="f-step st-' + ty + (ty === "gate" ? " is-gate" : "") + (isEnd ? " is-end" : "")
        + (to ? " can" : "") + '"' + (to ? ' data-jump="' + to.id + '" style="--tc: var(--c-' + to.cat + ')"' : '') + '>'
        + '<span class="f-n">' + (i + 1).toString().padStart(2, "0") + '</span>'
        + '<span class="f-body">'
        + '<span class="f-type">' + TYPENAME[ty] + (isEnd ? " · 도착" : "") + '</span>'
        + '<span class="f-text">' + (bf.m ? '<code>' + esc(bf.m) + '()</code>' : '')
        + (bf.d ? '<em class="f-d">' + esc(bf.d) + '</em>' : '') + '</span>'
        + (to ? '<span class="f-open"><i></i>' + esc(shortTitle(to)) + ' 다이어그램 열기 ▸</span>' : '')
        + '</span></div>';
    });
    h += '</div>';
    if (steps.length > flow.length) {
      h += '<details class="f-raw"><summary>원문 사슬 ' + steps.length + '단계 (개발용)</summary>'
        + '<p>' + esc(row[1]) + '</p></details>';
    }
    return h;
  };


  /* ── 컨텍스트 분기 ────────────────────────────────────────────
     맵은 "어느 지면이 뜨나"를 보여주지만, 컨텍스트는 "같은 지면·같은 버튼이
     상태에 따라 다르게 동작한다"는 다른 축이다. 상태 기계로 따로 그린다. */
  const ctxStateMachine = function () {
    /* CTX_STATES 를 그대로 그린다. 첫 상태(보통 솔로)를 왼쪽에 두고 나머지를 오른쪽에 쌓는다 —
       "여기서 저기로 넘어간다"가 그림의 뼈대다. 솔리테어판은 도형이 코드에 박혀 있었으나
       마종은 컨텍스트 타입이 셋으로 갈라져 있어 데이터로 그린다. */
    /* 두 열 사이를 넉넉히 벌린다 — 붙여 두면 Solo↔PVP · Solo↔Tournament 네 화살표의
       라벨이 짧은 구간에 몰려 서로 덮는다. */
    const W = 1120, BW = 300, BH = 96, LEFT = 18, RIGHT = 600;
    const rest = CTX_STATES.slice(1);
    const H = Math.max(300, 40 + rest.length * (BH + 44));
    /* SVG <text> 는 줄바꿈이 없다. 조건문은 상자 폭(약 44자)에 맞춰 두 줄로 자르고
       잘린 전문은 <title> 로 남긴다 — 표에도 같은 내용이 그대로 있다. */
    const wrap2 = function (t, per) {
      t = String(t || "");
      if (t.length <= per) return [t, ""];
      let cut = t.lastIndexOf(" ", per);
      if (cut < per * 0.5) cut = per;
      const rest = t.slice(cut).trim();
      return [t.slice(0, cut).trim(), rest.length > per ? rest.slice(0, per - 1) + "…" : rest];
    };
    const box = function (x, y, cls, name, ko, cond) {
      const c = wrap2(cond, 44);
      return '<g><title>' + esc(cond || "") + '</title>'
        + '<rect class="sm-box ' + cls + '" x="' + x + '" y="' + y + '" width="' + BW
        + '" height="' + BH + '" rx="7"></rect>'
        + '<text class="sm-t" x="' + (x + 14) + '" y="' + (y + 24) + '">' + esc(name) + '</text>'
        + '<text class="sm-s" x="' + (x + 14) + '" y="' + (y + 42) + '">' + esc(ko) + '</text>'
        + '<text class="sm-c" x="' + (x + 14) + '" y="' + (y + 62) + '">' + esc(c[0]) + '</text>'
        + (c[1] ? '<text class="sm-c" x="' + (x + 14) + '" y="' + (y + 76) + '">' + esc(c[1]) + '</text>' : '')
        + '</g>';
    };
    /* 라벨은 선의 가운데가 아니라 t 지점에 둔다. 정방향 0.34 · 역방향 0.66 으로 갈라
       Solo↔PVP · Solo↔Tournament 네 화살표의 라벨이 한자리에 뭉치지 않게 한다. */
    const arrow = function (x1, y1, x2, y2, label, cls, t, dy) {
      t = t == null ? 0.5 : t;
      const mx = x1 + (x2 - x1) * t, my = y1 + (y2 - y1) * t + (dy || 0);
      return '<line class="sm-a ' + (cls || '') + '" x1="' + x1 + '" y1="' + y1
        + '" x2="' + x2 + '" y2="' + y2 + '" marker-end="url(#smah)"></line>'
        + '<text class="sm-l" x="' + mx + '" y="' + (my - 6) + '" text-anchor="middle"><title>'
        + esc(label) + '</title>' + esc(label.length > 22 ? label.slice(0, 21) + "…" : label) + '</text>';
    };
    const at = {};
    at[CTX_STATES[0].id] = { x: LEFT, y: (H - BH) / 2 };
    rest.forEach(function (st, i) { at[st.id] = { x: RIGHT, y: 30 + i * (BH + 44) }; });

    let g = '<svg class="sm" viewBox="0 0 ' + W + ' ' + H + '" role="img" '
      + 'aria-label="컨텍스트 상태 기계">'
      + '<defs><marker id="smah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" '
      + 'orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"></path></marker></defs>';
    const CLS = ["s-solo", "s-p2p", "s-tour", "s-p2p", "s-tour"];
    CTX_STATES.forEach(function (st, i) {
      g += box(at[st.id].x, at[st.id].y, CLS[i % CLS.length], st.name, st.ko || "", st.cond);
    });
    /* 화살표는 상자 옆면끼리 잇는다. 같은 쌍의 반대 방향은 살짝 어긋나게 둬 겹치지 않는다. */
    /* 같은 (a→b) 전이가 여러 개면 화살표 하나로 합치고 개수만 적는다 —
       네 개를 겹쳐 그리면 라벨이 뭉쳐 아무것도 안 읽힌다. 내용은 아래 표에 다 있다. */
    const merged = [];
    const at2 = {};
    CTX_EDGES.forEach(function (e) {
      const k = e.a + ">" + e.b;
      if (at2[k]) { at2[k].n++; return; }
      at2[k] = { a: e.a, b: e.b, label: e.label, n: 1, ok: e.ok };
      merged.push(at2[k]);
    });
    merged.forEach(function (e) { if (e.n > 1) e.label = e.label + " 외 " + (e.n - 1) + "건"; });

    /* 화살표마다 라벨 자리(가로 t · 세로 어긋냄)를 돌려 쓴다. 네 선이 Solo 오른쪽
       한 점에서 부채처럼 퍼져 나가므로 자리를 안 나누면 라벨이 통째로 겹친다. */
    const TPOS = [0.30, 0.52, 0.74, 0.40, 0.62, 0.86];
    const DYPOS = [-4, -18, 10, 22, -30, 0];
    let ei = 0;
    const seen = {}, self = {};
    merged.forEach(function (e) {
      const a = at[e.a], b = at[e.b];
      if (!a || !b) return;
      if (e.a === e.b) {
        /* 자기 자신으로 도는 전이 — 같은 상태 안에서 종류만 바뀐다(PvpType 등).
           상자 오른쪽에 작은 고리로 그리고, 여러 개면 아래로 층을 쌓는다. */
        const i = self[e.a] || 0;
        self[e.a] = i + 1;
        const x = a.x + BW, y = a.y + 20 + i * 18, r = 13 + i * 5;
        g += '<path class="sm-a loop" d="M ' + x + ' ' + y + ' a ' + r + ' ' + r
          + ' 0 1 1 0 ' + (r * 2) + '" marker-end="url(#smah)"></path>'
          + '<text class="sm-l" x="' + (x + r * 2 + 6) + '" y="' + (y + r + 4) + '"><title>'
          + esc(e.label) + '</title>' + esc(e.label.length > 40 ? e.label.slice(0, 39) + "…" : e.label) + '</text>';
        return;
      }
      const key = [e.a, e.b].sort().join(">");
      const off = seen[key] ? 22 : -8;
      seen[key] = 1;
      const aRight = a.x < b.x;
      g += arrow(aRight ? a.x + BW : a.x, a.y + BH / 2 + off,
                 aRight ? b.x : b.x + BW, b.y + BH / 2 - off,
                 e.label, e.ok ? "ok" : "",
                 TPOS[ei % TPOS.length], DYPOS[ei % DYPOS.length]);
      ei++;
    });
    g += '</svg>';
    return '<figure class="fig">' + g
      + '<figcaption>상태 ' + CTX_STATES.length + '종. 조건은 각 상자 아래 줄에 적었다. '
      + '전이마다 무슨 일이 일어나는지는 아래 표를 본다.</figcaption></figure>';
  };

  const tableOf = function (head, rows, cls) {
    let h = '<div class="tw"><table class="tb ' + (cls || '') + '"><thead><tr>';
    head.forEach(function (c) { h += '<th>' + esc(c) + '</th>'; });
    h += '</tr></thead><tbody>';
    rows.forEach(function (r) {
      h += '<tr>';
      r.forEach(function (c) { h += '<td>' + c + '</td>'; });
      h += '</tr>';
    });
    return h + '</tbody></table></div>';
  };
  const src = function (v) { return '<code class="sc">' + esc(v) + '</code>'; };

  const renderCtx = function () {
    let h = '<div class="sec-lede"><h2>컨텍스트 분기</h2>'
      + '<p>FB 컨텍스트는 <b>지면이 아니라 상태</b>다. 같은 로비 · 같은 매치 버튼 · 같은 정산 팝업이 '
      + '이 상태에 따라 다르게 동작한다. 맵의 화살표로는 표현되지 않는 축이라 따로 그렸다.</p></div>';
    h += ctxStateMachine();
    if (CTX_TRAP) h += '<div class="warn"><b>함정</b> ' + esc(CTX_TRAP) + '</div>';

    h += '<h3>전이할 때 실제로 일어나는 일</h3>';
    h += tableOf(["전이", "무슨 일이 일어나나", "코드"], CTX_EDGES.map(function (e) {
      const a = CTX_STATES.filter(function (s) { return s.id === e.a; })[0];
      const b = CTX_STATES.filter(function (s) { return s.id === e.b; })[0];
      return ['<b>' + esc(a.name) + ' → ' + esc(b.name) + '</b><br><span class="mut">' + esc(e.label) + '</span>',
              esc(e.note), src(e.src)];
    }));

    h += '<h3>컨텍스트를 만드는 구좌 ' + CTX_SLOTS.length + '개 <em>— 게이트와 거절 처리가 다르다</em></h3>';
    h += tableOf(["구좌", "어디서", "노출 게이트", "거절하면", "코드"], CTX_SLOTS.map(function (s) {
      return ['<b>' + esc(s.name) + '</b><br><code>' + esc(s.id) + '</code>', esc(s.entry),
              (s.gate === "없음" ? '<span class="mut">없음</span>' : '<b>' + esc(s.gate) + '</b>'),
              esc(s.reject), src(s.src)];
    }));

    h += '<h3>판 시작 구좌의 노출 게이트 <em>— 하나라도 불충족이면 미노출</em></h3>';
    h += tableOf(["조건", "왜", "코드"], CTX_GATE.map(function (r) {
      return ['<b>' + esc(r[0]) + '</b>', esc(r[1]), src(r[2])];
    }));

    const rtot = CTX_RETURNS.reduce(function (a, r) { return a + r.n; }, 0);
    h += '<h3>컨텍스트를 끊거나 되돌리는 지점 ' + rtot + '곳 <em>— ' + esc(CTX_STATES[0].name)
      + ' 복귀 · 데이터 리셋 · 이미 같은 컨텍스트</em></h3>';
    h += tableOf(["경로", "호출 수", "위치"], CTX_RETURNS.map(function (r) {
      const n = byId[r.node];
      return [(n ? '<button class="lnk" data-jump="' + r.node + '">' + esc(r.name) + '</button>' : esc(r.name)),
              '<b>' + r.n + '</b>', src(r.at)];
    }));

    h += '<h3>클리어 정산도 컨텍스트로 갈린다</h3>';
    h += tableOf(["컨텍스트", "동작", "조건 · 함정", "코드"], CTX_SETTLE.map(function (r) {
      return ['<code>' + esc(r.name) + '</code>', '<b>' + esc(r.act) + '</b>', esc(r.note), src(r.src)];
    }));
    return h;
  };

  /* ── FB 지면 ──────────────────────────────────────────────────
     우리 프리팹이 아니라 FB 가 그리는 화면. 게임 위에 덮이므로 프리팹 파싱으로는
     절대 안 나온다. 언제 뜨고 어느 조건이 필요한지만 간결하게 정리한다. */
  const renderFB = function () {
    const G = [];
    FBS.forEach(function (r) {
      let g = G.filter(function (x) { return x.name === r.g; })[0];
      if (!g) { g = { name: r.g, rows: [] }; G.push(g); }
      g.rows.push(r);
    });
    let h = '<div class="sec-lede"><h2>FB 지면</h2>'
      + '<p>FB 가 직접 그리는 화면이다. 우리 프리팹이 아니라 게임 위에 덮이므로 '
      + '와이어프레임에는 나오지 않는다. <b>' + FBS.length + '종</b> · 이 중 '
      + '<b>' + FBS.filter(function (r) { return r.dlg; }).length + '종</b>이 유저에게 보이는 다이얼로그, '
      + '나머지는 화면 없이 조용히 처리된다.</p></div>';

    /* 그룹별 개념도 — 게임에서 FB 로 나가는 호출을 한눈에 */
    let sv = '<svg class="fbd" viewBox="0 0 760 ' + (60 + G.length * 74) + '" role="img" '
      + 'aria-label="게임에서 FB 지면으로 나가는 호출 분류">'
      + '<defs><marker id="fbah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" '
      + 'orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="context-stroke"></path></marker></defs>';
    sv += '<rect class="sm-box s-solo" x="14" y="' + (14 + (G.length * 74 - 60) / 2) + '" width="118" height="60" rx="7"></rect>'
      + '<text class="sm-t" x="73" y="' + (40 + (G.length * 74 - 60) / 2) + '" text-anchor="middle">게임</text>'
      + '<text class="sm-s" x="73" y="' + (58 + (G.length * 74 - 60) / 2) + '" text-anchor="middle">우리 프리팹</text>';
    G.forEach(function (g, i) {
      const y = 24 + i * 74;
      const dlg = g.rows.filter(function (r) { return r.dlg; }).length;
      sv += '<line class="sm-a ok" x1="132" y1="' + (44 + (G.length * 74 - 60) / 2) + '" x2="252" y2="'
        + (y + 26) + '" marker-end="url(#fbah)"></line>';
      sv += '<rect class="sm-box s-fb" x="256" y="' + y + '" width="486" height="54" rx="7"></rect>'
        + '<text class="sm-t" x="272" y="' + (y + 24) + '">' + esc(g.name) + '</text>'
        + '<text class="sm-c" x="272" y="' + (y + 43) + '">'
        + esc(g.rows.map(function (r) { return r.ko; }).join(" · ")) + '</text>'
        + '<text class="sm-s" x="726" y="' + (y + 24) + '" text-anchor="end">'
        + (dlg ? '다이얼로그 ' + dlg : '조용히') + '</text>';
    });
    sv += '</svg>';
    h += '<figure class="fig">' + sv + '<figcaption>FB 지면은 ' + G.length + '갈래다. '
      + '<b>다이얼로그</b>는 유저 제스처 안에서만 열 수 있고, <b>조용히</b> 처리되는 것은 제스처가 필요 없다 — '
      + '그래서 클리어 정산처럼 제스처가 없는 시점에는 조용한 쪽만 즉시 실행된다.</figcaption></figure>';

    G.forEach(function (g) {
      h += '<h3>' + esc(g.name) + '</h3>';
      h += tableOf(["FB 호출", "무슨 화면", "언제", "조건", "코드"], g.rows.map(function (r) {
        return ['<code>' + esc(r.api) + '</code>' + (r.dlg ? ' <i class="pill">다이얼로그</i>' : ' <i class="pill q">조용히</i>'),
                '<b>' + esc(r.ko) + '</b>', esc(r.when), esc(r.cond), src(r.src)];
      }));
    });
    h += '<p class="note">이 표는 코드를 읽어 손으로 정리했다 — 기계 파싱이 아니다. '
      + '<code>assets/script/common/Fbi.ts</code> 가 FB SDK(<code>FBInstant</code>)를 감싸고, '
      + '게임 코드는 <code>Fbi</code> 의 정적 메소드를 통해서만 부른다.</p>';
    return h;
  };

  const veil = document.getElementById("veil");

  const renderBody = function () {
    const t = cur();
    if (!t) {
      dock.classList.remove("open");
      veil.classList.remove("open");
      crumbEl.innerHTML = "";
      bodyEl.innerHTML = "";
      highlight(null);
      return;
    }
    dock.classList.add("open");
    veil.classList.add("open");
    backBtn.textContent = stack.length > 1 ? "← 이전 지면" : "← 맵으로";
    /* 지면이 아닌 별도 문서 두 개 — 컨텍스트 상태 기계와 FB 지면 목록 */
    if (t.id === "__ctx__" || t.id === "__fb__") {
      bodyEl.innerHTML = t.id === "__ctx__" ? renderCtx() : renderFB();
      crumbEl.innerHTML = '<span class="cur">' + (t.id === "__ctx__" ? "컨텍스트 분기" : "FB 지면") + '</span>'
        + '<span class="lv">맵 밖 문서</span>';
      bodyEl.scrollTop = 0;
      highlight(null);
      return;
    }
    renderScreen(t);
    bodyEl.scrollTop = 0;
    if (t.view) openCell(t.view.sec, t.view.row, true);
    highlight(t.id);
  };

  /* 지면 열기 = 스택에 한 칸 쌓기. 맵에서 새로 누르면 스택을 비우고 다시 시작한다. */
  const openScreen = function (id, opts) {
    const o = opts || {};
    if (o.reset) stack = [];
    stack.push({ id: id, view: null });
    renderBody();
    if (o.recenter !== false && byId[id]) centerOn(byId[id]);
  };

  /* 가지 셀을 그 자리에서 펼친다. 화면 이동이 없으니 뒤로가기도 필요 없다. */
  const openCell = function (sec, row, scroll) {
    const t = cur();
    if (!t) return;
    const br = bodyEl.querySelector('.g-branch[data-key="' + sec + '-' + row + '"]');
    if (!br) return;
    const was = br.classList.contains("open");
    if (was && !scroll) { br.classList.remove("open"); t.view = null; return; }
    br.classList.add("open");
    t.view = { sec: sec, row: row };
    /* 내부 동작 섹션 안이면 그 접힘도 같이 연다 */
    const det = br.closest("details");
    if (det) det.open = true;
    if (scroll && br.scrollIntoView) br.scrollIntoView({ block: "center" });
    bodyEl.querySelectorAll(".g-branch.flash").forEach(function (e) { e.classList.remove("flash"); });
    br.classList.add("flash");
  };

  const goBack = function () {
    stack.pop();
    renderBody();
    const t = cur();
    if (t) centerOn(byId[t.id]);
  };

  const closeAll = function () {
    stack = [];
    renderBody();
  };

  /* 키보드 활성화(Enter · Space)는 detail 0 의 click 으로 온다. 포인터 클릭은 pointerup 이 처리. */
  nodeLayer.addEventListener("click", function (ev) {
    if (ev.target.closest("[data-ctxdoc]")) {
      ev.stopPropagation();
      openScreen("__ctx__", { reset: true, recenter: false });
      return;
    }
    if (ev.detail !== 0) return;
    const ch = ev.target.closest("[data-chip]");
    if (ch) { openScreen(ch.dataset.chip, { reset: true }); return; }
    const el = ev.target.closest(".node");
    if (el) openScreen(el.dataset.id, { reset: true });
  });

  bodyEl.addEventListener("click", function (ev) {
    const jump = ev.target.closest("[data-jump]");
    if (jump) { openScreen(jump.dataset.jump, {}); return; }
    const node = ev.target.closest(".g-node, .wf-btn, .wf-full, .wf-key-i");
    if (!node) return;
    const fromUI = !node.classList.contains("g-node");
    /* 주요 이동 경로 레인의 sec 키는 숫자가 아니라 "acts" 다 — parseInt 로 밀면 NaN 이 되어 안 열린다 */
    const sv = node.dataset.sec;
    openCell(/^\d+$/.test(sv) ? parseInt(sv, 10) : sv, parseInt(node.dataset.row, 10), fromUI);
  });

  /* 프레임 폭이 바뀌면 라벨 배치가 달라지므로 다시 그린다 */
  let reflow = null;
  window.addEventListener("resize", function () {
    if (!cur()) return;
    clearTimeout(reflow);
    reflow = setTimeout(renderBody, 160);
  });

  backBtn.addEventListener("click", goBack);
  document.getElementById("d-close").addEventListener("click", closeAll);
  document.getElementById("veil").addEventListener("click", closeAll);

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { goBack(); return; }
    if (ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
    /* 슬래시 · Ctrl(Cmd)+K 로 검색창에 바로 들어간다 */
    if (ev.key === "/" || ((ev.metaKey || ev.ctrlKey) && (ev.key === "k" || ev.key === "K"))) {
      ev.preventDefault();
      fxQ.focus();
      fxQ.select();
      return;
    }
    const step = 100;
    if (ev.key === "ArrowLeft") { tx += step; apply(); }
    else if (ev.key === "ArrowRight") { tx -= step; apply(); }
    else if (ev.key === "ArrowUp") { ty += step; apply(); }
    else if (ev.key === "ArrowDown") { ty -= step; apply(); }
  });


  /* ============ 검색 ============ */
  /* 색인 원천은 전부 이 문서 안의 데이터다 — 노드(지면 이름 · 한글명 · 소스 파일 · 프리팹),
     로직 표의 버튼 이름과 호출 사슬에서 뽑은 메소드, 프리팹 실측 버튼의 핸들러 · 노드 이름 ·
     라벨 문자열, DESC 설명문, FB 지면(FBS), 컨텍스트 상태(CTX_STATES).
     맞은 항목을 고르면 그 지면을 열고, 표의 한 행에 걸린 것이면 그 가지 칸까지 펼친다. */
  const FX_COLOR = {
    "지면": "var(--c-lobby)", "메소드": "var(--c-game)", "버튼": "var(--c-result)",
    "프리팹": "var(--c-meta)", "요소": "var(--c-system)", "FB": "var(--c-commerce)",
    "컨텍스트": "var(--c-entry)"
  };

  let IDX = null;
  const buildIndex = function () {
    if (IDX) return IDX;
    const out = [], seen = {}, meth = {};
    const add = function (k, label, node, sec, row, extra, mono) {
      label = String(label == null ? "" : label).trim();
      if (!label) return null;
      const key = k + " " + label + " " + node + " " + sec + " " + row;
      if (seen[key]) return seen[key];
      const e = { k: k, label: label, node: node, sec: sec, row: row, mono: !!mono,
                  q: (label + " " + (extra || "")).toLowerCase() };
      seen[key] = e;
      out.push(e);
      return e;
    };
    /* 메소드는 지면당 한 항목만 둔다. 표의 행에 걸린 쪽이 더 쓸모 있으니 그 쪽을 남긴다. */
    const addMethod = function (m, node, sec, row, extra) {
      const key = node + " " + m;
      const prev = meth[key];
      if (prev) {
        if (prev.sec == null && sec != null) { prev.sec = sec; prev.row = row; }
        if (extra) prev.q += " " + String(extra).toLowerCase();
        return;
      }
      meth[key] = add("메소드", m + "()", node, sec, row,
                      m + " " + (DESC[m] || "") + " " + (extra || ""), true);
    };

    N.forEach(function (n) {
      const pf = PF[n.id];
      add("지면", n.title, n.id, null, null,
          [n.id, n.ko || "", n.file || "", n.kind || "", pf ? pf.src : ""].join(" "));
      /* 한글 이름도 따로 색인한다 — "가챠" 를 치면 버튼 라벨이 아니라 그 지면이 먼저 나와야 한다 */
      if (n.ko && n.ko !== n.title) add("지면", n.ko, n.id, null, null, n.title + " " + n.id);
      if (pf && pf.src) add("프리팹", pf.src, n.id, null, null, n.title + " " + n.id, true);
      sectionsOf(n).forEach(function (sec, si) {
        sec.rows.forEach(function (row, ri) {
          add("버튼", row[0], n.id, si, ri, row[1] + " " + n.title);
          methodsOf(row[1]).forEach(function (m) { addMethod(m, n.id, si, ri, row[0]); });
        });
      });
      pfButtons(n.id).forEach(function (b) {
        const si = b._sec >= 0 ? b._sec : null, ri = b._sec >= 0 ? b._row : null;
        if (b.h) addMethod(b.h, n.id, si, ri, b.n || "");
        if (b.n) add("요소", b.n, n.id, si, ri, n.title + " " + (b.t || ""), true);
        if (b.t) add("버튼", b.t, n.id, si, ri, n.title + " " + (b.n || ""));
      });
      pfDecor(n.id).forEach(function (b) {
        if (b.n) add("요소", b.n, n.id, null, null, n.title + " " + (b.t || ""), true);
      });
    });
    (typeof FBS !== "undefined" ? FBS : []).forEach(function (f) {
      add("FB", f.api, "__fb__", null, null, [f.ko, f.when, f.cond, f.src, f.g].join(" "), true);
    });
    (typeof CTX_STATES !== "undefined" ? CTX_STATES : []).forEach(function (s) {
      add("컨텍스트", s.name + " — " + s.ko, "__ctx__", null, null,
          [s.id, s.type, s.cond].join(" "));
    });
    IDX = out;
    return IDX;
  };

  /* 같은 점수일 때의 종류 우선순위. "PopupCoinClaim" 을 치면 소스 각주가 아니라
     그 지면이 먼저 나와야 한다 — 이름만으로는 길이가 같아 갈리지 않는다. */
  const FX_RANK = { "지면": 0, "프리팹": 1, "메소드": 1, "FB": 1, "컨텍스트": 1, "버튼": 2, "요소": 3 };

  /* 점수: 앞에서 맞을수록 · 이름 자체에서 맞을수록 위로. 같은 점수면 종류 · 짧은 이름 순. */
  const fxScore = function (e, q) {
    const lab = e.label.toLowerCase();
    const i = lab.indexOf(q);
    if (i === 0) return 0;
    if (i > 0) return /[^a-z0-9]/.test(lab.charAt(i - 1)) ? 1 : 2;
    return e.q.indexOf(q) < 0 ? -1 : 3;
  };

  const fxMark = function (label, q) {
    const i = label.toLowerCase().indexOf(q);
    if (i < 0) return esc(label);
    return esc(label.slice(0, i)) + "<mark>" + esc(label.slice(i, i + q.length))
      + "</mark>" + esc(label.slice(i + q.length));
  };

  const findPanel = document.getElementById("find");
  const fxQ = document.getElementById("fx-q");
  const fxList = document.getElementById("fx-list");
  const fxN = document.getElementById("fx-n");
  const FX_MAX = 40;
  let fxHits = [], fxSel = -1;

  const fxClose = function () {
    findPanel.classList.remove("open");
    fxQ.setAttribute("aria-expanded", "false");
    fxHits = []; fxSel = -1;
  };

  const fxPaint = function () {
    Array.prototype.forEach.call(fxList.children, function (el, i) {
      el.classList.toggle("sel", i === fxSel);
    });
    const cur = fxList.children[fxSel];
    if (fxSel >= 0 && cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
  };

  const fxRun = function () {
    const q = fxQ.value.trim().toLowerCase();
    if (q.length < 2) {
      fxN.textContent = "";
      fxList.innerHTML = '<div class="fx-msg">두 글자 이상 입력하세요. '
        + '메소드(<code>onClickMerge</code>) · 지면 이름 · 프리팹(<code>PopupBigCoinClaim</code>) · '
        + '버튼 라벨 · 프리팹 노드 · FB API · 컨텍스트 <b>'
        + buildIndex().length.toLocaleString() + '개</b>에서 찾습니다.</div>';
      findPanel.classList.toggle("open", q.length > 0);
      fxQ.setAttribute("aria-expanded", q.length > 0 ? "true" : "false");
      fxHits = []; fxSel = -1;
      return;
    }
    const idx = buildIndex();
    const scored = [];
    for (let i = 0; i < idx.length; i++) {
      const s = fxScore(idx[i], q);
      if (s >= 0) {
        const rk = FX_RANK[idx[i].k];    /* 지면은 0 — || 로 기본값을 주면 0 이 9 로 뒤집힌다 */
        scored.push([s, rk == null ? 9 : rk, idx[i].label.length, idx[i]]);
      }
    }
    scored.sort(function (a, b) { return a[0] - b[0] || a[1] - b[1] || a[2] - b[2]; });
    fxHits = scored.slice(0, FX_MAX).map(function (x) { return x[3]; });
    fxSel = fxHits.length ? 0 : -1;
    fxN.textContent = scored.length
      ? (scored.length > FX_MAX ? FX_MAX + "/" + scored.length : String(scored.length)) : "";
    if (!fxHits.length) {
      fxList.innerHTML = '<div class="fx-msg">맞는 항목이 없습니다.</div>';
    } else {
      fxList.innerHTML = fxHits.map(function (e, i) {
        const owner = e.node === "__fb__" ? "FB 지면"
          : e.node === "__ctx__" ? "컨텍스트 분기"
          : (byId[e.node] ? byId[e.node].title : e.node);
        return '<div class="fx-it' + (i === 0 ? " sel" : "") + '" role="option" data-i="' + i
          + '" style="--cc: ' + (FX_COLOR[e.k] || "var(--c-system)") + '">'
          + '<span class="fx-k">' + esc(e.k) + '</span>'
          + '<span class="fx-t' + (e.mono ? " mono" : "") + '">' + fxMark(e.label, q) + '</span>'
          + '<span class="fx-w">' + esc(owner) + '</span></div>';
      }).join("");
    }
    findPanel.classList.add("open");
    fxQ.setAttribute("aria-expanded", "true");
    fxList.scrollTop = 0;
  };

  const fxGo = function (i) {
    const e = fxHits[i];
    if (!e) return;
    if (e.node === "__fb__" || e.node === "__ctx__") {
      openScreen(e.node, { reset: true, recenter: false });
    } else {
      openScreen(e.node, { reset: true });
      if (e.sec != null) openCell(e.sec, e.row, true);
    }
    fxClose();
    fxQ.blur();
  };

  fxQ.addEventListener("input", fxRun);
  fxQ.addEventListener("focus", function () { if (fxQ.value.trim()) fxRun(); });
  fxQ.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowDown") {
      ev.preventDefault();
      if (fxHits.length) { fxSel = (fxSel + 1) % fxHits.length; fxPaint(); }
    } else if (ev.key === "ArrowUp") {
      ev.preventDefault();
      if (fxHits.length) { fxSel = (fxSel - 1 + fxHits.length) % fxHits.length; fxPaint(); }
    } else if (ev.key === "Enter") {
      ev.preventDefault();
      fxGo(fxSel);
    } else if (ev.key === "Escape") {
      ev.stopPropagation();
      if (findPanel.classList.contains("open")) fxClose();
      else { fxQ.value = ""; fxQ.blur(); }
    }
  });
  fxList.addEventListener("click", function (ev) {
    const it = ev.target.closest(".fx-it");
    if (it) fxGo(+it.getAttribute("data-i"));
  });
  /* 바깥을 누르면 목록을 접는다. 맵 드래그가 목록에 가려지지 않게 캡처 단계에서 받는다. */
  document.addEventListener("pointerdown", function (ev) {
    if (!findPanel.contains(ev.target)) fxClose();
  }, true);

  /* ============ 부팅 ============ */
  /* 문서에 임베드된 경우엔 새 탭으로 크게 여는 버튼을 붙인다. */
  if (window.self !== window.top) {
    const full = document.createElement("button");
    full.id = "b-full";
    full.textContent = "크게 보기";
    full.title = "새 탭에서 맵만 열기";
    full.addEventListener("click", function () {
      window.open(window.location.href, "_blank", "noopener");
    });
    document.getElementById("tools").appendChild(full);
  }

  const boot = function () {
    measure();
    drawWires();
    buildMini();
    goTop();
  };
  boot();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { measure(); drawWires(); buildMini(); apply(); });
  }
  window.addEventListener("resize", function () { buildMini(); apply(); });
})();
</script>
  </body>
</html>
